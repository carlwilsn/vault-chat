<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>vault-chat phone — BEFORE</title>
<style>
  :root{
    --bg:#1a1a1a; --surface:#242424; --raised:#333333; --line:#383838;
    --text:#ebebeb; --dim:#999999; --primary:#d9d9d9; --primary-fg:#1a1a1a;
    --err:#e14746; --ok:#7fbf7f; --warn:#e0a35a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  svg{display:block}

  .hdr{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:12px 12px 8px;position:relative;z-index:21}
  .icbtn{color:var(--dim);min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative;flex:none}
  .icbtn:active{background:var(--surface)}
  .icbtn svg{width:22px;height:22px}
  body:not(.page-chat) #convBtn{visibility:hidden}
  .reddot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
  .reddot.on{display:block}
  .title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
  .title .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .title .tx{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .sub{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}

  .menu{position:absolute;top:54px;right:10px;background:#262626;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:46;min-width:220px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .menu.on{display:block}
  .mrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;font-size:14.5px;width:100%;text-align:left}
  .mrow:active{background:var(--raised)}
  .mrow.cur{background:#2e2e2e}
  .mrow svg{width:19px;height:19px;color:var(--dim);flex:none}
  .mrow .nm{flex:1}
  .mrow .ct{font-size:11.5px;color:var(--primary-fg);background:var(--primary);border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
  .mrow .ct.warn{background:var(--warn)}
  .mrow .ct.zero{display:none}
  .mdiv{height:1px;background:#2e2e2e;margin:5px 8px}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:48}
  .scrim.on{display:block}
  .cdraw{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);background:#202020;z-index:49;transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column}
  .cdraw.on{transform:none}
  .cdtop{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
  .cdtop b{flex:1;font-size:16px;font-weight:600}
  .newbtn{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--primary-fg);background:var(--primary);border-radius:10px;padding:8px 13px}
  .newbtn svg{width:16px;height:16px}
  .clist{flex:1;overflow-y:auto;padding:4px 0 12px}
  .cclear{flex:0 0 auto;margin:0 14px 14px;border:1px solid #5a302e;border-radius:10px;padding:10px;font-size:13px;color:var(--err);min-height:40px}
  .cclear:active{background:var(--surface)}
  .csec{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#7c7c7c;padding:12px 16px 5px;font-weight:600}
  .crow2{display:block;width:100%;text-align:left;padding:11px 16px}
  .crow2:active{background:var(--surface)}
  .crow2 .t{display:flex;align-items:center;gap:8px}
  .crow2 .nm{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow2 .ag{color:#7c7c7c;font-size:11.5px;flex:none}
  .crow2 .p{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  .body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .page{flex:1;min-height:0;display:none;flex-direction:column}
  body.page-chat #pChat{display:flex}
  body.page-activity #pAct{display:flex}
  body.page-alerts #pAl{display:flex}
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}

  #msgs{flex:1;overflow-y:auto;padding:8px 14px 6px;display:flex;flex-direction:column}
  .m{max-width:90%;margin:0 0 10px;border-radius:15px;padding:9px 13px;word-wrap:break-word;overflow-wrap:anywhere}
  .m.user{align-self:flex-end;background:var(--raised);white-space:pre-wrap;border-bottom-right-radius:5px}
  .m.asst{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
  .hint{margin:auto;text-align:center;color:var(--dim);font-size:14px;line-height:1.65;padding:0 40px;max-width:340px}
  .hint b{color:var(--text);font-weight:600;display:block;font-size:15.5px;margin-bottom:6px}

  .md p{margin:.35em 0}
  .md h1,.md h2,.md h3{margin:.5em 0 .25em;line-height:1.25}
  .md h1{font-size:1.2em}.md h2{font-size:1.1em}.md h3{font-size:1.02em}
  .md pre{background:#161616;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
  .md code{background:#161616;border-radius:4px;padding:1px 4px;font:12px ui-monospace,Menlo,Consolas,monospace}
  .md pre code{background:none;border:none;padding:0}
  .md ul,.md ol{margin:.35em 0;padding-left:1.4em}
  .md table{border-collapse:collapse;margin:.4em 0;font-size:13px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}

  .plancard{background:#1d2420;border:1px solid #34532f;border-radius:13px;padding:12px 13px;margin:3px 0}
  .pc-h{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;margin-bottom:6px}
  .pc-title{font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:4px}
  .pc-desc{font-size:13px;color:#bdbdbd;line-height:1.5;margin-bottom:4px}
  .pc-tasks{margin:5px 0 0;padding-left:18px}
  .pc-tasks li{font-size:13px;color:#d7d7d7;margin:3px 0;line-height:1.45}
  .pc-btns{display:flex;gap:8px;margin-top:12px}
  .pc-approve{flex:1;background:var(--ok);color:#11240f;font-weight:700;font-size:13px;border-radius:9px;padding:9px;min-height:38px}
  .pc-refine{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:9px;padding:9px 16px;min-height:38px}
  .plancard.approved{opacity:.6}
  .plancard.approved .pc-btns{display:none}

  .composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:9px;padding:6px 12px 8px}
  .mic{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);flex:none;display:flex;align-items:center;justify-content:center}
  .mic svg{width:20px;height:20px}
  .field{flex:1;position:relative;display:flex;align-items:flex-end;min-width:0}
  .composer textarea{flex:1;resize:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:21px;padding:10px 50px 10px 15px;font-size:16px;line-height:1.4;font-family:inherit;max-height:120px;outline:none;min-width:0}
  .send{position:absolute;right:5px;bottom:5px;width:33px;height:33px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}

  .sec{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8a8a;padding:15px 18px 7px;font-weight:600}
  .msec{display:flex;align-items:baseline;gap:8px;padding:17px 18px 7px;min-width:0;width:100%;text-align:left}
  .msec:active{background:var(--surface)}
  .msec>span:first-child{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;flex:none}
  .msec b{font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .msec .mc{font-size:11px;color:#8a8a8a;flex:none}
  .msec .mc.dim{color:#6a6a6a}
  .msec .watch{font-size:11px;color:var(--dim);flex:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px}
  .mnote{margin:0 18px 9px;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  .wpill{margin:0 14px 7px;border:1px solid var(--line);border-radius:17px;background:var(--surface);overflow:hidden}
  .wp-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 14px;min-height:37px}
  .wp-head:active{background:var(--raised)}
  .wp-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .wp-t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-age{font-size:10.5px;color:#8a8a8a;flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-body{display:none;padding:0 14px 11px}
  .wp-state{margin:2px 0 0;font-size:12.5px;color:#ababab;line-height:1.5;overflow-wrap:anywhere}
  .wpill.open .wp-body{display:block}
  .wbtns{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
  .wbtn{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:#dcdcdc;min-height:34px}
  .wbtn:active{background:var(--raised)}
  .wbtn.danger{color:var(--err);border-color:#5a302e}
  .wbtn.confirm{background:var(--err);color:#fff;border-color:var(--err)}

  .card{margin:0 14px 10px;background:var(--surface);border-radius:14px;padding:13px 14px;width:calc(100% - 28px);text-align:left;display:block}
  .card:active{background:#282828}
  .card.ask{border:1px solid #5a4a26}
  .card.unread{box-shadow:inset 2.5px 0 0 #6f6f6f}
  .crow{display:flex;gap:12px}
  .ico{width:31px;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13.5px;font-weight:700;background:var(--raised);color:var(--dim)}
  .ico.g{color:var(--ok)} .ico.a{color:var(--warn)} .ico.r{color:var(--err)}
  .cb{flex:1;min-width:0}
  .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ct b{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
  .ct .t{font-size:11px;color:#8a8a8a;flex:none}
  .cs{margin:4px 0 0;font-size:13px;color:#ababab;line-height:1.5;overflow-wrap:anywhere}
  .metabar{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#8a8a8a;font-weight:600;margin:4px 0 2px}
  .reply{position:relative;display:flex;align-items:center;margin-top:10px}
  .rinp{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:9px 42px 9px 14px;color:var(--text);font-size:14px;outline:none;min-width:0;font-family:inherit}
  .rsend{position:absolute;right:5px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .alsum{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .alsum .md{font-size:13px;color:#c9c9c9;line-height:1.5}
  .alsum-load{color:var(--dim);font-size:12px}
  .lbl{color:#8a8a8a;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin-top:9px}
  .earlier{display:block;width:calc(100% - 28px);margin:6px 14px 0;text-align:center;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:38px}
  .empty{padding:30px 38px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6}

  .schedrow{display:flex;align-items:center;gap:10px}
  .schedrow .info{flex:1;min-width:0}
  .schedrow .info b{font-weight:600;font-size:14px;display:block}
  .schedrow .info small{color:var(--dim);font-size:11.5px}
  .sw{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:5px 11px;color:var(--dim);flex:none;min-height:32px}
  .sw.on{color:var(--primary-fg);background:var(--primary);border-color:var(--primary)}
  .del{color:var(--err);font-size:15px;padding:4px 8px;flex:none}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#333;color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70;max-width:86%;text-align:center}
  #toast.show{opacity:1}

  .tag{position:fixed;top:0;left:0;background:#3a2f12;color:#e0a35a;font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;padding:2px 7px;border-bottom-right-radius:8px;z-index:90}
</style>
</head>
<body class="page-chat">
  <div class="tag">Before</div>

  <div class="hdr">
    <button class="icbtn" id="convBtn" aria-label="conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button class="title" id="titleBtn"><span class="dot"></span><span class="tx" id="titleTx">awake</span><span class="sub" id="titleSub">· 1 running</span></button>
    <button class="icbtn" id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="reddot on" id="menudot"></span></button>
  </div>

  <div class="menu" id="menu">
    <button class="mrow cur" data-page="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nm">Chat</span></button>
    <button class="mrow" data-page="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span class="nm">Activity</span><span class="ct" id="mAct">1</span></button>
    <button class="mrow" data-page="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="nm">Alerts</span><span class="ct warn" id="mAl">3</span></button>
    <div class="mdiv"></div>
    <button class="mrow" id="settingsRow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nm">Box &amp; settings</span></button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="cdraw" id="cdraw">
    <div class="cdtop"><b>Conversations</b><button class="newbtn" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New</button></div>
    <div class="clist" id="clist"></div>
    <button class="cclear" id="clearChatsBtn">Clear all chats</button>
  </div>

  <div class="body">
    <section class="page" id="pChat">
      <div id="msgs"></div>
      <div class="composer">
        <button class="mic" aria-label="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 19v3"/></svg></button>
        <div class="field"><textarea id="input" rows="1" placeholder="Message…"></textarea><button class="send" id="sendBtn">↑</button></div>
      </div>
    </section>
    <section class="page" id="pAct"><div class="scroll" id="actScroll"></div></section>
    <section class="page" id="pAl"><div class="scroll" id="alScroll"></div></section>
  </div>

  <div id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
  let toastT = 0;
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); };

  // ---------- minimal markdown (faithful subset of the app's renderer) ----------
  function md(src){
    const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const inline=s=>{let t=esc(s);t=t.replace(/`([^`]+)`/g,"<code>$1</code>");t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");t=t.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");return t;};
    const lines=(src||"").replace(/\r\n/g,"\n").split("\n");let html="",i=0,p=[];
    const flush=()=>{if(p.length){html+="<p>"+p.map(inline).join("<br>")+"</p>";p=[];}};
    while(i<lines.length){const l=lines[i];
      if(/^```/.test(l)){flush();const f=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))f.push(lines[i++]);i++;html+="<pre><code>"+esc(f.join("\n"))+"</code></pre>";continue;}
      if(/^\s*$/.test(l)){flush();i++;continue;}
      const h=l.match(/^(#{1,3})\s+(.*)$/);if(h){flush();const n=h[1].length;html+="<h"+n+">"+inline(h[2])+"</h"+n+">";i++;continue;}
      if(/^\s*\d+[.)]\s+/.test(l)){flush();html+="<ol>";while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){html+="<li>"+inline(lines[i].replace(/^\s*\d+[.)]\s+/,""))+"</li>";i++;}html+="</ol>";continue;}
      if(/^\s*[-*]\s+/.test(l)){flush();html+="<ul>";while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){html+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>";i++;}html+="</ul>";continue;}
      if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){flush();const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));html+="<table><thead><tr>"+cells(l).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";i+=2;while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))html+="<tr>"+cells(lines[i++]).map(c=>"<td>"+c+"</td>").join("")+"</tr>";html+="</tbody></table>";continue;}
      p.push(l);i++;}
    flush();return html;
  }

  // ---------- mock data ----------
  const CHATS = [
    { id: "sup", title: "cockpit nav testing", age: "5m", preview: "shipped the unified app; working through nav" },
    { id: "c1", title: "densing law — readings", age: "90m", preview: "the crossover moves with task difficulty, not just scale" },
    { id: "c2", title: "quick latex question", age: "3h", preview: "block math needs the fences on their own lines" },
  ];
  const MISSIONS = [
    { name: "BitNet 160M MVP", convId: "m1", workers: [
      { convId: "w2", title: "seed-2 retry", lastTool: "Bash", age: "1m",
        state: "seed 2 retry running; seeds 1 & 3 already verified, gap held at +0.13 nat. eval.loss for 1/3 committed under results/." },
      { convId: "wev", title: "eval + writeup", lastTool: "Write", age: "2m",
        state: "building the per-seed comparison table and drafting docs/bitnet-160m-mvp/writeup.md." },
    ] },
    { name: "Quiet watch — repo hygiene", convId: "m2", workers: [], note: "all clean on last sweep; next check at 9pm" },
  ];
  const SCHEDULES = [
    { id: "s1", name: "Morning briefing", label: "daily · 7:00 AM", enabled: true, fired: "2h" },
    { id: "s2", name: "Repo hygiene sweep", label: "every 3h", enabled: true, fired: "40m" },
  ];
  // NOTE (before): the coach notif is just a free-text Notify — generic title,
  // thin body, category guessed by keyword-sniffing the title.
  const NOTIFS = [
    { id: "n1", kind: "ask", title: "Seed 3 diverged", age: "2m", read: false, convId: "w1",
      body: "step 800, +0.05 nat above seed 1. real effect, or match the LR and rerun? tell me how to play it." },
    { id: "n0", kind: "info", title: "Daily coach", age: "5h", read: false, convId: "cch",
      body: "Morning briefing ready." },
    { id: "n2", kind: "info", title: "Worker finished — 3-seed BitNet repro", age: "18m", read: false, convId: "w1",
      body: "all three seeds done; final eval committed; gap held at +0.13 nat." },
    { id: "n3", kind: "info", title: "Stopped an idle box", age: "90m", read: true,
      body: "a box sat at zero GPU utilization for 12 minutes after its job exited — killed it. ~$0.26, nothing billing now." },
  ];
  const REPORTS = {
    w1: "## Result\n\nAll three seeds done.\n\n| seed | eval loss |\n|---|---|\n| 42 | 1.5576 |\n| 43 | 1.5601 |\n| 44 | 1.5588 |\n\nGap held at **+0.13 nat**, U-shaped, plateaus. `eval.loss` JSONL committed under `results/`. Writeup drafted at `docs/bitnet-160m-mvp/writeup.md`.",
    cch: "Morning briefing ready.",
  };

  // ---------- pages / menu ----------
  function setPage(name){
    document.body.classList.remove("page-chat","page-activity","page-alerts");
    document.body.classList.add("page-"+name);
    document.querySelectorAll(".mrow[data-page]").forEach(r=>r.classList.toggle("cur",r.dataset.page===name));
    const tx=$("titleTx"),sub=$("titleSub");
    if(name==="chat"){tx.textContent="awake";sub.textContent="· 1 running";}
    else{tx.textContent=name==="activity"?"Activity":"Alerts";sub.textContent="";}
    if(name==="activity") loadActivity();
    if(name==="alerts") loadAlerts();
  }
  document.querySelectorAll(".mrow[data-page]").forEach(r=>r.onclick=()=>{$("menu").classList.remove("on");setPage(r.dataset.page);});
  $("menuBtn").onclick=(e)=>{e.stopPropagation();$("menu").classList.toggle("on");};
  document.addEventListener("click",()=>$("menu").classList.remove("on"));
  $("menu").addEventListener("click",e=>e.stopPropagation());
  $("settingsRow").onclick=()=>{$("menu").classList.remove("on");toast("(settings drawer)");};
  $("titleBtn").onclick=()=>{ if(!document.body.classList.contains("page-chat")) setPage("chat"); };

  // ---------- conversations drawer ----------
  $("convBtn").onclick=()=>{$("scrim").classList.add("on");$("cdraw").classList.add("on");loadConvs();};
  $("scrim").onclick=()=>{$("scrim").classList.remove("on");$("cdraw").classList.remove("on");};
  $("newBtn").onclick=()=>{$("scrim").classList.remove("on");$("cdraw").classList.remove("on");showHint();toast("New chat");};
  function loadConvs(){
    const box=$("clist");box.innerHTML="";
    box.appendChild(el('<div class="csec">Chats</div>'));
    for(const c of CHATS){
      const b=el('<button class="crow2"><div class="t"><span class="nm"></span><span class="ag"></span></div><div class="p"></div></button>');
      b.querySelector(".nm").textContent=c.title;b.querySelector(".ag").textContent=c.age;b.querySelector(".p").textContent=c.preview;
      b.onclick=()=>{$("scrim").classList.remove("on");$("cdraw").classList.remove("on");setPage("chat");toast("Opened: "+c.title);};
      box.appendChild(b);
    }
  }
  // BEFORE: clearing actually deletes the idle chat files on disk.
  $("clearChatsBtn").onclick=()=>{
    if(!confirm("Delete ALL idle chats? Missions and workers are untouched. This can't be undone.")) return;
    CHATS.length=0; loadConvs(); toast("Cleared 3 chats.");
  };

  // ---------- chat ----------
  function showHint(){ $("msgs").innerHTML='<div class="hint"><b>What needs doing?</b>quick questions get answers. bigger asks get scoped before anything runs.</div>'; }
  function seedChat(){
    const m=$("msgs"); m.innerHTML="";
    m.appendChild(bubble("user","can we reproduce the BitNet 160M MVP? i want it solid across a few seeds."));
    const a=bubble("asst","Worth scoping before anything runs — here's the plan I'd hand off:");
    m.appendChild(a);
    const card=el('<div class="plancard"><div class="pc-h">Proposed plan</div><div class="pc-title">Reproduce the BitNet 160M MVP</div><div class="pc-desc">Three crisp tasks that parallelize; I fan out workers on approval.</div><ul class="pc-tasks"><li>Train seed 42 on the 1700-step config and commit eval.loss</li><li>Train seed 43 on the same config</li><li>Eval all seeds and draft the writeup under docs/</li></ul><div class="pc-btns"><button class="pc-approve">Approve &amp; run</button><button class="pc-refine">Refine</button></div></div>');
    // BEFORE: approving SENDS A NATURAL-LANGUAGE PROMPT to the agent (the exact
    // text the shipping app injects) — the agent then has to interpret it.
    card.querySelector(".pc-approve").onclick=()=>{
      card.classList.add("approved");card.querySelectorAll("button").forEach(b=>b.disabled=true);
      $("msgs").appendChild(bubble("user",'Approved — create the mission "Reproduce the BitNet 160M MVP" for that plan now (StartMission with the full plan as its brief), then confirm it’s underway.'));
      $("msgs").scrollTop=$("msgs").scrollHeight;
      toast("Approved — prompt sent to the agent.");
    };
    card.querySelector(".pc-refine").onclick=()=>toast("(refine — reshape the plan)");
    m.appendChild(card);
  }
  // BEFORE: agent replies sit in bubbles, and there is no math rendering — the
  // $…$ / $$…$$ show up as raw text.
  function showRenderSample(){
    const m=$("msgs"); m.innerHTML="";
    m.appendChild(bubble("user","summarize BitNet’s ternary quantization + the STE trick, with the loss gap"));
    m.appendChild(bubble("asst",
      "## BitNet 160M — quick notes\n\n"+
      "Weights are **ternary**, mapped to $\\{-1,0,+1\\}$ by a scaled sign:\n\n"+
      "$$\\hat{w}=\\alpha\\cdot\\operatorname{sign}(w),\\qquad \\alpha=\\frac{1}{n}\\sum_i |w_i|$$\n\n"+
      "Training uses the *straight-through estimator* — forward quantizes, backward passes the gradient through unchanged:\n\n"+
      "$$\\frac{\\partial\\mathcal{L}}{\\partial w}\\approx\\frac{\\partial\\mathcal{L}}{\\partial\\hat{w}}$$\n\n"+
      "Across three seeds the eval-loss gap held at about $+0.13$ nat:\n\n"+
      "| seed | eval loss |\n|---|---|\n| 42 | 1.5576 |\n| 43 | 1.5601 |\n| 44 | 1.5588 |\n\n"+
      "- inline code `eval.loss` and lists render too\n"+
      "- weights live in $w\\in\\mathbb{R}^{d}$\n\n"+
      "```python\nq = alpha * torch.sign(w)   # ternary\n```"));
  }
  function bubble(role,content){const d=document.createElement("div");d.className="m "+(role==="user"?"user":"asst");if(role==="user")d.textContent=content;else d.innerHTML='<div class="md">'+md(content)+"</div>";return d;}
  $("sendBtn").onclick=()=>{const v=$("input").value.trim();if(!v)return;$("input").value="";$("msgs").querySelector(".hint")&&($("msgs").innerHTML="");$("msgs").appendChild(bubble("user",v));toast("(mock) sent");};
  $("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("sendBtn").click();}});

  // ---------- activity ----------
  function loadActivity(){
    const box=$("actScroll");box.innerHTML="";
    for(const g of MISSIONS){
      const head=el('<button class="msec"><span>Mission</span><b></b><span class="mc"></span><span class="watch">watch ›</span></button>');
      head.querySelector("b").textContent=g.name;
      head.querySelector(".mc").textContent=g.workers.length?g.workers.length+" running":"watching";
      if(!g.workers.length)head.querySelector(".mc").classList.add("dim");
      head.onclick=()=>{setPage("chat");toast("Watching: "+g.name);};
      box.appendChild(head);
      for(const w of g.workers) box.appendChild(workerPill(w,g));
      if(!g.workers.length&&g.note){const n=el('<div class="mnote"></div>');n.textContent=g.note;box.appendChild(n);}
    }
    box.appendChild(el('<div class="sec">Recurring</div>'));
    for(const sc of SCHEDULES){
      const card=el('<div class="card"><div class="schedrow"><div class="info"><b></b><small></small></div><button class="sw"></button><button class="del">✕</button></div></div>');
      card.querySelector("b").textContent=sc.name;
      card.querySelector("small").textContent=sc.label+(sc.fired?" · fired "+sc.fired+" ago":"");
      const sw=card.querySelector(".sw");sw.textContent=sc.enabled?"On":"Off";sw.className="sw"+(sc.enabled?" on":"");
      sw.onclick=()=>{sc.enabled=!sc.enabled;loadActivity();};
      card.querySelector(".del").onclick=()=>{if(confirm('Delete "'+sc.name+'"?')){SCHEDULES.splice(SCHEDULES.indexOf(sc),1);loadActivity();}};
      box.appendChild(card);
    }
    box.appendChild(el('<div style="height:18px"></div>'));
  }
  // BEFORE: worker pill expands INLINE — state + actions render inside the row.
  function workerPill(w,g){
    const pill=el('<div class="wpill"><button class="wp-head"><span class="wp-dot"></span><span class="wp-t"></span><span class="wp-age"></span></button><div class="wp-body"><p class="wp-state"></p><div class="wbtns"><button class="wbtn op">Open thread</button><button class="wbtn danger kl">Kill worker</button></div></div></div>');
    pill.querySelector(".wp-t").textContent=w.title;
    pill.querySelector(".wp-age").textContent=w.lastTool+" · "+w.age;
    pill.querySelector(".wp-state").textContent=w.state;
    pill.querySelector(".wp-head").onclick=()=>pill.classList.toggle("open");
    pill.querySelector(".op").onclick=e=>{e.stopPropagation();setPage("chat");toast("Opened worker: "+w.title);};
    const kl=pill.querySelector(".kl");
    kl.onclick=e=>{e.stopPropagation();if(!kl.classList.contains("confirm")){kl.classList.add("confirm");kl.textContent="Confirm kill";setTimeout(()=>{kl.classList.remove("confirm");kl.textContent="Kill worker";},2200);return;}toast("Worker killed.");};
    return pill;
  }

  // ---------- alerts ----------
  // BEFORE: category line is GUESSED by keyword-sniffing the title.
  function alertClass(n){
    if(n.kind==="ask")return{label:"Needs your reply",ico:"?",cls:"a"};
    if(/fail|error|diverg|crash|wedge/i.test(n.title))return{label:"Something failed",ico:"!",cls:"r"};
    if(/worker|complete|done|finished/i.test(n.title))return{label:"Worker finished",ico:"✓",cls:"g"};
    if(/stopped|idle|cost|\$/i.test(n.title))return{label:"Cost / cleanup",ico:"$",cls:"r"};
    if(/brief|coach|morning|daily|check-?in/i.test(n.title))return{label:"Briefing",ico:"≡",cls:""};
    return{label:"Update",ico:"•",cls:""};
  }
  function loadAlerts(){
    const box=$("alScroll");box.innerHTML="";
    const unread=NOTIFS.filter(n=>!n.read),archived=NOTIFS.filter(n=>n.read);
    const actions=unread.filter(n=>n.kind==="ask"),infos=unread.filter(n=>n.kind!=="ask");
    if(actions.length)box.appendChild(el('<div class="sec">Needs a reply</div>'));
    for(const n of actions)box.appendChild(alertCard(n,true));
    if(infos.length)box.appendChild(el('<div class="sec">Heads-up</div>'));
    for(const n of infos)box.appendChild(alertCard(n,false));
    if(!unread.length)box.appendChild(el('<div class="empty">All caught up — swipe a card left to archive it.</div>'));
    if(archived.length){
      const holder=el('<div style="display:none"></div>');
      for(const n of archived)holder.appendChild(alertCard(n,false));
      const t=el('<button class="earlier"></button>');t.textContent="Archive · "+archived.length;
      t.onclick=()=>{const open=holder.style.display!=="none";holder.style.display=open?"none":"";t.textContent=(open?"Archive · ":"Hide archive · ")+archived.length;};
      box.appendChild(t);box.appendChild(holder);
    }
    box.appendChild(el('<div style="height:18px"></div>'));
  }
  function alertCard(n,isAction){
    const meta=alertClass(n);
    const card=el('<div class="card'+(isAction?" ask":n.read?"":" unread")+'"><div class="crow"><div class="ico"></div><div class="cb"><div class="ct"><b></b><span class="t"></span></div><div class="metabar"></div><p class="cs"></p></div></div></div>');
    const ico=card.querySelector(".ico");ico.textContent=meta.ico;if(meta.cls)ico.classList.add(meta.cls);
    card.querySelector("b").textContent=n.title;
    card.querySelector(".t").textContent=n.age;
    card.querySelector(".metabar").textContent=meta.label+(n.convId?" · tap for summary":"");
    card.querySelector(".cs").textContent=n.body;
    if(isAction&&n.convId){
      const rep=el('<div class="reply"><input class="rinp" placeholder="tell it what to do…"><button class="rsend">↑</button></div>');
      const go=()=>{const v=rep.querySelector(".rinp").value.trim();if(!v)return;rep.querySelector(".rinp").value="";toast("Sent.");};
      rep.querySelector(".rsend").onclick=go;rep.querySelector(".rinp").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
      card.querySelector(".cb").appendChild(rep);
    }
    // BEFORE: tap toggles an INLINE summary that fights the swipe gesture and
    // can't horizontally scroll wide content out from under your finger.
    if(n.convId){
      const det=el('<div class="alsum" style="display:none"></div>');card.querySelector(".cb").appendChild(det);let loaded=false;
      card.addEventListener("click",e=>{
        if(e.target.closest(".rinp,.rsend,.wbtn"))return;
        if(card.dataset.swiped==="1"){card.dataset.swiped="";return;}
        const open=det.style.display!=="none";det.style.display=open?"none":"";
        if(open||loaded)return;loaded=true;
        det.innerHTML='<div class="lbl">What it did</div><div class="md">'+md(REPORTS[n.convId]||"*(no report yet)*")+'</div>';
        const btns=el('<div class="wbtns"><button class="wbtn op">Open thread</button></div>');
        btns.querySelector(".op").onclick=ev=>{ev.stopPropagation();setPage("chat");toast("Opened thread");};
        det.appendChild(btns);
      });
    }
    attachSwipe(card,()=>{n.read=true;setTimeout(loadAlerts,160);});
    return card;
  }
  function attachSwipe(card,action){
    let x0=0,y0=0,dx=0,mode=null;
    const start=(x,y)=>{x0=x;y0=y;dx=0;mode=null;card.style.transition="none";};
    const move=(x,y)=>{if(mode==="v")return;const ndx=x-x0,ndy=y-y0;if(mode===null){if(Math.abs(ndx)<9&&Math.abs(ndy)<9)return;mode=Math.abs(ndx)>Math.abs(ndy)?"h":"v";if(mode==="v")return;}dx=Math.min(0,ndx);card.style.transform="translateX("+dx+"px)";};
    const end=()=>{if(mode!=="h"){mode=null;return;}card.dataset.swiped="1";setTimeout(()=>card.dataset.swiped="",400);mode=null;card.style.transition="transform .18s ease, opacity .18s ease";if(dx<-70){card.style.transform="translateX(-110%)";card.style.opacity="0";action();}else card.style.transform="";};
    card.addEventListener("touchstart",e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    card.addEventListener("touchmove",e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    card.addEventListener("touchend",end);
    let down=false;
    card.addEventListener("mousedown",e=>{if(e.target.closest(".rinp,.rsend"))return;down=true;start(e.clientX,e.clientY);});
    window.addEventListener("mousemove",e=>{if(down)move(e.clientX,e.clientY);});
    window.addEventListener("mouseup",()=>{if(down){down=false;end();}});
  }

  seedChat();

  // deep-link for the demo gallery: ?page=chat|activity|alerts & demo=alert|worker|drawer
  (function demo(){
    const P=new URLSearchParams(location.search);
    const pg=P.get("page"); if(pg) setPage(pg);
    const d=P.get("demo");
    if(d==="alert"){ const c=[...document.querySelectorAll("#alScroll .card")].find(x=>/Worker finished/.test(x.textContent)); if(c) c.click(); }
    else if(d==="worker"){ const h=document.querySelector("#actScroll .wpill .wp-head"); if(h) h.click(); }
    else if(d==="drawer"){ $("convBtn").click(); }
    else if(d==="approve"){ const c=document.querySelector(".pc-approve"); if(c) c.click(); }
    else if(d==="render"){ showRenderSample(); }
  })();
})();
</script>
</body>
