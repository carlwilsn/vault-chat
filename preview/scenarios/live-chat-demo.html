<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live chat demo</title>
<meta name="vc-capabilities" content="ask">
<link rel="stylesheet" href="/app-styles.css">
<style>
  body { margin: 0; font: 13px/1.5 var(--vc-font); background: var(--vc-bg); color: var(--vc-fg); }
  .app { display: flex; flex-direction: column; height: 380px; max-height: 100vh; }
  .log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 6px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--vc-accent); color: var(--vc-bg); }
  .ai { align-self: flex-start; background: var(--vc-surface); border: 1px solid var(--vc-border); }
  .err { align-self: flex-start; color: light-dark(#c03030, #f08a8a); font-size: 12px; }
  .hint { color: var(--vc-muted); font-size: 12px; text-align: center; margin: auto; }
  .row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--vc-border); }
  input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--vc-border); background: var(--vc-surface); color: inherit; font: inherit; outline: none; }
  input:focus { border-color: var(--vc-accent); }
  button { padding: 6px 12px; border-radius: 8px; border: 0; background: var(--vc-accent); color: var(--vc-bg); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .cursor::after { content: "▍"; opacity: .6; }
  .bar { display: flex; justify-content: space-between; padding: 4px 10px; font-size: 11px; color: var(--vc-muted); border-bottom: 1px solid var(--vc-border); }
</style>
</head>
<body>
<div class="app">
  <div class="bar"><span>Live chat: replies come from vc.ask (ephemeral, read-only)</span><span id="status">connecting…</span></div>
  <div class="log" id="log"><div class="hint">Ask anything. Each reply streams from the AI through the app.</div></div>
  <div class="row" id="form">
    <input id="q" placeholder="Say something…" autocomplete="off">
    <button id="go" type="button">Send</button>
  </div>
</div>
<script>
  const log = document.getElementById("log"), q = document.getElementById("q"), go = document.getElementById("go"), status = document.getElementById("status");
  const turns = [];
  function add(cls, text) {
    const hint = log.querySelector(".hint"); if (hint) hint.remove();
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.append(d);
    log.scrollTop = log.scrollHeight; return d;
  }
  if (!window.vc) status.textContent = "not a live page";
  else vc.ready.then(() => { status.textContent = "live · " + vc.theme.mode; });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  go.addEventListener("click", () => send());
  async function send() {
    if (go.disabled) return;
    const text = q.value.trim(); if (!text || !window.vc) return;
    q.value = ""; go.disabled = true;
    add("me", text);
    const bubble = add("ai cursor", "");
    const prompt = turns.slice(-6).map((m) => m.role + ": " + m.text).join("\n") + (turns.length ? "\n" : "") + "user: " + text;
    let reply = "";
    try {
      for await (const chunk of vc.ask(prompt, { system: "You are a friendly assistant inside a small chat widget. Reply in at most three short sentences." })) {
        reply += chunk; bubble.textContent = reply; log.scrollTop = log.scrollHeight;
      }
      turns.push({ role: "user", text }, { role: "assistant", text: reply });
    } catch (err) {
      bubble.remove(); add("err", String(err.message || err));
    }
    bubble.classList.remove("cursor"); go.disabled = false; q.focus();
  }
</script>
</body>
</html>
