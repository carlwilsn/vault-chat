<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vault-chat phone</title>
<style>
  /* The phone at iPhone 17 proportions (402×874), scaled to fit the window's
     height, centred on a plain backdrop — for looking at the phone app full
     screen on a desktop. ?scenario= picks the scenario (default p3-phone). */
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .phone { width: 402px; height: 874px; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 10px #000, 0 0 0 11px #333; transform-origin: center; flex: none; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone"><iframe id="f" allow="microphone; camera"></iframe></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const scenario = q.get("scenario") || "p3-phone";
  const extra = [...q].filter(([k]) => k !== "scenario").map(([k, v]) => `&${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("");
  document.getElementById("f").src = `/after/phone?scenario=${encodeURIComponent(scenario)}&side=after&base=synthetic${extra}`;
  const fit = () => {
    const s = Math.min((innerHeight - 40) / 874, (innerWidth - 40) / 402);
    document.getElementById("phone").style.transform = `scale(${s})`;
  };
  addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
