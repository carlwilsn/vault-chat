[package]
name = "vault-chat"
version = "0.3.66"
description = "Minimal desktop viewer + LLM chat for a folder of markdown notes."
authors = ["Carl Wilson"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "gzip", "rustls-tls", "json", "multipart"], default-features = false }
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "net"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Passphrase-based encryption for the cross-machine key sync (keys.enc).
age = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Linux voice mode: reach into the WebKitGTK webview to grant the microphone
# (getUserMedia) permission, which wry leaves denied by default. Pinned to the
# same version + feature wry uses so the WebView type unifies.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
# WebKitGTK on this stack can't play Web Audio, so voice-mode agent audio is
# played natively instead (see agent_audio in lib.rs). default-features off:
# we feed raw PCM, no format decoders needed.
rodio = { version = "0.19", default-features = false }

