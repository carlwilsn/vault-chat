[package]
name = "vault-chat"
version = "0.10.0"
description = "Minimal desktop viewer + LLM chat for a folder of markdown notes."
authors = ["Carl Wilson"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# "Run in background": close-to-tray + start-at-login so the app stays an
# always-on daemon (scheduler + supervisor wakes keep firing) without a
# visible window. autostart registers the OS login item.
tauri-plugin-autostart = "2"
# One process per machine: a second launch focuses the existing window instead
# of racing it for the embedded server port / scheduler / git sync.
tauri-plugin-single-instance = "2"
# The fixed Undo of the last change (src-tauri/src/safety.rs): Ctrl+Alt+Z works whatever a change did to the page.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "gzip", "rustls-tls", "json", "multipart"], default-features = false }
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "net"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Passphrase-based encryption for the cross-machine key sync (keys.enc).
age = "0.10"
base64 = "0.22"
# Hashes: core bundle and server slot checks (src/core_loader.rs, src/local_server.rs).
sha2 = "0.10"
# Random key for the encrypted headless-Linux secret fallback (keychain_*).
getrandom = "0.2"
# Inline web pages in the chat (src/web_embed.rs): a native browser view laid over the chat, made with wry directly
# (not through Tauri's webview manager) so it carries none of the app's IPC or protocols. Same version Tauri uses.
wry = { version = "0.54", default-features = false }

# The pty `claude setup-token` needs for the one-click sign-in (src/claude_signin.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Linux voice mode: reach into the WebKitGTK webview to grant the microphone
# (getUserMedia) permission, which wry leaves denied by default. Pinned to the
# same version + feature wry uses so the WebView type unifies.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
