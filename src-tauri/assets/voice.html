<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1a1a" />
<!-- Home-screen "app": launch fullscreen/standalone (no browser chrome) on iOS
     and Android when added to the home screen, with a branded icon + dark bars. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="vault voice" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<title>vault-chat · voice</title>
<style>
  /* Matches the app's graphite theme exactly: --background 0 0% 10%, --primary
     0 0% 85% (the bars), --foreground 0 0% 92%, --border 0 0% 22%. No colour. */
  :root{
    --bg:#1a1a1a; --panel:#212121; --line:#383838;
    --text:#ebebeb; --dim:#999999; --bar:#d9d9d9; --err:#e5736b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Fill edge-to-edge: the root must be dark too, or the notch / home-bar /
     overscroll areas show Safari's white default behind the page. */
  html{background:var(--bg);height:100%}
  html,body{margin:0}
  body{
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;text-align:center;
    user-select:none;-webkit-user-select:none;
  }
  .brand{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;
    font-weight:600;letter-spacing:.2px;color:var(--dim);font-size:14px}
  .brand b{color:var(--text)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:34px}

  /* The visualiser: 12 centre-anchored bars, exactly like the desktop app —
     they grow symmetrically from the middle and are driven by real audio. */
  .vizwrap{height:120px;display:flex;align-items:center;justify-content:center;position:relative;width:260px}
  .viz{display:flex;align-items:center;gap:6px;height:96px}
  .bar{width:6px;height:96px;border-radius:4px;background:var(--bar);
    transform:scaleY(.16);transform-origin:center;transition:transform .06s linear}
  .connecting-label{display:none;font-size:15px;font-weight:600;color:var(--dim);
    position:absolute;inset:0;align-items:center;justify-content:center}
  body.connecting .viz{opacity:0}
  body.connecting .connecting-label{display:flex;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}

  .status{font-size:20px;font-weight:600;min-height:26px}
  .sub{color:var(--dim);font-size:14px;min-height:20px;max-width:320px}
  .err{color:var(--err);font-size:13px;max-width:340px;white-space:pre-wrap;margin-top:4px}

  .toggle{margin-top:4px;background:var(--bar);
    color:#1a1a1a;border:none;padding:16px 46px;border-radius:999px;font-size:17px;font-weight:700;
    cursor:pointer;transition:transform .12s ease,filter .2s}
  .toggle:active{transform:scale(.97)}
  body.live .toggle{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:600}
  .toggle[disabled]{opacity:.6}

  /* Mute: only shown while live, pinned bottom-left so it never overlaps the
     centred Stop. Muting stops ANY mic audio reaching the agent — for when you
     stop talking but stay connected (e.g. on a train) and don't want ambient
     noise read as speech. Filled when active. */
  .muteb{position:fixed;left:max(20px,env(safe-area-inset-left));
    bottom:max(26px,env(safe-area-inset-bottom));display:none;
    background:transparent;color:var(--text);border:1px solid var(--line);
    border-radius:999px;padding:14px 24px;font-size:15px;font-weight:600;
    cursor:pointer;transition:transform .12s ease}
  .muteb:active{transform:scale(.97)}
  body.live .muteb{display:block}
  body.muted .muteb{background:var(--bar);color:#1a1a1a;border-color:var(--bar)}

  /* Minimal UI: "vault-chat · voice" title up top, the waves dead-centre, and
     the Start/Stop button pinned to the bottom. The status line + subtitle are
     hidden (elements kept so the JS that writes to them stays a no-op); errors
     still surface via .err just above the button. The "Connecting…" label lives
     inside the waves wrapper, so it shows centred while connecting. */
  .status,.sub{display:none}
  .toggle{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));margin:0 auto;width:fit-content}
  .stage>div{position:fixed;left:0;right:0;bottom:96px;margin:0 auto}
  .stage{gap:0}
  .vizwrap{position:fixed;inset:0;width:auto;height:auto;transform:none}
</style>
</head>
<body>
  <div class="brand"><b>vault-chat</b> · voice</div>
  <div class="stage">
    <div class="vizwrap">
      <div class="viz" id="viz"></div>
      <div class="connecting-label">Connecting…</div>
    </div>
    <div>
      <div id="status" class="status">Tap start to talk</div>
      <div id="sub" class="sub">Live voice to your vault on the box.</div>
      <div id="err" class="err"></div>
    </div>
    <button id="toggle" class="toggle">Start</button>
    <button id="mute" class="muteb" aria-label="mute microphone">Mute</button>
  </div>

<script type="module">
  const NUM_BARS = 12, DECAY = 0.85;
  // Preload the ElevenLabs SDK the moment the page opens — importing it inside
  // the tap was a cold CDN fetch at connect time, the likely root of the
  // "first tap fails, second works" pattern. By tap time it's already here.
  const sdkPromise = import("https://esm.sh/@elevenlabs/client@1.7.0").catch(() => null);
  const token = new URLSearchParams(location.search).get("token") || "";
  const statusEl = document.getElementById("status");
  const subEl = document.getElementById("sub");
  const errEl = document.getElementById("err");
  const toggleBtn = document.getElementById("toggle");
  const muteBtn = document.getElementById("mute");
  const viz = document.getElementById("viz");
  let conv = null, connecting = false, rafId = 0, live = false, muted = false;
  const smoothed = new Array(NUM_BARS).fill(0);

  // Build the 12 bars once.
  const bars = [];
  for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    viz.appendChild(b);
    bars.push(b);
  }

  // Our own Web Audio analyser on the mic stream. On mobile the EL SDK's analyser
  // context can stay suspended and report all-zeros (why the bars sat flat); ours
  // is resumed on the tap and is reliable for the user's input bars.
  let micCtx = null, micAnalyser = null, micBuf = null, autoRetried = false;
  // Agent side. `agentSpeaking` mirrors the SDK's mode (onModeChange), which is
  // derived from the output worklet's actual playback state — it flips true
  // when playback starts and false only when the buffer DRAINS. That's the
  // authoritative "audio is audible right now" window. An earlier build keyed
  // the window to chunk ARRIVAL (last onAudio + 280ms), but the SDK streams a
  // whole turn into the client buffer in a fast burst — so the bars flailed the
  // moment chunks landed and collapsed back to mic-idle while the agent was
  // still audibly mid-sentence (note 852e435b, "audio and wave not synced").
  // The level comes from a real-time envelope: each chunk is sliced into
  // per-50ms RMS levels, queued, and the meter replays the queue at wall-clock
  // rate — the bars move with what the ear is actually hearing.
  let agentSpeaking = false, wasSpeaking = false;
  const SLICE_MS = 50, SLICE_BYTES = (16000 * 2 * SLICE_MS) / 1000; // 16kHz mono PCM16
  const agentEnv = []; let agentEnvPos = 0, agentEnvClock = 0;
  function agentEnvReset() { agentEnv.length = 0; agentEnvPos = 0; agentEnvClock = 0; }

  const setStatus = (s, sub) => { statusEl.textContent = s; if (sub !== undefined) subEl.textContent = sub; };
  const setErr = (e) => { errEl.textContent = e || ""; };
  const micAvailable = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  function teardownAudio() {
    try { if (micCtx) micCtx.close(); } catch {}
    micCtx = null; micAnalyser = null; micBuf = null;
  }

  async function api(path, opts) {
    const sep = path.includes("?") ? "&" : "?";
    return fetch(`${path}${sep}token=${encodeURIComponent(token)}`, opts);
  }

  // Slice a base64 PCM16 chunk from the agent into per-SLICE_MS RMS levels
  // (0..1) and queue them for real-time replay. If a chunk isn't PCM16 the
  // numbers are still energy-correlated, so the bars degrade rather than freeze.
  function agentEnvPush(b64) {
    const s = atob(b64);
    for (let off = 0; off + 1 < s.length; off += SLICE_BYTES) {
      const end = Math.min(s.length, off + SLICE_BYTES);
      let sum = 0, count = 0;
      for (let i = off; i + 1 < end; i += 4) { // every 2nd sample — plenty for a loudness meter
        let v = s.charCodeAt(i) | (s.charCodeAt(i + 1) << 8);
        if (v >= 32768) v -= 65536;
        sum += v * v; count++;
      }
      const rms = count ? Math.sqrt(sum / count) / 32768 : 0;
      agentEnv.push(Math.min(1, rms * 4));
    }
    // Compact the consumed prefix so a long monologue can't grow the queue.
    const consumed = Math.floor(agentEnvPos);
    if (consumed > 400) { agentEnv.splice(0, consumed); agentEnvPos -= consumed; }
  }
  // Level of the slice that is audibly playing right now. Advances the cursor
  // by wall-clock time between frames (clamped so a throttled tab can't leap
  // past unplayed audio); holds the last slice if the cursor briefly outruns
  // chunk arrival — mode flips back to listening right after anyway.
  function agentEnvLevel() {
    const now = performance.now();
    const dt = agentEnvClock ? Math.min(now - agentEnvClock, 200) : 0;
    agentEnvClock = now;
    agentEnvPos += dt / SLICE_MS;
    if (!agentEnv.length) return 0;
    return agentEnv[Math.min(agentEnv.length - 1, Math.floor(agentEnvPos))];
  }

  function bin(data, n) {
    const out = new Array(n).fill(0);
    if (!data || !data.length) return out;
    const per = Math.max(1, Math.floor(data.length / n));
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let j = 0; j < per; j++) s += data[i * per + j] || 0;
      out[i] = s / per / 255;
    }
    return out;
  }

  // Same logic as the desktop VoiceCockpit: agent output spectrum while it
  // speaks (when there's real audio), otherwise the live mic input. Smoothed
  // with decay; bars floor at ~16% so they never fully collapse.
  function meter() {
    // Drive off `live` (set in onConnect), NOT `conv`: the SDK calls onConnect —
    // which kicks off meter() — *before* `conv = await startSession()` resolves,
    // so conv is still null on the first frame. Guarding on conv here killed the
    // whole rAF loop and left the bars frozen even while audio was flowing.
    if (!live) return;
    // Speaking mirrors the SDK's playback window (onModeChange) — driven by the
    // output worklet actually playing audio, not by chunk arrival.
    const speaking = agentSpeaking;
    if (speaking !== wasSpeaking) {
      wasSpeaking = speaking;
      document.body.classList.toggle("speaking", speaking);
      setStatus(speaking ? "Speaking" : "Listening", speaking ? "" : "I'm listening…");
    }
    let raw;
    try {
      if (speaking) {
        // Agent: replay the real loudness envelope of the audio being heard,
        // shaped into a centre hump so it reads like a spectrum rather than a
        // flat block.
        const lvl = agentEnvLevel();
        raw = [];
        for (let i = 0; i < NUM_BARS; i++) {
          const shape = 0.55 + 0.45 * Math.sin((i / (NUM_BARS - 1)) * Math.PI);
          raw.push(lvl * shape);
        }
      } else if (micAnalyser) {
        // You (input): our own analyser — works even when the SDK reports zeros.
        micAnalyser.getByteFrequencyData(micBuf);
        raw = bin(micBuf, NUM_BARS);
      } else {
        raw = bin(conv && conv.getInputByteFrequencyData && conv.getInputByteFrequencyData(), NUM_BARS);
      }
    } catch { raw = new Array(NUM_BARS).fill(0); }
    // Muted + not the agent's turn → flat bars, a visible "you're not being
    // heard" signal (the mic audio is also actually cut at the SDK).
    if (muted && !speaking) raw = new Array(NUM_BARS).fill(0);
    for (let i = 0; i < NUM_BARS; i++) {
      const decayed = smoothed[i] * DECAY;
      smoothed[i] = raw[i] > decayed ? raw[i] : decayed;
      const h = 0.16 + Math.min(1, smoothed[i]) * 0.84;
      bars[i].style.transform = `scaleY(${h.toFixed(3)})`;
    }
    rafId = requestAnimationFrame(meter);
  }

  function buildClientTools(toolNames) {
    const tools = {};
    for (const name of toolNames || []) {
      tools[name] = async (params) => {
        try {
          const r = await api("/tool", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, arguments: params || {} }),
          });
          return await r.text();
        } catch (e) { return "error: " + String(e); }
      };
    }
    return tools;
  }

  async function start() {
    if (connecting || conv) return;
    if (!micAvailable()) {
      setStatus("Needs a secure link", "");
      setErr("This page isn't HTTPS, so the browser blocks the mic. Open the https://…ts.net link from vault-chat Settings → Phone voice (or http://localhost:8848 on this same computer).");
      return;
    }
    connecting = true; setErr("");
    document.body.classList.add("connecting");
    toggleBtn.textContent = "…"; toggleBtn.disabled = true;
    setStatus("Connecting…", "Waking the session on the box — one sec.");
    try {
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // Set up our mic analyser — but NEVER block the connect on it. Awaiting
      // resume() here hung iOS (the user gesture is gone after the await above),
      // so resume fire-and-forget; the analyser starts producing data once the
      // context wakes (the session audio resumes it anyway).
      try {
        // Reuse the context already unlocked synchronously in the click handler
        // (creating a second, suspended one here would defeat the iOS unlock).
        micCtx = micCtx || new (window.AudioContext || window.webkitAudioContext)();
        micCtx.resume().catch(() => {});
        const src = micCtx.createMediaStreamSource(micStream);
        micAnalyser = micCtx.createAnalyser();
        micAnalyser.fftSize = 64;
        micAnalyser.smoothingTimeConstant = 0.5;
        src.connect(micAnalyser);
        micBuf = new Uint8Array(micAnalyser.frequencyBinCount);
      } catch { micAnalyser = null; }
      // The host pushes context on open; if the phone connects in that brief
      // gap the server answers 503. Retry for ~10s so it self-heals instead of
      // failing instantly.
      let cfg = null;
      for (let attempt = 0; attempt < 6; attempt++) {
        const r = await api("/session", { method: "POST" });
        if (r.ok) { cfg = await r.json(); break; }
        if (r.status === 503 && attempt < 5) {
          setStatus("Waking the host…", "The vault-chat app is getting ready — hang on.");
          await new Promise((res) => setTimeout(res, 2000));
          continue;
        }
        throw new Error(`session ${r.status}: ${(await r.text()).slice(0, 200)}`);
      }
      if (!cfg) throw new Error("session not ready");
      // Preloaded at page open; re-import only if that first fetch failed.
      const sdk = (await sdkPromise) || (await import("https://esm.sh/@elevenlabs/client@1.7.0"));
      const { Conversation } = sdk;
      // Watchdog: a silently-stalled handshake must FAIL, not hang forever —
      // startSession has no timeout of its own, and a hang here is invisible
      // (no throw, so even the auto-retry never fires). 15s then reject; if the
      // late session ever does resolve, end it so it can't leak.
      let timedOut = false, watchdog = 0;
      const sessionPromise = Conversation.startSession({
        signedUrl: cfg.signedUrl,
        overrides: {
          agent: { prompt: { prompt: cfg.systemPrompt || "" }, language: "en", firstMessage: "" },
          tts: { voiceId: cfg.voiceId },
        },
        dynamicVariables: cfg.dynamicVariables || {},
        clientTools: buildClientTools(cfg.toolNames),
        onConnect: () => {
          if (timedOut) return;
          connecting = false; autoRetried = false; live = true;
          muted = false; document.body.classList.remove("muted"); muteBtn.textContent = "Mute";
          document.body.classList.remove("connecting");
          document.body.classList.add("live");
          toggleBtn.textContent = "Stop"; toggleBtn.disabled = false;
          setStatus("Listening", "Just talk — I'm on.");
          meter();
        },
        onDisconnect: () => { if (!timedOut) teardown(); },
        onError: (m) => setErr(typeof m === "string" ? m : (m?.message || "voice error")),
        // The agent's real audio chunks: queue their loudness envelope; the
        // meter replays it in sync with playback (see agentEnvLevel). Chunks
        // arrive in a fast burst well ahead of the audio the user hears, so
        // arrival time itself must never drive the bars.
        onAudio: (b64) => { try { agentEnvPush(b64); } catch {} },
        onMessage: ({ message, role }) => { const text = (message || "").trim(); if (!text) return; api("/voice-transcript", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: role === "user" ? "user" : "assistant", text }) }).catch(() => {}); },
        // Mode is the SDK's authoritative playback signal: "speaking" while the
        // output worklet is consuming audio, "listening" once the buffer drains
        // (or a barge-in cuts it). When it leaves "speaking", everything that
        // arrived has been heard — drop the envelope so a stale tail can't
        // animate silence.
        onModeChange: ({ mode }) => {
          agentSpeaking = mode === "speaking";
          if (!agentSpeaking) agentEnvReset();
        },
      });
      sessionPromise.then((c) => {
        clearTimeout(watchdog);
        if (timedOut && c) { try { c.endSession(); } catch {} }
      }).catch(() => { clearTimeout(watchdog); });
      conv = await Promise.race([
        sessionPromise,
        new Promise((_, rej) => { watchdog = setTimeout(() => {
          timedOut = true;
          rej(new Error("connect timed out after 15s"));
        }, 15000); }),
      ]);
      clearTimeout(watchdog);
    } catch (e) {
      connecting = false;
      teardownAudio();
      document.body.classList.remove("connecting");
      // First attempt often hiccups (mic/session warm-up) — retry once
      // automatically so it doesn't take two taps.
      if (!autoRetried) {
        autoRetried = true;
        setStatus("Reconnecting…", "First attempt hiccuped — retrying.");
        setTimeout(() => start(), 800);
        return;
      }
      toggleBtn.textContent = "Start"; toggleBtn.disabled = false;
      setErr(String(e?.message || e));
      setStatus("Tap start to talk", "Couldn't connect — tap to retry.");
    }
  }

  // Mute/unmute the mic mid-session. setMicMuted stops outgoing audio at the SDK,
  // so the agent literally can't hear you (no ambient noise read as speech) until
  // you unmute. Reflected in the button + flat bars (the status line is hidden).
  function setMuted(m) {
    muted = m;
    try { if (conv && conv.setMicMuted) conv.setMicMuted(m); } catch {}
    document.body.classList.toggle("muted", m);
    muteBtn.textContent = m ? "Unmute" : "Mute";
    setStatus(m ? "Muted" : "Listening", m ? "Mic off — tap Unmute to talk." : "I'm listening…");
  }
  muteBtn.addEventListener("click", () => { if (live) setMuted(!muted); });

  function teardown() {
    live = false; muted = false; document.body.classList.remove("muted");
    cancelAnimationFrame(rafId); rafId = 0;
    teardownAudio();
    autoRetried = false;
    agentSpeaking = false; wasSpeaking = false; agentEnvReset();
    smoothed.fill(0);
    for (const b of bars) b.style.transform = "scaleY(.16)";
    document.body.classList.remove("live", "speaking", "connecting");
    toggleBtn.textContent = "Start"; toggleBtn.disabled = false;
    setStatus("Tap start to talk", "Live voice to your vault on the box.");
    conv = null; connecting = false;
  }

  async function stop() {
    try { if (conv) await conv.endSession(); } catch {}
    teardown();
  }

  // iOS WebAudio unlock: the EL SDK creates + resumes its own AudioContext and
  // loads audioWorklet modules deep inside startSession (after getUserMedia and
  // our /session round-trip). By then the tap's user-activation is spent, so on
  // iOS Safari addModule()/resume() never settle and onConnect never fires — the
  // session just hangs until the 15s watchdog. Resuming a context AND playing a
  // 1-sample silent blip synchronously here, inside the gesture, gives the page
  // sticky audio activation so the SDK's later resume()/addModule() succeed.
  toggleBtn.addEventListener("click", () => {
    if (conv) { stop(); return; }
    try {
      micCtx = micCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (micCtx.state === "suspended") micCtx.resume().catch(() => {});
      const b = micCtx.createBuffer(1, 1, 22050);
      const s = micCtx.createBufferSource();
      s.buffer = b; s.connect(micCtx.destination); s.start(0);
    } catch {}
    start();
  });
  if (!token) {
    setErr("Missing token — open the link from vault-chat Settings.");
  } else if (!micAvailable()) {
    setStatus("Needs a secure link", "");
    setErr("This page isn't HTTPS, so the browser won't allow the mic. Open the https://…ts.net link from vault-chat Settings → Phone voice (or http://localhost:8848 on this same computer).");
  }
</script>
</body>
</html>
