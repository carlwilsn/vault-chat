<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="var(--bg)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="vault-chat" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>vault-chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    /* ===== surfaces: void black; "fills" are breath-thin white washes ===== */
    --bg:#000000;             /* pure-black root */
    --panel:#000000;          /* deep panels: menus, sheets, drawers, code, keyboard */
    --surface:#000000;        /* cards, message bubbles, inputs */
    --fill:rgba(255,255,255,.03);   /* raised fills: plan card, idle hint, pressed card */
    --raised:rgba(255,255,255,.05); /* raised chips & pills, pressed rows */
    --fill-2:rgba(255,255,255,.06); /* keyboard keys, toast */
    --fill-3:rgba(255,255,255,.08); /* selected / current / hover / divider fills */
    /* ===== lines: alpha hairlines (weak -> strong) ===== */
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.13);
    --line-3:rgba(255,255,255,.18);
    --line-4:rgba(255,255,255,.24);
    --ring:rgba(255,255,255,.35);      /* live-edge ring */
    --border-sel:rgba(255,255,255,.50);/* chosen option border */
    /* ===== text: white at opacity tiers (bright -> faint) ===== */
    --primary:rgba(255,255,255,.92);  /* primary accent ink (send, active) */
    --text:rgba(255,255,255,.92);     /* body text */
    --ok:rgba(255,255,255,.70);       /* "go" accent: approve, connected, eyebrows */
    --text-hi:rgba(255,255,255,.92);
    --text-bright:rgba(255,255,255,.86);
    --text-body:rgba(255,255,255,.78);
    --text-strong:rgba(255,255,255,.70);
    --text-secondary:rgba(255,255,255,.62);
    --muted:rgba(255,255,255,.50);
    --dim:rgba(255,255,255,.50);
    --label:rgba(255,255,255,.45);
    --label-2:rgba(255,255,255,.40);
    --faint:rgba(255,255,255,.30);
    --white:#ffffff;          /* max-contrast ink on error buttons */
    --primary-fg:#000000;     /* ink on primary/light fills */
    --link:rgba(255,255,255,.92);   /* markdown links (underlined, no hue) */
    --accent:rgba(255,255,255,.70); /* billing chip (was teal) */
    /* ===== attention: structure, not hue (was cool blue) ===== */
    --warn:rgba(255,255,255,.85); --warn-ink:rgba(255,255,255,.06); --warn-line:rgba(255,255,255,.22);
    /* ===== error: the ONLY chromatic family — failure red ===== */
    --err:#ff453a;
    --err-bg:#1a0d0c;         /* offline banner bg */
    --err-line:#3a1d1a;       /* offline banner border */
    --err-line-2:#4a221f;     /* danger button borders */
    --err-text:#f2b1ac;       /* offline banner text */
    --err-text-2:#f7c9c5;     /* offline banner emphasis */
    --danger:#ff453a;         /* mic-mute red */
    /* ===== amber -> achromatic (snags read by shape/weight, not colour) ===== */
    --amber:rgba(255,255,255,.85);      /* snag "!" */
    --amber-line:rgba(255,255,255,.22); /* warn report border */
    --amber-text:rgba(255,255,255,.75); /* warn report emphasis */
    --ask-line:rgba(255,255,255,.22);   /* ask-card border */
    /* ===== overlays / glows ===== */
    --scrim:rgba(0,0,0,.6);
    --scrim-2:rgba(0,0,0,.65);
    --mute-bg:rgba(255,69,58,.15);
    --mute-line:rgba(255,69,58,.55);
    --ok-glow:rgba(255,255,255,.5);
    --err-glow:rgba(255,69,58,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);height:100%}
  html,body{margin:0;overflow:hidden;overscroll-behavior:none}
  /* Full-screen shell via CSS, NOT JS. In a browser tab 100dvh (the dynamic
     viewport) is right — it tracks the visible area so the composer never hides
     behind Safari's toolbar. But in an iOS home-screen (standalone) PWA, iOS treats
     the translucent status-bar band as retractable UI, so 100dvh/100svh come up
     ~safe-area-top short of the screen (measured 812 on an 874px iPhone) and leave a
     dead strip at the bottom — the "shifted up" look. 100lvh is the true full-screen
     height there, so standalone overrides to it below. Keyboard lift is a --kb
     padding applied only while the keyboard is up (body.kbup). */
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media all and (display-mode:standalone){ body{height:100lvh} }
  body.kbup{padding-bottom:var(--kb,0px)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  svg{display:block}

  /* header */
  .hdr{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 12px 8px;position:relative;z-index:21}
  .icbtn{color:var(--dim);min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative;flex:none}
  .icbtn:active{background:var(--surface)}
  .icbtn svg{width:22px;height:22px}
  body:not(.page-chat) #convBtn{visibility:hidden}
  .reddot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
  .reddot.on{display:block}
  /* The conversations icon mirrors the row dots: pulsing white if any thread is
     generating, steady white if one finished while you weren't looking. */
  .reddot.think{background:var(--primary);animation:pul 1.4s ease-in-out infinite}
  .reddot.solid{background:var(--primary)}
  .title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
  /* Solid connection dot — green = connected, red = offline. No pulsing:
     it's a status light, not an activity meter. */
  .title .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  body.offline .title .dot{background:var(--err)}
  .title .tx{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .sub{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
  .vpill{display:none;align-items:center;gap:6px;font-size:12px;color:var(--ok);border:1px solid var(--line-2);border-radius:16px;padding:5px 11px;flex:none}
  body.voicemin .vpill{display:flex}
  .vpill .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}

  .offbar{display:none;align-items:center;gap:9px;margin:0 14px 6px;background:var(--err-bg);border:1px solid var(--err-line);border-radius:11px;padding:8px 13px;font-size:12.5px;color:var(--err-text);flex:0 0 auto}
  body.offline .offbar{display:flex}
  .offbar b{font-weight:600;color:var(--err-text-2)}

  /* ☰ page menu */
  /* z-index 55 so the nav menu can open ABOVE the settings drawer (z50) — the
     settings page's top-right control is now this same burger, not a close X. */
  .menu{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:55;min-width:220px;display:none;box-shadow:0 14px 40px var(--scrim)}
  .menu.on{display:block}
  .mrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;font-size:14.5px;width:100%;text-align:left}
  .mrow:active{background:var(--raised)}
  .mrow.cur{background:var(--fill-3)}
  .mrow svg{width:19px;height:19px;color:var(--dim);flex:none}
  .mrow .nm{flex:1}
  .mrow .ct{font-size:11.5px;color:var(--primary-fg);background:var(--primary);border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
  .mrow .ct.warn{background:var(--warn)}
  .mrow .ct.zero{display:none}
  .mdiv{height:1px;background:var(--fill-3);margin:5px 8px}

  /* left conversations drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);display:none;z-index:48}
  .scrim.on{display:block}
  .cdraw{position:fixed;top:0;left:0;bottom:0;width:min(84vw,330px);background:var(--panel);z-index:49;transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .cdraw.on{transform:none}
  .cdtop{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
  .cdtop b{flex:1;font-size:16px;font-weight:600}
  .newbtn{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--primary-fg);background:var(--primary);border-radius:10px;padding:8px 13px}
  .newbtn svg{width:16px;height:16px}
  .clist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px}
  .cclear{flex:0 0 auto;margin:0 14px calc(env(safe-area-inset-bottom) + 14px);border:1px solid var(--err-line-2);border-radius:10px;padding:10px;font-size:13px;color:var(--err);min-height:40px}
  .cclear:active{background:var(--surface)}
  .csec{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--label-2);padding:12px 16px 5px;font-weight:600}
  button.csec.wsec{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 16px;min-height:40px}
  button.csec.wsec:active{background:var(--surface)}
  .wsec .chv{font-size:12px;color:var(--label-2)}
  .crow2{display:block;width:100%;text-align:left;padding:11px 16px}
  .crow2:active{background:var(--surface)}
  .crow2 .t{display:flex;align-items:center;gap:8px}
  .crow2 .rd{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  /* generating = white pulsing "thinking" dot; done-but-unseen = steady solid. */
  .crow2 .rd.think{background:var(--primary);animation:pul 1.4s ease-in-out infinite}
  .crow2 .rd.unseen{background:var(--primary)}
  .crow2 .nm{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow2 .ag{color:var(--label-2);font-size:11.5px;flex:none}
  .crow2 .p{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding-left:0}

  /* pages */
  .body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .page{flex:1;min-height:0;display:none;flex-direction:column}
  body.page-chat #pChat{display:flex}
  body.page-activity #pAct{display:flex}
  body.page-alerts #pAl{display:flex}
  body.page-notes #pNotes{display:flex}
  /* overflow-x:hidden: feeds scroll vertically ONLY — one unwrappable card must
     never turn the whole page into an accidental sideways scroller. */
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  /* notes detail (expanded card) */
  .ndetail{margin-top:9px;border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:9px}
  .nanchor{font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .nquote{font-size:12.5px;color:var(--text);border-left:2px solid var(--line);padding-left:9px;white-space:pre-wrap}
  .ndraft{font-size:13px;color:var(--text);white-space:pre-wrap}
  .nturn{display:flex;flex-direction:column;gap:3px}
  .nrole{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .ntext{font-size:13px;line-height:1.45;white-space:pre-wrap;color:var(--text)}
  /* new-note composer */
  .ncompose{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-bottom:1px solid var(--line)}
  .ncompose textarea{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;resize:none;line-height:1.4;max-height:120px;overflow-y:auto;font-family:inherit}
  .ncompose textarea::placeholder{color:var(--dim)}
  .nadd{flex:none;background:var(--primary);color:var(--primary-fg);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600}
  .nadd:disabled{opacity:.5}

  /* chat */
  #msgs{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 14px 6px;display:flex;flex-direction:column}
  #msgs .md,#msgs .amsg,#msgs .m{overflow-wrap:anywhere}
  .m{max-width:90%;margin:0 0 10px;border-radius:15px;padding:9px 13px;word-wrap:break-word;overflow-wrap:anywhere}
  .m.user{align-self:flex-end;background:var(--raised);white-space:pre-wrap;border-bottom-right-radius:5px}
  .m.asst{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
  .m.sys{align-self:center;background:none;color:var(--dim);font-size:12px;font-style:italic;text-align:center}
  .m.queued{opacity:.55}
  /* Tool calls collapse to a "Ran N steps" summary at the end of the reply
     (tap to expand). The agent's "thinking" sign is a circular pulse under the
     text while it works — no "running ·" bar and no streaming cursor. */
  .steps{margin-top:11px}
  .steps-h{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:11.5px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .steps-h .sck{width:13px;height:13px;color:var(--text);flex:none}
  .steps-h .scv{width:13px;height:13px;color:var(--dim);flex:none;transition:transform .15s}
  .steps.open .steps-h .scv{transform:rotate(180deg)}
  .steps-list{display:none;flex-direction:column;gap:9px;margin-top:9px}
  .steps.open .steps-list{display:flex}
  .steps-list .step{font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
  .thinking{display:flex;align-items:center;gap:11px;padding:11px 0 6px;color:var(--dim);font-size:12px}
  .thinking .tlbl{color:var(--dim);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0;transition:opacity .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .thinking .tlbl.show{opacity:.7}
  .thinking .elapsed{color:var(--dim);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;opacity:.55;margin-left:auto;flex:none}
  .pulse{display:inline-block;position:relative;width:8px;height:8px;margin-left:2px;flex:none}
  .pulse:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--primary);animation:pul 1.5s infinite}
  .pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--primary);animation:ping 1.8s infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
  #connpip{display:none}
  .hint{margin:auto;text-align:center;color:var(--dim);font-size:14px;line-height:1.65;padding:0 40px;max-width:340px}
  .hint b{color:var(--text);font-weight:600;display:block;font-size:15.5px;margin-bottom:6px}

  .md p{margin:.35em 0}
  .md h1,.md h2,.md h3{margin:.5em 0 .25em;line-height:1.25}
  .md h1{font-size:1.2em}.md h2{font-size:1.1em}.md h3{font-size:1.02em}
  .md pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
  .md code{background:var(--panel);border-radius:4px;padding:1px 4px;font:12px ui-monospace,Menlo,Consolas,monospace}
  .md pre code{background:none;border:none;padding:0}
  .md blockquote{border-left:3px solid var(--line);margin:.4em 0;padding:.05em .8em;color:var(--dim)}
  .md ul,.md ol{margin:.35em 0;padding-left:1.4em}
  .md a{color:var(--link);text-decoration:none;word-break:break-all}
  .md img{max-width:100%;border-radius:8px;margin:.3em 0}
  .md table{border-collapse:collapse;margin:.4em 0;font-size:13px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .md hr{border:none;border-top:1px solid var(--line);margin:.7em 0}

  /* North Star proposal card (```plan block) */
  .plancard{background:var(--fill);border:1px solid var(--line-2);border-radius:13px;padding:12px 13px;margin:3px 0}
  .pc-h{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;margin-bottom:6px}
  .pc-title{font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:4px}
  .pc-desc{font-size:13px;color:var(--text-strong);line-height:1.5;margin-bottom:4px}
  .pc-dw{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:9px 0 3px}
  .pc-tasks{margin:5px 0 0;padding-left:18px}
  .pc-tasks li{font-size:13px;color:var(--text-bright);margin:3px 0;line-height:1.45}
  .pc-btns{display:flex;gap:8px;margin-top:12px}
  .pc-approve{flex:1;background:var(--ok);color:var(--panel);font-weight:700;font-size:13px;border-radius:9px;padding:9px;min-height:38px}
  .pc-approve:active{opacity:.85}
  .pc-refine{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:9px;padding:9px 16px;min-height:38px}
  .pc-refine:active{background:var(--raised)}
  .plancard.approved{opacity:.6}
  .plancard.approved .pc-btns{display:none}

  .composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:9px;padding:6px 12px calc(env(safe-area-inset-bottom) + 8px)}
  .mic{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);flex:none;display:flex;align-items:center;justify-content:center}
  .mic:active{background:var(--raised)}
  .mic svg{width:20px;height:20px}
  .field{flex:1;position:relative;display:flex;align-items:flex-end;min-width:0}
  .composer textarea{flex:1;resize:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:21px;padding:10px 50px 10px 15px;font-size:16px;line-height:1.4;font-family:inherit;max-height:120px;outline:none;min-width:0}
  .send{position:absolute;right:5px;bottom:5px;width:33px;height:33px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
  .send:disabled{opacity:.35}
  /* Stop = interrupt generation, the same calm affordance as send — NOT a red
     "kill". Real kills live in Activity (per-worker) and Settings (kill-all). */
  .send.stop{font-size:13px}

  /* cards */
  .sec{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--label);padding:15px 18px 7px;font-weight:600}
  .msec{display:flex;align-items:baseline;gap:8px;padding:17px 18px 7px;min-width:0;width:100%;text-align:left}
  .msec:active{background:var(--surface)}
  .msec>span:first-child{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;flex:none}
  .msec b{font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .msec .mc{font-size:11px;color:var(--label);flex:none}
  .msec .mc.dim{color:var(--faint)}
  .msec .watch{font-size:11px;color:var(--dim);flex:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px}
  .mnote{margin:0 18px 9px;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  /* A mission is a CONTAINER card — its name on top, its worker pills nested
     inside it — so a mission and its workers read as one unit. */
  .mgroup{margin:11px 14px 4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .mgroup .msec{padding:14px 17px 12px;align-items:center}
  /* The name shrinks-to-content (ellipsis on overflow) so the worker-count chip
     sits right ALONGSIDE it on the left, not pushed to the far edge. */
  .mgroup .msec b{flex:0 1 auto}
  .mgroup .wpill{margin:0 9px 9px;background:var(--raised);border-color:var(--line-2)}
  .mgroup .wpill:last-child{margin-bottom:11px}
  .mgroup .wp-head:active{background:var(--fill-3)}
  /* Worker count = a small chip INLINE beside the mission name (not a separate
     row below). Tap it to expand the pill list in place; collapsed by default.
     Per-mission expanded state is held in memory (expandedMissions) so a
     background refresh doesn't re-collapse what you opened. */
  .wcount{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:2px 9px;background:var(--raised);color:var(--dim);white-space:nowrap}
  .wcount:active{color:var(--text);background:var(--fill-3)}
  .wcount .wcn{font-weight:600;color:var(--text-strong)}
  .wcount .wt-cv{font-size:9px;color:var(--faint);width:8px;flex:none;text-align:center}
  .whold{padding-top:2px}
  /* Archive: collapsed list of completed missions, low-key under the live board. */
  .arch-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:15px 18px 8px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--label);font-weight:600}
  .arch-h:active{color:var(--text)}
  .arch-cv{font-size:10px;color:var(--faint);width:11px;flex:none}
  .arch-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin:0 14px 7px;width:calc(100% - 28px);padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .arch-row:active{background:var(--raised)}
  .arch-ico{flex:none;display:flex;align-items:center;color:var(--dim)}
  .arch-ico.r{color:var(--err)}
  .arch-ico svg{width:16px;height:16px;display:block}
  .arch-t{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arch-age{font-size:10.5px;color:var(--label);flex:none}
  /* worker pills: one short line per worker, tap to expand state + actions */
  .wpill{margin:0 14px 7px;border:1px solid var(--line);border-radius:17px;background:var(--surface);overflow:hidden}
  .wp-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 14px;min-height:37px}
  .wp-head:active{background:var(--raised)}
  .wp-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .wp-t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-age{font-size:10.5px;color:var(--label);flex:none;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-body{display:none;padding:0 14px 11px}
  .wp-state{margin:2px 0 0;font-size:12.5px;color:var(--text-secondary);line-height:1.5;overflow-wrap:anywhere}
  .wpill.open .wp-body{display:block}
  .card{margin:0 14px 10px;background:var(--surface);border-radius:14px;padding:13px 14px;width:calc(100% - 28px);text-align:left;display:block}
  .card:active{background:var(--fill)}
  .card.ask{border:1px solid var(--ask-line)}
  .card.unread{box-shadow:inset 2.5px 0 0 var(--faint)}
  .crow{display:flex;gap:12px}
  .ico{width:31px;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13.5px;font-weight:700;background:var(--raised);color:var(--dim)}
  .ico.g{color:var(--ok)} .ico.a{color:var(--warn)} .ico.r{color:var(--err)}
  .ico svg{width:18px;height:18px;display:block}
  .cb{flex:1;min-width:0}
  .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ct b{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
  .ct .t{font-size:11px;color:var(--label);flex:none}
  .cs{margin:4px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.5;overflow-wrap:anywhere}
  .tag{display:inline-block;margin-top:7px;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .reply{position:relative;display:flex;align-items:center;margin-top:10px}
  .rinp{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:9px 42px 9px 14px;color:var(--text);font-size:14px;outline:none;min-width:0;font-family:inherit}
  .rinp::placeholder{color:var(--label)}
  .rsend{position:absolute;right:5px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .empty{padding:30px 38px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6}
  .metabar{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--label);font-weight:600;margin:4px 0 2px}
  .earlier{display:block;width:calc(100% - 28px);margin:6px 14px 0;text-align:center;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:38px}
  .earlier:active{background:var(--surface)}
  .earlier.clearall{margin-bottom:8px;color:var(--muted)}
  .earlier.danger{color:var(--err);border-color:var(--err-line-2)}
  .dismiss{margin-top:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:12.5px;min-height:34px}
  .dismiss:active{background:var(--raised)}
  /* ---- unified AskUser: "Needs you" deliberation card (feed) ----
     Monochrome, matching the rest of the app: a normal neutral card (surface/
     line grays), a subtle near-white status dot + label as the only "needs you"
     cue, a top-right chat icon that opens the deliberation sheet ("dig in"), the
     one primary action rendered in near-white (--primary), and an always-present
     freeform answer field with the send arrow INSET (the real composer style). */
  /* overflow:hidden + anywhere-wrapping below: a long unbreakable option label or
     ask ("dummy/BLOCKER_INPUT_THAT_DOES_NOT_EXIST.txt") must WRAP inside the card,
     never widen it past the viewport into a sideways-scrolling feed. */
  .card.needsyou{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 14px;cursor:pointer;overflow:hidden}
  .card.needsyou:active{background:var(--raised)}
  .needs-lbl{display:flex;align-items:center;gap:7px}
  .needs-lbl .d{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none}
  .needs-lbl .t{font-size:11.5px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.6px}
  .needs-lbl .digin{margin-left:auto;flex:none;color:var(--dim);display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-6px -6px -6px 0;border-radius:8px}
  .needs-lbl .digin:active{background:var(--raised);color:var(--text)}
  .needs-lbl .digin svg{width:18px;height:18px}
  .needs-q{font-size:14.5px;line-height:1.44;margin:8px 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .needs-qa{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:2px}
  /* min-width:0 is load-bearing: flex items default to min-width:auto, so a long
     option label made the button UNSHRINKABLE and pushed the row past the card. */
  .needs-qa button{flex:1 1 40%;min-width:0;overflow-wrap:anywhere;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--raised);color:var(--text);font-family:inherit;min-height:36px}
  .needs-qa button:active{opacity:.8}
  .needs-qa button.prim,.supask-opt.prim{border-color:var(--text);font-weight:700}
  .card.needsyou.supask{margin:2px 0 4px}
  .supask-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
  .supask-defer{border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:inherit}
  .supask-defer:active{opacity:.7}
  .supask-hint{font-size:11.5px;color:var(--dim)}
  .needs-defer{border:none;background:transparent;color:var(--dim);font-size:12px;font-weight:600;padding:6px 2px;margin-top:4px;font-family:inherit}
  .needs-defer:active{opacity:.7}
  /* Freeform answer: the real message composer — send arrow INSET, right-aligned
     inside the field (reusing .rinp/.rsend geometry). */
  .needs-ff{position:relative;display:flex;align-items:center}
  .needs-ff input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:18px;padding:9px 42px 9px 14px;font-size:14px;outline:none;font-family:inherit;min-width:0}
  .needs-ff input::placeholder{color:var(--label)}
  .needs-ff .rsend{position:absolute;right:5px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;flex:none}
  .needs-ff .rsend svg{width:15px;height:15px}
  /* ---- deliberation sheet: inline verbose option cards + probe (monochrome) ---- */
  .delib-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:2px 0 0}
  .delib-ask{font-size:14.5px;line-height:1.5;margin:6px 0 2px;color:var(--text);overflow-wrap:anywhere}
  .delib-opt{border:1px solid var(--line);background:var(--raised);border-radius:13px;padding:12px 13px;cursor:pointer;transition:border-color .15s,background .15s;margin-top:10px;overflow:hidden}
  .delib-opt:hover,.delib-opt:active{border-color:var(--line-3);background:var(--fill-3)}
  .delib-opt.prim{border-color:var(--line-3)}
  .delib-opt .ot{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0;flex-wrap:wrap;overflow-wrap:anywhere}
  .delib-opt .ot .pick{margin-left:auto;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;flex:none}
  .delib-opt .ot .pick svg{width:13px;height:13px}
  .delib-opt .ob{font-size:12.8px;line-height:1.5;color:var(--text-secondary);margin-top:6px;overflow-wrap:anywhere;min-width:0}
  /* Decided asks: options go inert; the one the user picked stays highlighted. */
  .delib-opt.dead{pointer-events:none;opacity:.72}
  .delib-opt.chosen{border-color:var(--border-sel);background:var(--fill-3);opacity:1}
  .delib-opt.chosen .pick{color:var(--text)}
  #delibDecision.deciding{opacity:.55;pointer-events:none;transition:opacity .15s}
  .delib-done{margin-top:12px;font-size:13px;color:var(--dim);overflow-wrap:anywhere}
  .delib-done b{color:var(--text);font-weight:600}
  /* [ask redesign] option cards the ask agent proposes inside the conversation —
     same card language as the decision card's options, spaced as a group */
  .delib-proposed{margin:4px 0 12px}
  .delib-proposed .delib-opt:first-child{margin-top:6px}
  /* Archived needs-you card: the recorded decision, one quiet line. */
  .needs-decided{font-size:13px;color:var(--dim);margin-top:6px;overflow-wrap:anywhere}
  .needs-decided b{color:var(--text);font-weight:600}
  /* A formal decision in a thread — the tapped option / committed answer,
     rendered as a receipt chip, not a chat bubble. */
  .tdecision{border:1px solid var(--line-3);background:var(--raised);border-radius:12px;padding:9px 12px;margin:12px 0 2px;font-size:13px;line-height:1.5;overflow-wrap:anywhere;color:var(--text)}
  .tdecision .td-l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
  /* (delib-bub/delib-conv are gone: the ask/info sheet conversation now renders
     with the SAME threadHtml as a supervisor sheet — one conversation look.) */
  /* Note edit sheet (swipe a note right to open). */
  .note-edit{width:100%;min-height:38vh;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:14px;line-height:1.5;outline:none;font-family:inherit;box-sizing:border-box}
  /* Superseded deliberation rounds stacked above the live card. */
  .delib-round{opacity:.62;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .delib-ask.rdim{color:var(--text-secondary);font-size:13.5px}
  .delib-opt.mini{padding:7px 11px;margin-top:6px}
  .delib-opt.mini .ot{font-size:13px}
  /* Mission-head "needs you" chip: a compact icon, not wrapping words. */
  .needschip{margin-left:8px;width:24px;height:24px;border-radius:8px;border:1px solid var(--warn-line);color:var(--warn);background:var(--warn-ink);display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .needschip svg{width:14px;height:14px}
  /* No-options ask: the ONE composer doubles as the answer box — this labeled
     commit action under it sends the typed text as the formal answer. */
  .ans-commit{width:100%;margin-top:8px;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;border:1px solid var(--line-3);background:var(--raised);color:var(--text);font-family:inherit}
  .ans-commit:active{opacity:.8}
  .ans-commit:disabled{opacity:.5}
  /* The probe input reuses the app composer's .rinp/.rsend (inset send arrow). */
  .alsum{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .alsum .md{font-size:13px;color:var(--text-body);line-height:1.5}
  .alsum-load{color:var(--dim);font-size:12px}

  .mtitle{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .mtitle b{font-weight:600;font-size:15px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
  .pill{font-size:12px;font-weight:500;flex:none;display:inline-flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .pill.run{color:var(--ok)} .pill.blk{color:var(--warn)}
  .goal{font-size:12.5px;color:var(--dim);line-height:1.5;margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line);overflow-wrap:anywhere}
  .wk{margin:0 14px 9px;background:var(--panel);border-radius:13px;overflow:hidden;width:calc(100% - 28px)}
  .wh{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:left;min-height:46px}
  .wh .s{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:50%;font-size:11px;background:var(--raised);color:var(--dim)}
  .wh .s.g{color:var(--ok)} .wh .s.run{color:var(--ok)}
  .wh .nm{flex:1;font-size:14px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wh .mt{font-size:11.5px;color:var(--dim);flex:none;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wd{display:none;padding:0 14px 13px 14px;font-size:12.5px;color:var(--text-secondary);line-height:1.55;overflow-wrap:anywhere}
  .wk.open .wd{display:block}
  .lbl{color:var(--label);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin-top:9px}
  .wbtns{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
  .wbtn{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:var(--text-bright);min-height:34px}
  .wbtn:active{background:var(--raised)}
  .wbtn.danger{color:var(--err);border-color:var(--err-line-2)}
  .wbtn.confirm{background:var(--err);color:var(--white);border-color:var(--err)}
  .schedrow{display:flex;align-items:center;gap:10px}
  .schedrow .info{flex:1;min-width:0}
  .schedrow .info b{font-weight:600;font-size:14px;display:block;overflow-wrap:anywhere}
  .schedrow .info small{color:var(--dim);font-size:11.5px;overflow-wrap:anywhere}
  .del{color:var(--err);font-size:15px;padding:4px 8px;flex:none}

  /* keyboard (verbatim) */
  #kb{flex:0 0 auto;background:var(--panel);padding:7px 4px calc(env(safe-area-inset-bottom) + 6px);display:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  body.kbopen.page-chat #kb{display:block}
  body.kbopen .composer{padding-bottom:8px}
  /* System keyboard up: the keyboard covers the home-indicator strip, so the
     safe-area inset would be dead space between the textbox and the keyboard.
     Drop it to a flush 8px. (--kb>0 => `kbup`, set by the visualViewport handler.) */
  body.kbup .composer{padding-bottom:8px}
  /* Same gap, same fix for the supervisor/mission reply footer (the bottom sheet
     is lifted flush onto the keyboard, so its safe-area inset is dead space too). */
  body.kbup .sheet-foot{padding-bottom:8px}
  .kblayer{display:none}.kblayer.active{display:block}
  .kbrow{display:flex;gap:5px;margin:0 0 8px;justify-content:center}
  .kbrow:last-child{margin-bottom:0}
  .kbrow.indent{padding:0 5%}
  .kbk{flex:1;height:44px;background:var(--fill-2);border-radius:6px;color:var(--text);font-size:19px;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
  .kbk.spec{background:var(--fill);font-size:14px;flex:1.4}
  .kbk.space{flex:4.6;font-size:13px;color:var(--dim)}
  .kbk.ret{flex:2;font-size:20px}
  .kbk.down{background:var(--fill-3)}.kbk.spec.down{background:var(--fill-2)}
  .kbk.lit{background:var(--primary);color:var(--primary-fg)}
  .kbk.caps{box-shadow:inset 0 0 0 2px var(--primary)}
  #kb.up .kbk.let{text-transform:uppercase}

  /* settings drawer (right) */
  #drawer{position:fixed;inset:0;background:var(--scrim-2);display:none;z-index:50}
  #drawer.open{display:block}
  /* ===== the Claude screen (was Settings) — feedback queue front + per-report
     conversations. Full-screen page; keyboard handled the sheet way: `.editing`
     reserves --kb as INSIDE bottom padding so the top never moves and only the
     pinned composer rides up (see .sheet.editing). ===== */
  #drawer .panel{position:absolute;inset:0;width:100%;background:var(--surface);padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column}
  #drawer .panel.editing{padding-bottom:calc(var(--kb,0px) + 8px)}
  .cl-hd{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:2px 10px 10px;border-bottom:1px solid var(--line)}
  .cl-seg{flex:1;display:flex;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:2px}
  .cl-seg button{flex:1;text-align:center;font-size:13px;padding:6px 0;border-radius:8px;color:var(--dim)}
  .cl-seg button.on{background:var(--fill-3);color:var(--text);font-weight:600}
  .cl-back{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .cl-back .tt{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 13px;-webkit-overflow-scrolling:touch}
  .fb-new{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px dashed var(--line-3);border-radius:12px;padding:11px 13px;color:var(--text-secondary);font-size:13.5px;margin-bottom:14px}
  .fb-new svg{width:17px;height:17px;flex:none}
  .fb-lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--label);margin:2px 2px 9px}
  /* Done-section header carries a neutral "Clear" so confirmed-fixed reports
     don't pile up forever (report ca5eb45a). */
  .fb-done-hd{display:flex;align-items:center;justify-content:space-between}
  .fb-done-hd .fb-lbl{margin:2px 2px 0}
  .fb-clear{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);padding:2px 4px;min-height:30px}
  .fb-clear:active{color:var(--text)}
  .fb-card{width:100%;text-align:left;display:block;border:1px solid var(--line-2);border-radius:13px;padding:12px 13px;margin-bottom:9px;background:var(--fill)}
  .fb-card:active{background:var(--fill-3)}
  .fb-card .t{font-size:14px;color:var(--text);margin-bottom:8px;line-height:1.35}
  .fb-card.dn{opacity:.68}
  .fb-st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
  .fb-st svg{width:14px;height:14px;flex:none}
  .fb-ver{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--faint)}
  .fb-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
  .fb-dot.busy{animation:pulse 1.2s ease-in-out infinite}
  .fb-card.reop{border-color:var(--err-line-2)}
  .fb-card.reop .fb-st{color:var(--err-text)}
  .fb-confirm{display:flex;align-items:center;gap:6px;margin-top:9px}
  .fb-confirm .q{flex:1;font-size:12px;color:var(--text-secondary)}
  .fb-pill{font-size:12px;border:1px solid var(--line-3);border-radius:8px;padding:5px 13px;color:var(--text)}
  .fb-pill.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:600}
  .cl-brief{border:1px solid var(--line-2);border-radius:13px;background:var(--fill);padding:12px 13px;margin-bottom:14px}
  .cl-brief .eb{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--label);margin-bottom:6px}
  .cl-brief .rep{font-size:13.5px;color:var(--text-body);line-height:1.45;white-space:pre-wrap}
  .cl-brief .meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
  .coder-log{display:flex;flex-direction:column;gap:9px}
  .coder-msg{max-width:86%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.45;font-size:13.5px;word-wrap:break-word;overflow-wrap:anywhere}
  .coder-msg.u{align-self:flex-end;background:var(--fill-3);color:var(--text);border-bottom-right-radius:5px}
  .coder-msg.a{align-self:flex-start;background:var(--fill);border:1px solid var(--line);color:var(--text-body);border-bottom-left-radius:5px}
  .coder-msg.t{align-self:flex-start;color:var(--dim);font-style:italic}
  .cl-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 13px 4px}
  /* the Claude-screen composer wears the SAME skin as the app's main .composer:
     a hairline-ring pill (transparent, .5px --line-2, 22px) with the send arrow
     INSET as a primary circle, and the rest-width→full-width focus effect. */
  .coder-input{position:relative;display:flex;align-items:flex-end;min-width:0;background:transparent;border:.5px solid var(--line-2);border-radius:22px;max-width:88%;margin:0 auto;transition:max-width .34s var(--ease-out)}
  .coder-input:focus-within{max-width:100%}
  .coder-input textarea{flex:1;background:transparent;color:var(--text);border:none;border-radius:21px;padding:10px 50px 10px 15px;font:inherit;font-size:16px;line-height:1.4;resize:none;max-height:120px;outline:none;min-width:0}
  .coder-send{position:absolute;right:5px;bottom:5px;width:33px;height:33px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;flex:none}
  .coder-send:disabled{opacity:.35}
  .coder-send svg{width:18px;height:18px}
  .cl-gear{border-bottom:1px solid var(--line);padding:10px 13px;display:none;flex-direction:column;gap:10px;flex:0 0 auto}
  .cl-gear.open{display:flex}
  .cl-gear .grow{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-body)}
  .sw{width:44px;height:26px;border-radius:13px;background:var(--fill-3);border:1px solid var(--line-2);position:relative;flex:none}
  .sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .18s ease,background .18s ease}
  .sw.on{background:var(--primary);border-color:var(--primary)}
  .sw.on i{transform:translateX(18px);background:var(--primary-fg)}
  #drawer h3{margin:0;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  #drawer .row{font-size:13px;background:var(--panel);border-radius:9px;padding:9px 11px}
  #drawer .row b{display:block;font-size:13px}
  #drawer .row small{color:var(--dim)}
  .btn{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:9px;padding:11px;font-weight:600;font-size:14px;margin-top:4px;min-height:44px}
  .btn.warn{color:var(--err);border-color:var(--err-line-2)}
  .btn.solid{background:var(--primary);color:var(--primary-fg);border:none}
  .note{font-size:12px;color:var(--dim)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:var(--fill-2);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70;max-width:86vw;text-align:center}
  #toast.show{opacity:1}
  .gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:var(--dim)}

  /* voice */
  #voice{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:60}
  body.voice #voice{display:flex}
  body.voicemin #voice{display:none}
  .vtop{display:flex;justify-content:flex-end;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 10px 0}
  .vmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:0 30px}
  .viz{display:flex;align-items:center;gap:6px;height:96px}
  .vbar{width:6px;height:96px;border-radius:4px;background:var(--primary);transform:scaleY(.16);transform-origin:center;transition:transform .06s linear}
  .vconn{display:none;font-size:15px;font-weight:600;color:var(--dim);animation:pulse 1.2s ease-in-out infinite}
  body.vconnecting .viz{display:none}
  body.vconnecting .vconn{display:block}
  .verr{color:var(--err);font-size:13px;max-width:320px;white-space:pre-wrap;text-align:center;min-height:18px}
  .vend{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:calc(env(safe-area-inset-bottom) + 36px)}
  .vx{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
  .vx svg{width:24px;height:24px}
  .vbtns{display:flex;gap:20px;align-items:center}
  body.vmicmuted #vMuteBtn{background:var(--mute-bg);border-color:var(--mute-line);color:var(--danger)}
  .vhint{font-size:11.5px;color:var(--faint)}
  .vhint .chev{display:inline-block;width:12px;height:12px;vertical-align:-1px}

  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== redesign: bubble-free replies, bottom sheets, spec, scheduled ===== */
  /* agent replies render bubble-free (ChatGPT/Claude-style): full-width markdown,
     no surface. user + system messages keep their bubbles. */
  .amsg{align-self:stretch;max-width:100%;width:100%;margin:2px 0 14px}
  .amsg.queued{opacity:.55}
  .amsg.stream .cursor{display:inline-block;width:7px;height:14px;background:var(--primary);vertical-align:-2px;animation:pulse 1s infinite}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:1px 0;margin:.5em 0}

  /* connection light lives in the menu, right edge of Box & settings */
  .connpip{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 7px var(--ok-glow)}
  body.offline .connpip{background:var(--err);box-shadow:0 0 7px var(--err-glow)}

  /* clearing chats is cosmetic — neutral, not a destructive red */
  .cclear{color:var(--dim);border-color:var(--line)}

  /* mission header: tap row → supervisor thread; [spec] → criterion + state */
  .msec{align-items:center}
  .spec{font-size:11px;color:var(--ok);flex:none;border:1px solid var(--line-2);border-radius:7px;padding:4px 11px;font-weight:600;min-height:30px}
  .spec:active{background:var(--fill)}

  /* worker pill = one-line summary; tap opens its read-only artifact sheet */
  .wp-head{padding:9px 13px 9px 14px}
  .wp-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .wp-main .wp-t{flex:none;display:block}
  .wp-sum{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .wp-dot.warn{background:var(--warn)} .wp-dot.done{background:var(--faint)}
  .chev{color:var(--faint);font-size:15px;flex:none}

  /* alerts: 2-line summary clamp on the card; full report lives in the sheet */
  .cs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .schedcard .chev{margin-left:auto}

  /* ---- bottom sheet (the detail surface) ---- */
  .sheet-scrim{position:fixed;inset:0;background:var(--scrim-2);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
  .sheet-scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1),height .26s ease;z-index:81;max-height:64%;display:flex;flex-direction:column;box-shadow:0 -12px 40px var(--scrim-2)}
  /* The open sheet sits at its resting spot — NEVER translated up by the keyboard.
     Lifting the whole sheet (translateY(-kb)) dragged its TOP up into the status
     bar / notch on keyboard-open ("the top of the sheet should not expand because
     I opened my keyboard — it should stay in the same spot"). */
  .sheet.on{transform:none}
  /* Keyboard up on a sheet input: keep the sheet's box (top AND height) fixed, and
     reserve the keyboard height as INSIDE bottom padding. box-sizing:border-box
     means the padding eats into the fixed height rather than growing the box, so
     the top never moves — only the pinned .sheet-foot composer rides up above the
     keyboard while .sheet-body (flex:1,min-height:0) shrinks and scrolls. */
  .sheet.editing{padding-bottom:var(--kb,0px)}
  .sheet-grabwrap{padding:7px 0 3px;flex:none;cursor:grab;touch-action:none;display:flex;justify-content:center}
  .sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line-2)}
  .sheet-head{display:flex;align-items:flex-start;gap:11px;padding:4px 16px 8px;flex:none;touch-action:none}
  .sheet-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;font-weight:700;background:var(--raised);color:var(--dim)}
  .sheet-ico.g{color:var(--ok)} .sheet-ico.a{color:var(--warn)} .sheet-ico.r{color:var(--err)}
  .sheet-ico svg{width:19px;height:19px;display:block}
  .sh-meta{flex:1;min-width:0}
  .sheet-intent{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--label);font-weight:600}
  .sheet-title{font-size:16px;font-weight:600;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
  .sheet-x{color:var(--dim);font-size:16px;width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;align-self:center}
  /* Just the arrow — no boxed background (note 7a420a05). It's the sheet's
     primary back affordance, so render it in full text colour, not dim. */
  .sheet-back{color:var(--text);width:30px;height:34px;margin-left:-5px;flex:none;display:flex;align-items:center;justify-content:center;align-self:center}
  .sheet-back:active{opacity:.5}
  .sheet-back svg{width:21px;height:21px}
  .sheet-action{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--dim);flex:none;align-self:center;min-height:30px;white-space:nowrap}
  .sheet-action:active{background:var(--raised)}
  .sheet-action.danger{color:var(--err);border-color:var(--err-line-2)}
  .sheet-action.confirm{background:var(--err);color:var(--white);border-color:var(--err)}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
  /* conversation content wraps; only code/tables keep their own internal scroll */
  .sheet-body .md{overflow-wrap:anywhere}
  .thread,.tmsg,.amsg{min-width:0;max-width:100%}
  /* the reply is an auto-growing textarea that sits above the keyboard */
  .sheet-foot .reply{align-items:flex-end}
  .sheet-foot .rinp{resize:none;line-height:1.4;max-height:120px;overflow-y:auto}
  .sheet-foot .rsend{bottom:6px;top:auto}
  .sheet-body .md{font-size:13.5px;color:var(--text-body);line-height:1.55}
  .sheet-body .lbl{color:var(--label);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin:14px 0 5px}
  /* Workers section header inside a mission sheet, tappable to expand/collapse
     the worker rows (collapsed by default so they don't eat the thread's space). */
  .sheet-body .wktoggle{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:14px 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--label)}
  .sheet-body .wktoggle:active{color:var(--text)}
  .sheet-body .wktoggle .wt-cv{font-size:9px;color:var(--faint);width:9px;flex:none;text-align:center}
  .sheet-body .wktoggle b{font-weight:600;color:var(--label)}
  .sheet-foot{flex:none;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);background:var(--panel)}
  .sheet-foot .reply{margin-top:0}
  /* A decision alert's single bottom CTA — opens the asking chat to reply there
     (no inline composer in alerts). Primary, full-width, centered. */
  .reply-cta{display:block;width:100%;background:var(--ok);color:var(--panel);font-weight:700;font-size:15px;border-radius:12px;padding:13px;min-height:46px;text-align:center;border:none;font-family:inherit}
  .reply-cta:active{opacity:.85}
  .thread{display:flex;flex-direction:column;margin:4px 0 2px}
  /* Internal worker-report wake: a neutral centered note, distinct from the
     user's own (right) and the supervisor's (left) turns. */
  .treport{align-self:center;max-width:92%;margin:2px 0 10px;padding:6px 11px;background:var(--raised);border:1px solid var(--line);border-radius:10px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.45;overflow-wrap:anywhere}
  .treport b{color:var(--text-strong);font-weight:600}
  .treport.warn{border-color:var(--amber-line)}
  .treport.warn b{color:var(--amber-text)}
  /* The chain of substantive updates: each entry is a meaningful development —
     a thing it did, or a snag it hit and corrected — checked off as it lands. A
     rail down the left ties them into one line of progress.

     Marker geometry is the load-bearing detail here. EVERY marker (dot, check,
     snag, the live ring) is centred on the same x — the rail — and is filled with
     the SHEET BG so it punches a clean gap in the rail and the line never bleeds
     through a glyph. They share that centre, so they line up exactly down the
     column instead of each sitting at its own offset (the old ✓/!/dot each had a
     different `left`, which is what read as "translucent marks that don't line
     up"). Contrast is bumped a notch from the old near-invisible greys. */
  .ttl{margin:2px 0 0;border-left:1.5px solid var(--line-3);padding-left:18px}
  .ttl-step{position:relative;margin:0 0 14px}
  .ttl-step:last-child{margin-bottom:2px}
  /* Base node: a small solid dot, centred on the rail (its own opaque fill masks
     the line). Used for any step without a more specific state. */
  .ttl-step::before{content:"";position:absolute;left:-21.5px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
  /* Done / snag: the glyph sits in a sheet-filled disc at the SAME centre as the
     dot, so the rail gaps cleanly around it and all markers align. Neutral grey
     for a done thought; amber reserved for the one thing that matters — a snag. */
  .ttl-step.done::before,
  .ttl-step.snag::before{content:"✓";left:-25px;top:2px;width:14px;height:14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:50%;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .ttl-step.snag::before{content:"!";color:var(--amber)}
  .ttl-th{font-size:13px;color:var(--text-hi);line-height:1.6;overflow-wrap:anywhere}
  .ttl-th.dim{color:var(--dim);font-style:italic}
  .tl-reply{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  /* The in-flight beat: a quiet "working…" with a hollow grey marker. NO token
     stream, NO pulse — the user wants the reasoning, not a thread of raw text. */
  #liveEdge{margin-top:12px}
  /* The "working…" node is a hollow ring, sheet-filled so the rail is masked
     behind it (not bleeding through the transparent centre) — same centre as
     every other marker so the live edge lines up with the finished steps above. */
  .ttl-step.ttl-cur::before{content:"";background:var(--panel);border:1.5px solid var(--ring);box-sizing:border-box;width:11px;height:11px;left:-23.5px;top:4px;border-radius:50%}
  /* Idle supervisor isn't asleep — it's READY for you (waiting on its workers,
     free to take a question). Neutral, not a warning. */
  .idlehint{margin:12px 0 2px;padding:9px 12px;background:var(--fill);border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--dim);line-height:1.5}
  .tmsg{display:flex;flex-direction:column;margin-bottom:10px}
  .tmsg.user{align-items:flex-end} .tmsg.asst{align-items:flex-start}
  .tmsg .sender{font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--label-2);font-weight:700;margin:0 5px 3px}
  .tmsg .m{font-size:13px;margin:0;max-width:92%}
  .tmsg .amsg{font-size:13px;margin:0}
  .speclist{list-style:none;margin:9px 0 0;padding:0}
  .speclist li{display:flex;gap:9px;font-size:13px;color:var(--text-body);margin:7px 0;line-height:1.45}
  .speclist .bx{flex:none;color:var(--ok)} .speclist .bx.off{color:var(--faint)}
  .gtxt{font-size:14.5px;color:var(--text);line-height:1.45;margin-top:3px;font-weight:500}
  /* "Done when" components — the approved checklist that defines the mission. */
  .dwlist{list-style:none;margin:6px 0 0;padding:0}
  .dwlist li{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;color:var(--text-bright);line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line)}
  .dwlist .dwb{flex:0 0 8px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-4);margin-top:4px}
  /* Checked off once the supervisor completed the mission. */
  .dwlist .dwb.done{background:var(--ok);border-color:var(--ok)}
  .specrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px}
  .specrow .sc{font-size:13px;color:var(--text);font-weight:600}
  .readonly{font-size:11.5px;color:var(--label-2);margin-top:14px;border-top:1px solid var(--line);padding-top:10px;line-height:1.5}

  /* ===== INK design layer (2026-07-10) — monochrome OLED + the Depth drawer.
     Appended last so equal-specificity rules override the base design. ===== */
  :root{ --ease-out:cubic-bezier(.23,1,.32,1); --ease-sheet:cubic-bezier(.32,.72,0,1) }
  /* press feedback on every control except the high-frequency keyboard */
  button{transition:transform .15s var(--ease-out),opacity .15s ease,background-color .2s ease,color .2s ease}
  button:active{transform:scale(.97)}
  #kb button:active{transform:none}
  button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(255,255,255,.4)}
  body{font-variant-numeric:tabular-nums}
  /* the ONLY gradient fade in the app: the conversation thread's scroll edges.
     Per-edge, gated on SCROLL POSITION — a surface at rest never dims its first
     line (note 25b7b572: "premature shadow effects make reading the first line
     unpleasant"); the top edge only dissolves once content is actually scrolled
     off above, the bottom only while there's more below. */
  #msgs.fade-top,.scroll.fade-top,.clist.fade-top,.sheet-body.fade-top{--mask-t:32px}
  #msgs.fade-bot,.scroll.fade-bot,.clist.fade-bot,.sheet-body.fade-bot{--mask-b:32px}
  #msgs.fade-top,#msgs.fade-bot,.scroll.fade-top,.scroll.fade-bot,.clist.fade-top,.clist.fade-bot,.sheet-body.fade-top,.sheet-body.fade-bot{mask-image:linear-gradient(to bottom,transparent,black var(--mask-t,0px),black calc(100% - var(--mask-b,0px)),transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,black var(--mask-t,0px),black calc(100% - var(--mask-b,0px)),transparent)}
  .sheet{transition:transform .5s var(--ease-sheet)}
  a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
  .title .tx{letter-spacing:-.02em}
  /* icons: the original set at native (bold) stroke, a touch larger */
  .icbtn svg{width:21px;height:21px}
  .mrow svg{width:20px;height:20px}
  .send svg{width:19px;height:19px}
  .sheet-x{display:flex;align-items:center;justify-content:center}
  .sheet-x svg{width:20px;height:20px}
  /* the empty chat greets you (note 25b7b572) — the small-bold hint, back on */
  /* composer: a hairline ring on black */
  .composer .field{background:transparent;border:.5px solid var(--line-2);border-radius:22px}
  /* burger menu: compact, with a real entrance rooted at its trigger */
  .menu{min-width:200px;padding:5px;border-radius:15px;border:.5px solid var(--line-2);box-shadow:0 12px 34px rgba(0,0,0,.6);transform-origin:top right}
  .menu.on{animation:menuIn .3s var(--ease-out)}
  @keyframes menuIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
  .mrow{padding:10px 13px;gap:12px;font-size:14.5px;border-radius:10px}
  .mrow .ct{min-width:17px;height:17px;font-size:11px}
  .mdiv{margin:4px 9px}
  /* Depth drawer: hairline-edged slab; its shadow exists ONLY while open so
     nothing ever bleeds onto a page's side when it's closed */
  .cdraw{width:min(87vw,342px);border-right:.5px solid var(--line-3);border-top-right-radius:24px;border-bottom-right-radius:24px;transition:transform .5s var(--ease-sheet),box-shadow .5s ease;box-shadow:none}
  .cdraw.on{box-shadow:44px 0 130px rgba(0,0,0,.92)}
  .scrim{background:rgba(0,0,0,.74)}
  /* the chat recedes beneath the open drawer */
  .hdr,.body{transition:transform .46s var(--ease-sheet),filter .46s ease;transform-origin:50% 38%}
  body.cdraw-open .hdr,body.cdraw-open .body{transform:scale(.9) translateY(10px);filter:brightness(.38)}
  /* conversation rows carry their own hairline rhythm */
  .crow2{border-bottom:.5px solid var(--line)}
  .crow2:last-child{border-bottom:none}
  .csec{border-top:.5px solid var(--line);margin-top:4px}
  /* page switch: a quiet fade-up */
  body.page-chat #pChat,body.page-activity #pAct,body.page-alerts #pAl,body.page-notes #pNotes{animation:pageIn .34s var(--ease-out)}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* batch 2026-07-10b: header up + smaller, fully white icons, unified text
     boxes with a rest width that expands on focus, drawn chevrons, clear-chats
     lower */
  .hdr{padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
  .icbtn{min-width:36px;min-height:36px}
  .icbtn{color:var(--white)}
  .mrow svg{color:var(--white)}
  .ico{color:var(--white)}
  .sheet-ico{color:var(--white)}
  .digin{color:var(--white)}
  .composer .field{max-width:88%;transition:max-width .34s var(--ease-out)}
  .composer .field:focus-within{max-width:100%}
  .reply{max-width:88%;transition:max-width .34s var(--ease-out)}
  .reply:focus-within{max-width:100%}
  .rinp{background:transparent;border:.5px solid var(--line-2);border-radius:22px}
  .sheet-foot{border-top:none;background:transparent}
  .rsend svg{width:16px;height:16px}
  .chev svg{width:15px;height:15px;display:block}
  .wt-cv svg,.arch-cv svg{width:14px;height:14px;display:block}

interface Window {

  __m1seq?: number;

interface ConvSummary {
  id: string;
  title?: string;

  source?: string;
  role?: string;
  mission?: string;
  goal?: string;
  preview?: string;

  statusSummary?: string;

}

interface RunInfo {
  convId: string;
  title?: string;
  mission?: string;
  source?: string;
  lastTool?: string;
  lastProgressAt?: number;
}

interface ScheduleItem {
  id: string;

interface DeliberationOption {
  answer: string;
  title?: string;

interface Deliberation {
  mission?: string;
  ask?: string;
  askLong?: string;
  options?: DeliberationOption[];
  exchange?: { role: string; text: string }[];

  id: string;
  ts?: number;

  title?: string;
  intention?: string;
  icon?: string;
  cls?: string;

  status?: string;
  timestamp?: string;
  last_updated?: string;
  title?: string | null;
  user_draft?: string;
  turns?: unknown[];
  anchors?: unknown[];
}

interface TimelineStep {
  thought?: string;
  action?: string;
  snag?: boolean;
}

interface ThreadMsg {
  role: string;
  content: string;
  tools?: string[];
  timeline?: { steps: TimelineStep[]; reply?: string };

  id: string;
  title?: string;
  source?: string;
  status?: string;

  phase?: string;

  role?: string;
  content?: string;
  tools?: string[];
  title?: string;

  // ---------- activity ----------
  function el(html: string): any { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }

  const CHEV_R = '<svg class="chev-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const chevT = (open) => '<svg class="chev-t' + (open ? " open" : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  // ---------- bottom sheet (the detail surface) ----------
  // Threads render as a transcript with sender labels and bubble-free agent
  // turns. A worker thread is Supervisor ⇄ Worker; a mission thread is You ⇄

  // development checked off, snags flagged. Legible progress — what it did and
  // what it ran into — instead of a run-on paragraph + a collapsed "N steps" chip.
  function timelineHtml(tl) {
    if (!tl || !Array.isArray(tl.steps) || !tl.steps.length) return "";

    // no separate mechanical "→ ran X" line. Checked off; snags flagged amber.
    return '<div class="ttl">' + tl.steps.map((s) => {
      const th = (s.thought || "").trim();

  // CONVERSATION. The conversation is styled exactly like a supervisor thread
  // (sender labels, markdown bubbles, the same composer) but its CONTENT is its
  // own: you and the agent talking about THIS decision — never the mission
  // thread embedded (no brief, no wakes, no worker reports, no executor
  // thought-chains: that content lives in Activity; embedding it here was poor
  // design). The agent still has the mission's full context behind the scenes.
  //
  // Multiple rounds: each poll re-fetches; if the agent surfaces a fresh ask
  // with new options, the newest ask's card replaces this one (latest wins).
  // Shared plumbing for alert sheets (ask AND info): sheetConvId + a paint that
  // renders the deliberation exchange into #delibX + the 3s poll; the front's
  // reply streams via #chatEdge and folds in when persisted. Returns the probe
  // sender (a plain /message — never resolves an ask). This is what replaced
  // the old "Open thread" jump into the raw execution log.
  // [ask redesign] Render a proposed option set (a message's askOptions) as
  // tappable cards. Same visual language as the decision card's options; the
  // "proposed" class scopes the tap wiring. `decided` (a Set of answer
  // strings) marks the DURABLE record: the card whose answer was committed
  // renders "✓ your call" and its siblings go dead — so reopening a settled
  // ask shows WHICH refined card won, not a stack that looks still-live
  // (the record is the whole deliberation, including what the fork's rounds
  // offered and what you picked).
  function askOptionCardsHtml(opts, decided) {
    const anyChosen = decided && opts.some((o) => decided.has(o.answer));
    // [truth] Once decided, the losers "say nothing": render ONLY the chosen card
    // marked "selected" — never a stack of dimmed also-rans (matches the feed
    // card, which drops the options and shows just the pick).
    const shown = anyChosen ? opts.filter((o) => decided.has(o.answer)) : opts;
    return '<div class="delib-proposed">' + shown.map((o) => {
      const chosen = decided && decided.has(o.answer);
      return '<div class="delib-opt proposed' + (o.primary ? " prim" : "") + (chosen ? " chosen" : "") + '" data-ans="' + esc(o.answer) + '">'
        + '<div class="ot">' + esc(o.title || o.answer)
        + (chosen
          ? '<span class="pick">✓ selected</span>'
          : '<span class="pick">choose <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>')
        + "</div>"
        + (o.body ? '<div class="ob">' + esc(o.body) + "</div>" : "")
      + "</div>";
    }).join("") + "</div>";
  }

  // [ask-object] "Not now" — the ask's terminal that ends it WITHOUT choosing an

  // mission forever). Mirrors resolveDeliberation's /answer relay but tags
  // defer:true and records "Not now" as the decision on the card + archive.
  function deferAsk(n) {
    try { logEvent("defer", { ask: n.id, conv: n.convId }); } catch {}
    const rkey = n.id + " __defer__";
    if (resolvingAsks.has(rkey)) return;
    resolvingAsks.add(rkey);
    setTimeout(() => resolvingAsks.delete(rkey), 60_000);
    const del = deliberationFromNotif(n);
    if (n.convId) {
      api("/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ convId: n.convId, text: "Not now", clientMsgId: "defer-" + n.id, notifId: n.id, defer: true, ...(del.onDefer ? { onDefer: del.onDefer } : {}), ...(n.kind === "ask" && n.askConvId ? { askConvId: n.askConvId } : {}) }) }).catch(() => {});

    for (const s of lastNotifList) {

  // [swipe-kind] Which list a swiped card lives in, for the experience-log — so a
  // replay says "note swipe cancelled" not just "a card moved". Derived from the
  // scroller it sits in; no call-site change needed.
  const SWIPE_KIND = { alScroll: "alert", actScroll: "mission", notesScroll: "note" };
  function attachSwipeArchive(card: any, action: any, reload?: any, rightAction?: any) {
    reload = reload || loadAlerts;
    let x0 = 0, y0 = 0, dx = 0, mode = null, t0 = 0;
    const kindOf = () => { const s = card.closest("#alScroll,#actScroll,#notesScroll"); return (s && SWIPE_KIND[s.id]) || "card"; };
    const start = (x, y) => { x0 = x; y0 = y; dx = 0; mode = null; t0 = Date.now(); markListBusy(); card.style.transition = "none"; };
    const move = (x, y) => {
      if (mode === "v") return false;
      const ndx = x - x0, ndy = y - y0;
      if (mode === null) {
        if (Math.abs(ndx) < 9 && Math.abs(ndy) < 9) return false;
        mode = Math.abs(ndx) > Math.abs(ndy) ? "h" : "v";
        if (mode === "v") return false;
      }
      // Right-swipe only tracks when a rightAction exists (notes: swipe right to
      // edit, note 002c8029); everywhere else the card stays pinned at 0 so the
      // gesture keeps meaning exactly one thing (left = archive/resolve).
      dx = rightAction ? Math.max(-innerWidth, Math.min(ndx, 90)) : Math.min(0, ndx);
      card.style.transform = "translateX(" + dx + "px)";
      return true;
    };
    const end = async () => {
      if (mode !== "h") { mode = null; return; }
      // A mouse drag fires a click on mouseup — flag it so the card's
      // tap-for-summary handler swallows that one click. TIMED, not
      // consume-on-next-click: touch swipes fire no click at all, and a
      // lingering flag would eat the next real tap (the "tap does nothing"
      // bug).
      card.dataset.swiped = "1";
      setTimeout(() => { card.dataset.swiped = ""; }, 400);
      mode = null;
      // [experience-log] Record the OUTCOME of every committed horizontal
      // gesture — commit vs cancel, distance, duration — so a replay shows the
      // swipes that didn't take (dx never reached threshold) next to the ones
      // that did. This is the signal for "swiping was out of whack".
      const logSwipe = (act) => { try { logEvent("swipe", { kind: kindOf(), act, dx: Math.round(dx), ms: Date.now() - t0 }); } catch {} };
      card.style.transition = "transform .18s ease, opacity .18s ease";
      if (rightAction && dx > 60) {
        // Right-swipe: snap back and hand off (an edit opens a sheet — the card
        // itself stays in place).
        logSwipe("edit");
        card.style.transform = "";
        rightAction();
      } else if (dx < -70) {
        logSwipe("archive");
        // Remember WHERE in the list you were, so the reload below doesn't yank you
        // to the top. loadAlerts/loadActivity/loadNotes rebuild innerHTML (scrollTop
        // → 0), so swiping a card DOWN in the archive scrolled you back up to the
        // unread section — making it look like the swipe hit the wrong card and a
        // "normal" alert reappeared. It didn't; the view just jumped.
        const scroller = card.closest("#alScroll,#actScroll,#notesScroll");
        const prevTop = scroller ? scroller.scrollTop : 0;
        card.style.transform = "translateX(-110%)"; card.style.opacity = "0";
        // Collapse the card's vertical space as it leaves so the list closes the
        // gap smoothly. A translateX alone leaves the card's HEIGHT in the layout,
        // so a hole sat where it was until the reload landed (the swipe-gap /
        // orphaned-section-header jank in the recording). Animate height + margins
        // + padding to 0, then reload to reconcile the count and headers.
        const h = card.offsetHeight;
        card.style.height = h + "px"; card.style.overflow = "hidden"; card.style.boxSizing = "border-box";
        requestAnimationFrame(() => {
          card.style.transition = "transform .18s ease, opacity .18s ease, height .2s ease, margin .2s ease, padding .2s ease";
          card.style.height = "0px"; card.style.marginTop = "0px"; card.style.marginBottom = "0px"; card.style.paddingTop = "0px"; card.style.paddingBottom = "0px";
        });
        await action();
        setTimeout(async () => {
          await Promise.resolve(reload());
          // Put the scroll back where it was (clamped to the now-shorter list) so the
          // removed card just closes up in place instead of the view jumping to top.
          if (scroller) scroller.scrollTop = Math.min(prevTop, Math.max(0, scroller.scrollHeight - scroller.clientHeight));
        }, 240);
      } else {
        // Started a horizontal drag but released short of the archive threshold
        // — snaps back. Logged so a run of these reads as "I kept trying to
        // swipe and nothing happened".
        logSwipe("cancel");
        card.style.transform = "";
      }
    };
    card.addEventListener("touchstart", (e) => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    // [axis-lock] touchmove is NON-passive so that once the gesture is locked
    // horizontal (move() returns true) we preventDefault and the list stops
    // scrolling underneath the finger. Without this the card followed the
    // finger while the scroller ALSO scrolled — the two fought, the swipe
    // distance never reached threshold, and archiving felt "state-dependent"
    // and "all over the place". Mirrors the drawer swipe-open handler, which
    // has always locked its axis this way.
    card.addEventListener("touchmove", (e) => { if (move(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, { passive: false });
    card.addEventListener("touchend", end);
    card.addEventListener("touchcancel", end);
    let mouseDown = false;
    card.addEventListener("mousedown", (e) => { if (e.target.closest(".rinp,.rsend")) return; mouseDown = true; start(e.clientX, e.clientY); });
    window.addEventListener("mousemove", (e) => { if (mouseDown) move(e.clientX, e.clientY); });
    window.addEventListener("mouseup", () => { if (mouseDown) { mouseDown = false; end(); } });
  }

  // ---------- push ----------
  const b64uToBytes = (s) => { const pad = "=".repeat((4 - (s.length % 4)) % 4); const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };

      const n = lastNotifList.find((x) => x.id === nid);
      if (n) openDeliberationSheet(n);
    } catch {}
  }

  // The scroll fade is a scrolling AFFORDANCE — per edge, and only when content
  // is actually cut off on that edge. At rest (scrollTop 0) the first line is
  // fully readable; the top fade appears only once you scroll down.
  const fadeWatch = () => {
    document.querySelectorAll("#msgs,.scroll,.clist,.sheet-body").forEach((sc) => {
      const can = sc.scrollHeight > sc.clientHeight + 4;
      sc.classList.toggle("fade-top", can && sc.scrollTop > 4);
      sc.classList.toggle("fade-bot", can && sc.scrollTop + sc.clientHeight < sc.scrollHeight - 4);
    });
  };
  new MutationObserver(fadeWatch).observe(document.body, { childList: true, subtree: true });
  window.addEventListener("resize", fadeWatch);
  // scroll doesn't bubble — capture phase catches every scrollable surface.
  document.addEventListener("scroll", fadeWatch, true);
  setInterval(fadeWatch, 1200);
  fadeWatch();

  showHint();
  setHeader();
  // A tapped push notification deep-links to the ASKING thread via ?conv=<id>
  // (from the push url, when the app was launched cold). It MUST win over the
  // sticky last-thread restore below — otherwise the tap lands you on whatever
  // chat you had open last, not the one waiting on your call.
  const bootAsk = qs.get("ask");
  const bootConv = qs.get("conv");
  if (bootAsk) {
    // [ask redesign] Cold-launch from an ask push: open the ask surface, never
    // a thread — the main composer keeps whatever chat it had.
    void openAskById(bootAsk);
  } else if (bootConv) {
    void openThread(bootConv);
  } else {
    // Return to the thread you were in last session (404 falls back to a fresh chat).
    try {
      const saved = JSON.parse(localStorage.getItem(LAST_CONV_KEY) || "null");
      if (saved && saved.id) void openThread(saved.id, saved.title);
    } catch {}
  }
  void refreshState();
  void refreshBadge();
  void pollLoop();
  setInterval(() => { void refreshState(); }, 45000);
})();
</script>
<script>
/* TypeScript bootstrap. The app source above is TypeScript; this strips the
   types in the browser (Babel TS preset) and caches the compiled JS in
   localStorage keyed by a hash of the source - so only the first load after
   an update compiles, and every later boot runs immediately, exactly like the
   old inline <script>. Single-file, CDN-served, no build step. */
(() => {
  "use strict";
  var el = document.getElementById("phone-ts");
  var src = el ? el.textContent : "";
  var h = 5381;
  for (var i = 0; i < src.length; i++) h = ((h << 5) + h + src.charCodeAt(i)) | 0;
  var key = "vc_tsjs_" + (h >>> 0).toString(36) + "_" + src.length;
  function run(code) { (0, eval)(code + "\n//# sourceURL=phone.ts"); }
  function fail(err) {
    document.body.innerHTML = '<div class="gate"><b style="color:var(--text)">Boot failed</b><div>' +
      String((err && err.message) || err).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</div></div>";
  }
  var cached = null;
  try { cached = localStorage.getItem(key); } catch (e) {}
  if (cached) {
    try { run(cached); return; } catch (e) { try { localStorage.removeItem(key); } catch (e2) {} }
  }
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js";
  s.onload = function () {
    try {
      var out = window.Babel.transform(src, {
        filename: "phone.ts",
        presets: [["typescript", {}]],
        sourceType: "script",
        retainLines: true,
      }).code;
      try {
        var drop = [];
        for (var j = 0; j < localStorage.length; j++) {
          var k = localStorage.key(j);
          if (k && k.indexOf("vc_tsjs_") === 0 && k !== key) drop.push(k);
        }
        drop.forEach(function (k2) { try { localStorage.removeItem(k2); } catch (e3) {} });
        localStorage.setItem(key, out);
      } catch (e) {}
      run(out);
    } catch (e) { fail(e); }
  };
  s.onerror = function () {
    fail(new Error("Couldn't fetch the TypeScript compiler (the first load after an update needs the network once). Reconnect and reload."));
  };
  document.head.appendChild(s);
})();
</script>
