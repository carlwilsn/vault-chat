<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="vault-chat" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>vault-chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#000000; --surface:#111113; --raised:#1b1b1f; --line:#26262b;
    --text:#f0f0f0; --dim:#8c8c92; --primary:#f5f5f5; --primary-fg:#000000;
    --err:#e5655f; --ok:#eaeaea; --warn:#e0a35a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);height:100%}
  html,body{margin:0;overflow:hidden;overscroll-behavior:none}
  /* Full-screen shell via CSS, NOT JS. In a browser tab 100dvh (the dynamic
     viewport) is right — it tracks the visible area so the composer never hides
     behind Safari's toolbar. But in an iOS home-screen (standalone) PWA, iOS treats
     the translucent status-bar band as retractable UI, so 100dvh/100svh come up
     ~safe-area-top short of the screen (measured 812 on an 874px iPhone) and leave a
     dead strip at the bottom — the "shifted up" look. 100lvh is the true full-screen
     height there, so standalone overrides to it below. Keyboard lift is a --kb
     padding applied only while the keyboard is up (body.kbup). */
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media all and (display-mode:standalone){ body{height:100lvh} }
  body.kbup{padding-bottom:var(--kb,0px)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  svg{display:block}

  /* header */
  .hdr{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 12px 8px;position:relative;z-index:21}
  .icbtn{color:var(--dim);min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative;flex:none}
  .icbtn:active{background:var(--surface)}
  .icbtn svg{width:22px;height:22px}
  body:not(.page-chat) #convBtn{visibility:hidden}
  .reddot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
  .reddot.on{display:block}
  /* The conversations icon mirrors the row dots: pulsing white if any thread is
     generating, steady white if one finished while you weren't looking. */
  .reddot.think{background:var(--primary);animation:pul 1.4s ease-in-out infinite}
  .reddot.solid{background:var(--primary)}
  .title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
  /* Solid connection dot — green = connected, red = offline. No pulsing:
     it's a status light, not an activity meter. */
  .title .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  body.offline .title .dot{background:var(--err)}
  .title .tx{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .sub{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
  .vpill{display:none;align-items:center;gap:6px;font-size:12px;color:var(--ok);border:1px solid #2c2c32;border-radius:16px;padding:5px 11px;flex:none}
  body.voicemin .vpill{display:flex}
  .vpill .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}

  .offbar{display:none;align-items:center;gap:9px;margin:0 14px 6px;background:#2a1d1c;border:1px solid #53312f;border-radius:11px;padding:8px 13px;font-size:12.5px;color:#e8b3b0;flex:0 0 auto}
  body.offline .offbar{display:flex}
  .offbar b{font-weight:600;color:#f0c9c7}

  /* ☰ page menu */
  .menu{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:10px;background:#0c0c0f;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:46;min-width:220px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .menu.on{display:block}
  .mrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;font-size:14.5px;width:100%;text-align:left}
  .mrow:active{background:var(--raised)}
  .mrow.cur{background:#242429}
  .mrow svg{width:19px;height:19px;color:var(--dim);flex:none}
  .mrow .nm{flex:1}
  .mrow .ct{font-size:11.5px;color:var(--primary-fg);background:var(--primary);border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
  .mrow .ct.warn{background:var(--warn)}
  .mrow .ct.zero{display:none}
  .mdiv{height:1px;background:#242429;margin:5px 8px}

  /* left conversations drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:48}
  .scrim.on{display:block}
  .cdraw{position:fixed;top:0;left:0;bottom:0;width:min(84vw,330px);background:#101012;z-index:49;transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .cdraw.on{transform:none}
  .cdtop{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
  .cdtop b{flex:1;font-size:16px;font-weight:600}
  .newbtn{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--primary-fg);background:var(--primary);border-radius:10px;padding:8px 13px}
  .newbtn svg{width:16px;height:16px}
  .clist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px}
  .cclear{flex:0 0 auto;margin:0 14px calc(env(safe-area-inset-bottom) + 14px);border:1px solid #5a302e;border-radius:10px;padding:10px;font-size:13px;color:var(--err);min-height:40px}
  .cclear:active{background:var(--surface)}
  .csec{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#7c7c7c;padding:12px 16px 5px;font-weight:600}
  button.csec.wsec{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 16px;min-height:40px}
  button.csec.wsec:active{background:var(--surface)}
  .wsec .chv{font-size:12px;color:#7c7c7c}
  .crow2{display:block;width:100%;text-align:left;padding:11px 16px}
  .crow2:active{background:var(--surface)}
  .crow2 .t{display:flex;align-items:center;gap:8px}
  .crow2 .rd{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  /* generating = white pulsing "thinking" dot; done-but-unseen = steady solid. */
  .crow2 .rd.think{background:var(--primary);animation:pul 1.4s ease-in-out infinite}
  .crow2 .rd.unseen{background:var(--primary)}
  .crow2 .nm{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow2 .ag{color:#7c7c7c;font-size:11.5px;flex:none}
  .crow2 .p{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding-left:0}

  /* pages */
  .body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  .page{flex:1;min-height:0;display:none;flex-direction:column}
  body.page-chat #pChat{display:flex}
  body.page-activity #pAct{display:flex}
  body.page-alerts #pAl{display:flex}
  body.page-notes #pNotes{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  /* notes detail (expanded card) */
  .ndetail{margin-top:9px;border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:9px}
  .nanchor{font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .nquote{font-size:12.5px;color:var(--text);border-left:2px solid var(--line);padding-left:9px;white-space:pre-wrap}
  .ndraft{font-size:13px;color:var(--text);white-space:pre-wrap}
  .nturn{display:flex;flex-direction:column;gap:3px}
  .nrole{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .ntext{font-size:13px;line-height:1.45;white-space:pre-wrap;color:var(--text)}
  /* new-note composer */
  .ncompose{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-bottom:1px solid var(--line)}
  .ncompose textarea{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;resize:none;line-height:1.4;max-height:120px;overflow-y:auto;font-family:inherit}
  .ncompose textarea::placeholder{color:var(--dim)}
  .nadd{flex:none;background:var(--primary);color:var(--primary-fg);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600}
  .nadd:disabled{opacity:.5}

  /* chat */
  #msgs{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 14px 6px;display:flex;flex-direction:column}
  #msgs .md,#msgs .amsg,#msgs .m{overflow-wrap:anywhere}
  .m{max-width:90%;margin:0 0 10px;border-radius:15px;padding:9px 13px;word-wrap:break-word;overflow-wrap:anywhere}
  .m.user{align-self:flex-end;background:var(--raised);white-space:pre-wrap;border-bottom-right-radius:5px}
  .m.asst{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
  .m.sys{align-self:center;background:none;color:var(--dim);font-size:12px;font-style:italic;text-align:center}
  .m.queued{opacity:.55}
  /* Tool calls collapse to a "Ran N steps" summary at the end of the reply
     (tap to expand). The agent's "thinking" sign is a circular pulse under the
     text while it works — no "running ·" bar and no streaming cursor. */
  .steps{margin-top:11px}
  .steps-h{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:11.5px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .steps-h .sck{width:13px;height:13px;color:var(--text);flex:none}
  .steps-h .scv{width:13px;height:13px;color:var(--dim);flex:none;transition:transform .15s}
  .steps.open .steps-h .scv{transform:rotate(180deg)}
  .steps-list{display:none;flex-direction:column;gap:9px;margin-top:9px}
  .steps.open .steps-list{display:flex}
  .steps-list .step{font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
  .thinking{display:flex;align-items:center;gap:11px;padding:11px 0 6px;color:var(--dim);font-size:12px}
  .thinking .tlbl{color:var(--dim);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;opacity:0;transition:opacity .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .thinking .tlbl.show{opacity:.7}
  .thinking .elapsed{color:var(--dim);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;opacity:.55;margin-left:auto;flex:none}
  .pulse{display:inline-block;position:relative;width:8px;height:8px;margin-left:2px;flex:none}
  .pulse:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--primary);animation:pul 1.5s infinite}
  .pulse:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--primary);animation:ping 1.8s infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
  #connpip{display:none}
  .hint{margin:auto;text-align:center;color:var(--dim);font-size:14px;line-height:1.65;padding:0 40px;max-width:340px}
  .hint b{color:var(--text);font-weight:600;display:block;font-size:15.5px;margin-bottom:6px}

  .md p{margin:.35em 0}
  .md h1,.md h2,.md h3{margin:.5em 0 .25em;line-height:1.25}
  .md h1{font-size:1.2em}.md h2{font-size:1.1em}.md h3{font-size:1.02em}
  .md pre{background:#0e0e10;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
  .md code{background:#0e0e10;border-radius:4px;padding:1px 4px;font:12px ui-monospace,Menlo,Consolas,monospace}
  .md pre code{background:none;border:none;padding:0}
  .md blockquote{border-left:3px solid var(--line);margin:.4em 0;padding:.05em .8em;color:var(--dim)}
  .md ul,.md ol{margin:.35em 0;padding-left:1.4em}
  .md a{color:#9ec3e8;text-decoration:none;word-break:break-all}
  .md img{max-width:100%;border-radius:8px;margin:.3em 0}
  .md table{border-collapse:collapse;margin:.4em 0;font-size:13px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .md hr{border:none;border-top:1px solid var(--line);margin:.7em 0}

  /* North Star proposal card (```plan block) */
  .plancard{background:#17171b;border:1px solid #2c2c32;border-radius:13px;padding:12px 13px;margin:3px 0}
  .pc-h{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;margin-bottom:6px}
  .pc-title{font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:4px}
  .pc-desc{font-size:13px;color:#bdbdbd;line-height:1.5;margin-bottom:4px}
  .pc-dw{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:9px 0 3px}
  .pc-tasks{margin:5px 0 0;padding-left:18px}
  .pc-tasks li{font-size:13px;color:#d7d7d7;margin:3px 0;line-height:1.45}
  .pc-btns{display:flex;gap:8px;margin-top:12px}
  .pc-approve{flex:1;background:var(--ok);color:#101012;font-weight:700;font-size:13px;border-radius:9px;padding:9px;min-height:38px}
  .pc-approve:active{opacity:.85}
  .pc-refine{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:9px;padding:9px 16px;min-height:38px}
  .pc-refine:active{background:var(--raised)}
  .plancard.approved{opacity:.6}
  .plancard.approved .pc-btns{display:none}

  .composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:9px;padding:6px 12px calc(env(safe-area-inset-bottom) + 8px)}
  .mic{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);flex:none;display:flex;align-items:center;justify-content:center}
  .mic:active{background:var(--raised)}
  .mic svg{width:20px;height:20px}
  .field{flex:1;position:relative;display:flex;align-items:flex-end;min-width:0}
  .composer textarea{flex:1;resize:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:21px;padding:10px 50px 10px 15px;font-size:16px;line-height:1.4;font-family:inherit;max-height:120px;outline:none;min-width:0}
  .send{position:absolute;right:5px;bottom:5px;width:33px;height:33px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
  .send:disabled{opacity:.35}
  /* Stop = interrupt generation, the same calm affordance as send — NOT a red
     "kill". Real kills live in Activity (per-worker) and Settings (kill-all). */
  .send.stop{font-size:13px}

  /* cards */
  .sec{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8a8a;padding:15px 18px 7px;font-weight:600}
  .msec{display:flex;align-items:baseline;gap:8px;padding:17px 18px 7px;min-width:0;width:100%;text-align:left}
  .msec:active{background:var(--surface)}
  .msec>span:first-child{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ok);font-weight:700;flex:none}
  .msec b{font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .msec .mc{font-size:11px;color:#8a8a8a;flex:none}
  .msec .mc.dim{color:#6a6a6a}
  .msec .watch{font-size:11px;color:var(--dim);flex:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px}
  .mnote{margin:0 18px 9px;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  /* A mission is a CONTAINER card — its name on top, its worker pills nested
     inside it — so a mission and its workers read as one unit. */
  .mgroup{margin:11px 14px 4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .mgroup .msec{padding:14px 17px 10px}
  .mgroup .wpill{margin:0 9px 9px;background:var(--raised);border-color:#303036}
  .mgroup .wpill:last-child{margin-bottom:11px}
  .mgroup .wp-head:active{background:#26262c}
  /* Archive: collapsed list of completed missions, low-key under the live board. */
  .arch-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:15px 18px 8px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8a8a;font-weight:600}
  .arch-h:active{color:var(--text)}
  .arch-cv{font-size:10px;color:#6f6f6f;width:11px;flex:none}
  .arch-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin:0 14px 7px;width:calc(100% - 28px);padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .arch-row:active{background:var(--raised)}
  .arch-t{flex:1;min-width:0;font-size:13px;font-weight:600;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arch-age{font-size:10.5px;color:#8a8a8a;flex:none}
  /* worker pills: one short line per worker, tap to expand state + actions */
  .wpill{margin:0 14px 7px;border:1px solid var(--line);border-radius:17px;background:var(--surface);overflow:hidden}
  .wp-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 14px;min-height:37px}
  .wp-head:active{background:var(--raised)}
  .wp-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .wp-t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-age{font-size:10.5px;color:#8a8a8a;flex:none;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-body{display:none;padding:0 14px 11px}
  .wp-state{margin:2px 0 0;font-size:12.5px;color:#ababab;line-height:1.5;overflow-wrap:anywhere}
  .wpill.open .wp-body{display:block}
  .card{margin:0 14px 10px;background:var(--surface);border-radius:14px;padding:13px 14px;width:calc(100% - 28px);text-align:left;display:block}
  .card:active{background:#16161a}
  .card.ask{border:1px solid #5a4a26}
  .card.unread{box-shadow:inset 2.5px 0 0 #6f6f6f}
  .crow{display:flex;gap:12px}
  .ico{width:31px;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13.5px;font-weight:700;background:var(--raised);color:var(--dim)}
  .ico.g{color:var(--ok)} .ico.a{color:var(--warn)} .ico.r{color:var(--err)}
  .cb{flex:1;min-width:0}
  .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ct b{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
  .ct .t{font-size:11px;color:#8a8a8a;flex:none}
  .cs{margin:4px 0 0;font-size:13px;color:#ababab;line-height:1.5;overflow-wrap:anywhere}
  .tag{display:inline-block;margin-top:7px;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .reply{position:relative;display:flex;align-items:center;margin-top:10px}
  .rinp{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:9px 42px 9px 14px;color:var(--text);font-size:14px;outline:none;min-width:0;font-family:inherit}
  .rinp::placeholder{color:#838383}
  .rsend{position:absolute;right:5px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  .empty{padding:30px 38px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6}
  .metabar{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#8a8a8a;font-weight:600;margin:4px 0 2px}
  .earlier{display:block;width:calc(100% - 28px);margin:6px 14px 0;text-align:center;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:38px}
  .earlier:active{background:var(--surface)}
  .dismiss{margin-top:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:12.5px;min-height:34px}
  .dismiss:active{background:var(--raised)}
  .alsum{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .alsum .md{font-size:13px;color:#c9c9c9;line-height:1.5}
  .alsum-load{color:var(--dim);font-size:12px}

  .mtitle{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .mtitle b{font-weight:600;font-size:15px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
  .pill{font-size:12px;font-weight:500;flex:none;display:inline-flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .pill.run{color:var(--ok)} .pill.blk{color:var(--warn)}
  .goal{font-size:12.5px;color:var(--dim);line-height:1.5;margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line);overflow-wrap:anywhere}
  .wk{margin:0 14px 9px;background:#101012;border-radius:13px;overflow:hidden;width:calc(100% - 28px)}
  .wh{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:left;min-height:46px}
  .wh .s{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:50%;font-size:11px;background:var(--raised);color:var(--dim)}
  .wh .s.g{color:var(--ok)} .wh .s.run{color:var(--ok)}
  .wh .nm{flex:1;font-size:14px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wh .mt{font-size:11.5px;color:#8f8f8f;flex:none;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wd{display:none;padding:0 14px 13px 14px;font-size:12.5px;color:#ababab;line-height:1.55;overflow-wrap:anywhere}
  .wk.open .wd{display:block}
  .lbl{color:#8a8a8a;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin-top:9px}
  .wbtns{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
  .wbtn{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:#dcdcdc;min-height:34px}
  .wbtn:active{background:var(--raised)}
  .wbtn.danger{color:var(--err);border-color:#5a302e}
  .wbtn.confirm{background:var(--err);color:#fff;border-color:var(--err)}
  .schedrow{display:flex;align-items:center;gap:10px}
  .schedrow .info{flex:1;min-width:0}
  .schedrow .info b{font-weight:600;font-size:14px;display:block;overflow-wrap:anywhere}
  .schedrow .info small{color:var(--dim);font-size:11.5px;overflow-wrap:anywhere}
  .sw{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:5px 11px;color:var(--dim);flex:none;min-height:32px}
  .sw.on{color:var(--primary-fg);background:var(--primary);border-color:var(--primary)}
  .del{color:var(--err);font-size:15px;padding:4px 8px;flex:none}

  /* keyboard (verbatim) */
  #kb{flex:0 0 auto;background:#0e0e10;padding:7px 4px calc(env(safe-area-inset-bottom) + 6px);display:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  body.kbopen.page-chat #kb{display:block}
  body.kbopen .composer{padding-bottom:8px}
  /* System keyboard up: the keyboard covers the home-indicator strip, so the
     safe-area inset would be dead space between the textbox and the keyboard.
     Drop it to a flush 8px. (--kb>0 => `kbup`, set by the visualViewport handler.) */
  body.kbup .composer{padding-bottom:8px}
  /* Same gap, same fix for the supervisor/mission reply footer (the bottom sheet
     is lifted flush onto the keyboard, so its safe-area inset is dead space too). */
  body.kbup .sheet-foot{padding-bottom:8px}
  .kblayer{display:none}.kblayer.active{display:block}
  .kbrow{display:flex;gap:5px;margin:0 0 8px;justify-content:center}
  .kbrow:last-child{margin-bottom:0}
  .kbrow.indent{padding:0 5%}
  .kbk{flex:1;height:44px;background:#1c1c20;border-radius:6px;color:var(--text);font-size:19px;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
  .kbk.spec{background:#141417;font-size:14px;flex:1.4}
  .kbk.space{flex:4.6;font-size:13px;color:var(--dim)}
  .kbk.ret{flex:2;font-size:20px}
  .kbk.down{background:#2b2b30}.kbk.spec.down{background:#1f1f24}
  .kbk.lit{background:var(--primary);color:var(--primary-fg)}
  .kbk.caps{box-shadow:inset 0 0 0 2px var(--primary)}
  #kb.up .kbk.let{text-transform:uppercase}

  /* settings drawer (right) */
  #drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
  #drawer.open{display:block}
  #drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,360px);background:var(--surface);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  #drawer h3{margin:0;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  #drawer .row{font-size:13px;background:#101012;border-radius:9px;padding:9px 11px}
  #drawer .row b{display:block;font-size:13px}
  #drawer .row small{color:var(--dim)}
  .btn{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:9px;padding:11px;font-weight:600;font-size:14px;margin-top:4px;min-height:44px}
  .btn.warn{color:var(--err);border-color:#5a302e}
  .btn.solid{background:var(--primary);color:var(--primary-fg);border:none}
  .note{font-size:12px;color:var(--dim)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:#1c1c20;color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70;max-width:86vw;text-align:center}
  #toast.show{opacity:1}
  .gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;color:var(--dim)}

  /* voice */
  #voice{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:60}
  body.voice #voice{display:flex}
  body.voicemin #voice{display:none}
  .vtop{display:flex;justify-content:flex-end;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 10px 0}
  .vmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:0 30px}
  .viz{display:flex;align-items:center;gap:6px;height:96px}
  .vbar{width:6px;height:96px;border-radius:4px;background:var(--primary);transform:scaleY(.16);transform-origin:center;transition:transform .06s linear}
  .vconn{display:none;font-size:15px;font-weight:600;color:var(--dim);animation:pulse 1.2s ease-in-out infinite}
  body.vconnecting .viz{display:none}
  body.vconnecting .vconn{display:block}
  .verr{color:var(--err);font-size:13px;max-width:320px;white-space:pre-wrap;text-align:center;min-height:18px}
  .vend{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:calc(env(safe-area-inset-bottom) + 36px)}
  .vx{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
  .vx svg{width:24px;height:24px}
  .vbtns{display:flex;gap:20px;align-items:center}
  body.vmicmuted #vMuteBtn{background:rgba(229,62,62,.15);border-color:rgba(229,62,62,.55);color:#e53e3e}
  .vhint{font-size:11.5px;color:#6f6f6f}
  .vhint .chev{display:inline-block;width:12px;height:12px;vertical-align:-1px}

  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== redesign: bubble-free replies, bottom sheets, spec, scheduled ===== */
  /* agent replies render bubble-free (ChatGPT/Claude-style): full-width markdown,
     no surface. user + system messages keep their bubbles. */
  .amsg{align-self:stretch;max-width:100%;width:100%;margin:2px 0 14px}
  .amsg.queued{opacity:.55}
  .amsg.stream .cursor{display:inline-block;width:7px;height:14px;background:var(--primary);vertical-align:-2px;animation:pulse 1s infinite}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:1px 0;margin:.5em 0}

  /* connection light lives in the menu, right edge of Box & settings */
  .connpip{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 7px rgba(127,191,127,.75)}
  body.offline .connpip{background:var(--err);box-shadow:0 0 7px rgba(225,71,70,.75)}

  /* clearing chats is cosmetic — neutral, not a destructive red */
  .cclear{color:var(--dim);border-color:var(--line)}

  /* mission header: tap row → supervisor thread; [spec] → criterion + state */
  .msec{align-items:center}
  .spec{font-size:11px;color:var(--ok);flex:none;border:1px solid #2c2c32;border-radius:7px;padding:4px 11px;font-weight:600;min-height:30px}
  .spec:active{background:#17171b}

  /* worker pill = one-line summary; tap opens its read-only artifact sheet */
  .wp-head{padding:9px 13px 9px 14px}
  .wp-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .wp-main .wp-t{flex:none;display:block}
  .wp-sum{font-size:11.5px;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .wp-dot.warn{background:var(--warn)} .wp-dot.done{background:#6a6a6a}
  .chev{color:#6f6f6f;font-size:15px;flex:none}

  /* alerts: 2-line summary clamp on the card; full report lives in the sheet */
  .cs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .schedcard .chev{margin-left:auto}

  /* ---- bottom sheet (the detail surface) ---- */
  .sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
  .sheet-scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#101012;border-top-left-radius:18px;border-top-right-radius:18px;transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1),height .26s ease;z-index:81;max-height:64%;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.55)}
  /* Lift the sheet above the on-screen keyboard with a compositor transform
     (--kb = keyboard height, set by the visualViewport handler). iOS ignores a
     `bottom` offset on position:fixed while the keyboard is up, so the reply box
     used to stay buried under it; translateY moves reliably on both platforms. */
  .sheet.on{transform:translateY(calc(-1 * var(--kb, 0px)))}
  /* Editing the reply expands the sheet so its body scrolls and the input sits
     right above the keyboard (the visualViewport handler lifts it). */
  .sheet.editing{max-height:94%}
  .sheet-grabwrap{padding:7px 0 3px;flex:none;cursor:grab;touch-action:none;display:flex;justify-content:center}
  .sheet-grab{width:40px;height:5px;border-radius:3px;background:#303036}
  .sheet-head{display:flex;align-items:flex-start;gap:11px;padding:4px 16px 8px;flex:none;touch-action:none}
  .sheet-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;font-weight:700;background:var(--raised);color:var(--dim)}
  .sheet-ico.g{color:var(--ok)} .sheet-ico.a{color:var(--warn)} .sheet-ico.r{color:var(--err)}
  .sh-meta{flex:1;min-width:0}
  .sheet-intent{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#8a8a8a;font-weight:600}
  .sheet-title{font-size:16px;font-weight:600;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
  .sheet-x{color:var(--dim);font-size:16px;width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;align-self:center}
  /* Just the arrow — no boxed background (note 7a420a05). It's the sheet's
     primary back affordance, so render it in full text colour, not dim. */
  .sheet-back{color:var(--text);width:30px;height:34px;margin-left:-5px;flex:none;display:flex;align-items:center;justify-content:center;align-self:center}
  .sheet-back:active{opacity:.5}
  .sheet-back svg{width:21px;height:21px}
  .sheet-action{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--dim);flex:none;align-self:center;min-height:30px;white-space:nowrap}
  .sheet-action:active{background:var(--raised)}
  .sheet-action.danger{color:var(--err);border-color:#5a302e}
  .sheet-action.confirm{background:var(--err);color:#fff;border-color:var(--err)}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
  /* conversation content wraps; only code/tables keep their own internal scroll */
  .sheet-body .md{overflow-wrap:anywhere}
  .thread,.tmsg,.amsg{min-width:0;max-width:100%}
  /* the reply is an auto-growing textarea that sits above the keyboard */
  .sheet-foot .reply{align-items:flex-end}
  .sheet-foot .rinp{resize:none;line-height:1.4;max-height:120px;overflow-y:auto}
  .sheet-foot .rsend{bottom:6px;top:auto}
  .sheet-body .md{font-size:13.5px;color:#cfcfcf;line-height:1.55}
  .sheet-body .lbl{color:#8a8a8a;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;margin:14px 0 5px}
  .sheet-foot{flex:none;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);background:#101012}
  .sheet-foot .reply{margin-top:0}
  /* A decision alert's single bottom CTA — opens the asking chat to reply there
     (no inline composer in alerts). Primary, full-width, centered. */
  .reply-cta{display:block;width:100%;background:var(--ok);color:#101012;font-weight:700;font-size:15px;border-radius:12px;padding:13px;min-height:46px;text-align:center;border:none;font-family:inherit}
  .reply-cta:active{opacity:.85}
  .thread{display:flex;flex-direction:column;margin:4px 0 2px}
  /* Internal worker-report wake: a neutral centered note, distinct from the
     user's own (right) and the supervisor's (left) turns. */
  .treport{align-self:center;max-width:92%;margin:2px 0 10px;padding:6px 11px;background:var(--raised);border:1px solid var(--line);border-radius:10px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.45;overflow-wrap:anywhere}
  .treport b{color:#bcbcbc;font-weight:600}
  .treport.warn{border-color:#5a4a32}
  .treport.warn b{color:#c69a5b}
  /* The chain of substantive updates: each entry is a meaningful development —
     a thing it did, or a snag it hit and corrected — checked off as it lands. A
     rail down the left ties them into one line of progress.

     Marker geometry is the load-bearing detail here. EVERY marker (dot, check,
     snag, the live ring) is centred on the same x — the rail — and is filled with
     the SHEET BG so it punches a clean gap in the rail and the line never bleeds
     through a glyph. They share that centre, so they line up exactly down the
     column instead of each sitting at its own offset (the old ✓/!/dot each had a
     different `left`, which is what read as "translucent marks that don't line
     up"). Contrast is bumped a notch from the old near-invisible greys. */
  .ttl{margin:2px 0 0;border-left:1.5px solid #34343c;padding-left:18px}
  .ttl-step{position:relative;margin:0 0 14px}
  .ttl-step:last-child{margin-bottom:2px}
  /* Base node: a small solid dot, centred on the rail (its own opaque fill masks
     the line). Used for any step without a more specific state. */
  .ttl-step::before{content:"";position:absolute;left:-21.5px;top:6px;width:7px;height:7px;border-radius:50%;background:#72727b}
  /* Done / snag: the glyph sits in a sheet-filled disc at the SAME centre as the
     dot, so the rail gaps cleanly around it and all markers align. Neutral grey
     for a done thought; amber reserved for the one thing that matters — a snag. */
  .ttl-step.done::before,
  .ttl-step.snag::before{content:"✓";left:-25px;top:2px;width:14px;height:14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#101012;border-radius:50%;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a0a0a8}
  .ttl-step.snag::before{content:"!";color:#d9a861}
  .ttl-th{font-size:13px;color:#e8e8ea;line-height:1.6;overflow-wrap:anywhere}
  .ttl-th.dim{color:var(--dim);font-style:italic}
  .tl-reply{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  /* The in-flight beat: a quiet "working…" with a hollow grey marker. NO token
     stream, NO pulse — the user wants the reasoning, not a thread of raw text. */
  #liveEdge{margin-top:12px}
  /* The "working…" node is a hollow ring, sheet-filled so the rail is masked
     behind it (not bleeding through the transparent centre) — same centre as
     every other marker so the live edge lines up with the finished steps above. */
  .ttl-step.ttl-cur::before{content:"";background:#101012;border:1.5px solid #5c5c66;box-sizing:border-box;width:11px;height:11px;left:-23.5px;top:4px;border-radius:50%}
  /* Idle supervisor isn't asleep — it's READY for you (waiting on its workers,
     free to take a question). Neutral, not a warning. */
  .idlehint{margin:12px 0 2px;padding:9px 12px;background:#141417;border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--dim);line-height:1.5}
  .tmsg{display:flex;flex-direction:column;margin-bottom:10px}
  .tmsg.user{align-items:flex-end} .tmsg.asst{align-items:flex-start}
  .tmsg .sender{font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:#7c7c7c;font-weight:700;margin:0 5px 3px}
  .tmsg .m{font-size:13px;margin:0;max-width:92%}
  .tmsg .amsg{font-size:13px;margin:0}
  .speclist{list-style:none;margin:9px 0 0;padding:0}
  .speclist li{display:flex;gap:9px;font-size:13px;color:#cfcfcf;margin:7px 0;line-height:1.45}
  .speclist .bx{flex:none;color:var(--ok)} .speclist .bx.off{color:#6a6a6a}
  .gtxt{font-size:14.5px;color:var(--text);line-height:1.45;margin-top:3px;font-weight:500}
  /* "Done when" components — the approved checklist that defines the mission. */
  .dwlist{list-style:none;margin:6px 0 0;padding:0}
  .dwlist li{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;color:#d4d4da;line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line)}
  .dwlist .dwb{flex:0 0 8px;width:8px;height:8px;border-radius:50%;border:1.5px solid #4a4a52;margin-top:4px}
  /* Checked off once the supervisor completed the mission. */
  .dwlist .dwb.done{background:var(--ok);border-color:var(--ok)}
  .specrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px}
  .specrow .sc{font-size:13px;color:var(--text);font-weight:600}
  .readonly{font-size:11.5px;color:#7c7c7c;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
</style>
</head>
<body class="page-chat">

  <div class="hdr">
    <button class="icbtn" id="convBtn" aria-label="conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="reddot" id="convdot"></span></button>
    <button class="title" id="titleBtn"><span class="tx" id="titleTx">connecting…</span><span class="sub" id="titleSub"></span></button>
    <button class="vpill" id="vpill"><span class="d"></span> voice</button>
    <button class="icbtn" id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="reddot" id="menudot"></span></button>
  </div>

  <div class="offbar"><b>box unreachable</b> retrying — messages will queue</div>

  <div class="menu" id="menu">
    <button class="mrow" data-page="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nm">Chat</span></button>

<script>
(() => {
  "use strict";
  const qs = new URLSearchParams(location.search);

  const sdkPromise = MOCK ? Promise.resolve(null) : import("https://esm.sh/@elevenlabs/client@1.7.0").catch(() => null);

  let TOKEN = qs.get("token") || "";

  if (!TOKEN && !MOCK) {

  // ---------- mock box (test mode only) ----------

  function installMock() {
    const now = Date.now();
    // Auto-play the supervisor m1 working→idle→(stale trailing frame) lifecycle
    // once on load, so the mock demonstrates a live supervisor edge and settling
    // to "waiting". Re-arm any time from a test with `window.__m1seq = 1`.
    if (typeof window.__m1seq === "undefined") window.__m1seq = 1;
    const DB = {
      vault: "summer", model: "claude-opus-4-8",
      convs: [
        { id: "m1", title: "BitNet 160M MVP", source: "mission", role: "supervisor", mission: "BitNet 160M MVP", lastActivityAt: now - 120000, msgCount: 9, preview: "seeds 1 & 3 verified; seed 2 rerunning", goal: "MISSION BRIEF (user-approved). Reproduce the BitNet 160M MVP.\n\nDone when (each defines completion — likely one worker each):\n- All 3 seeds trained, eval.loss committed for each\n- The three seeds land within 0.005 nat of each other\n- A short writeup lands under docs/", taskSummary: "Reproduce the BitNet 160M MVP across 3 seeds", statusSummary: "Seeds 1 & 3 verified; seed 2 rerunning", thinkingDigest: "Seeds 1 and 3 landed within tolerance, but seed 2 came in 0.13 nat high — likely an LR mismatch, so it respawned that worker at seed 1's learning rate rather than accept the gap. Holding the eval/writeup worker until seed 2 confirms.", doneWhenDone: ["All 3 seeds trained, eval.loss committed for each"] },
        { id: "m2", title: "Quiet watch — repo hygiene", source: "mission", role: "supervisor", mission: "Quiet watch — repo hygiene", lastActivityAt: now - 3600000, msgCount: 4, preview: "all clean on last sweep; next check at 9pm", goal: "MISSION BRIEF (user-approved). Quiet watch on repo hygiene.\n\nDone when:\n- No uncommitted drift older than 30 min\n- main pre-commit hook green", completedAt: now - 1800000 },
        { id: "w2", title: "seed-2 retry", source: "worker", role: "", mission: "BitNet 160M MVP", lastActivityAt: now - 60000, msgCount: 4, preview: "seed 2 retry running at matched LR", goal: "retry seed 2 at seed 1's LR; commit eval.loss", taskSummary: "Retry seed 2 at seed 1's LR", statusSummary: "Training relaunched; eval pending" },
        { id: "w4", title: "eval + writeup", source: "worker", role: "", mission: "BitNet 160M MVP", lastActivityAt: now - 30000, msgCount: 3, preview: "building the comparison table + writeup", goal: "build the per-seed comparison table and draft the writeup under docs/", taskSummary: "Per-seed comparison table + writeup", statusSummary: "Drafting the comparison table" },
        { id: "w1", title: "3-seed BitNet repro", source: "worker", role: "", mission: "BitNet 160M MVP", lastActivityAt: now - 1080000, msgCount: 6, preview: "all three seeds done; gap held at +0.13 nat", goal: "train + eval seeds 42/43/44 on the 1700-step config" },
        { id: "sup", title: "cockpit nav testing", source: "phone", role: "supervisor", lastActivityAt: now - 300000, msgCount: 14, preview: "shipped the unified app; working through nav", goal: "" },
        { id: "c1", title: "densing law — readings", source: "manual", role: "", lastActivityAt: now - 5400000, msgCount: 10, preview: "the crossover moves with task difficulty, not just scale", goal: "" },
      ],
      runs: [
        { convId: "w2", title: "seed-2 retry", mission: "BitNet 160M MVP", source: "worker", lastTool: "Bash", lastProgressAt: now - 60000 },
        { convId: "w4", title: "eval + writeup", mission: "BitNet 160M MVP", source: "worker", lastTool: "Write", lastProgressAt: now - 30000 },
        // An assistant chat mid-turn: must NOT appear on the Activity page.
        { convId: "sup", title: "cockpit nav testing", mission: "", source: "phone", lastTool: "Read", lastProgressAt: now - 5000 },
      ],
      schedules: [
        { id: "s1", name: "Daily coach", prompt: "Run the summer-vault coach prompt and produce the morning briefing.", label: "daily · 7:00 AM · summer vault", enabled: true, lastFiredAt: now - 18000000, quietUnlessAlert: false },
        { id: "s2", name: "Repo hygiene sweep", prompt: "Sweep the repos for uncommitted drift and a failing pre-commit on main; ping only on a real problem.", label: "every 3h", enabled: true, lastFiredAt: now - 2400000, quietUnlessAlert: true },
      ],
      notifs: [
        { id: "n1", ts: now - 120000, kind: "ask", title: "Seed 3 diverged", intention: "Mission needs your call · BitNet 160M MVP", icon: "?", cls: "a", summary: "step 800, +0.05 nat above seed 1 — real effect, or match the LR and rerun?", body: "Seed 3 is **+0.05 nat above seed 1** at step 800 and still drifting.\n\nTwo readings:\n- **Real effect** — seed sensitivity worth reporting.\n- **LR mismatch** — match seed 1's LR and rerun (~9 min).\n\nReply and the mission's supervisor takes it from there.", convId: "m1", read: false },
        { id: "n0", ts: now - 18000000, kind: "info", title: "Morning briefing", intention: "Scheduled worker · summer vault", icon: "≡", cls: "", summary: "3 things moved overnight; today: finish the 3-seed writeup + push.", body: "## Overnight\n- 3-seed BitNet nearly there.\n- Repo sweep clean.\n- Idle box auto-killed (~$0.26).\n\n## Today\n1. Resolve the seed-3 divergence.\n2. Finish the writeup and push.", convId: "cch", read: false },
        { id: "n2", ts: now - 1080000, kind: "info", title: "Worker finished — seed 44", intention: "Worker deliverable · BitNet 160M MVP", icon: "✓", cls: "g", summary: "eval.loss 1.5588, within tolerance; committed under results/.", body: "Seed 44 eval.loss **1.5588** — within the 0.005 nat tolerance. `results/seed44.jsonl` committed.", convId: "w1", read: false },
        { id: "n3", ts: now - 5400000, kind: "info", title: "Stopped an idle box", intention: "Cost / cleanup · autonomous action", icon: "$", cls: "r", summary: "idle GPU box auto-killed after its job exited; ~$0.26, nothing billing now.", body: "A box sat at zero GPU utilization for 12 minutes after its job exited — killed it. ~$0.26, nothing billing now.", read: true },
      ],
      threads: {
        m1: { id: "m1", title: "BitNet 160M MVP", source: "mission", status: "idle", messages: [
          { role: "user", content: "MISSION BRIEF (user-approved). Reproduce the BitNet 160M MVP across 3 seeds; commit eval.loss; writeup under docs/. Done = three seeds within 0.005 nat." },
          { role: "assistant", content: "Criterion pinned. Fanning out a worker per seed plus an eval/writeup worker; I'll watch on 15-min wakes and verify before I call it.", tools: ["StartWorker", "StartWorker", "StartWorker", "Schedule"] },
          { role: "user", content: "Your worker \"seed-42\" (id 99284a75) just finished its turn. Last output: seed 42 trained, eval.loss 1.553 committed under results/.\n\nReview its thread and decide: verified done, steer it (AskWorker), respawn with learnings, or — only if you can't resolve it yourself — bring the user in." },
          { role: "assistant", content: "Read the worker threads. Seeds **42 & 44 landed in tolerance**, eval.loss committed. **Seed 3 diverged** at step 800 (+0.05 nat) — I held it and surfaced the call to you. Kicked the eval/writeup worker since 2 of 3 are in.", timeline: { steps: [
            { thought: "Didn't trust any worker's 'done' on its word — pulled all three threads and checked each eval.loss against the 0.005 tolerance before counting it.", action: "read 3 worker threads, verified eval.loss" },
            { thought: "Seed 3 came back diverged at step 800, +0.05 nat above seed 1 and still drifting — that breaks the within-tolerance criterion, so I couldn't mark it done.", action: "", snag: true },
            { thought: "Whether that's a real seed effect or just an LR mismatch is a judgment call with real cost either way, so I held the worker and put the decision to you rather than guess.", action: "asked you: real effect, or rerun at matched LR?" },
            { thought: "Two of three are already in tolerance, so there's no reason to block the writeup on seed 3 — kicked the eval/writeup worker in parallel.", action: "spawned the eval + writeup worker" },
          ], reply: "Seeds **42 & 44** landed in tolerance; **seed 3 diverged** at step 800 (+0.05 nat) — I held it and surfaced the call to you. Kicked the eval/writeup worker since 2 of 3 are in." } },
          { role: "user", content: "don't wait on it — spin up a worker to rerun seed 3 at seed 42's LR." },
          { role: "assistant", content: "On it — spawning a worker to rerun seed 3 at seed 42's LR.", tools: ["StartWorker"] },
        ] },
        w2: { id: "w2", title: "seed-2 retry", source: "worker", status: "running", messages: [
          { role: "user", content: "retry seed 2 at seed 1's LR; commit eval.loss" },
          { role: "assistant", content: "Matched the LR, streaming c4. Step 600, tracking seed 1 within 0.01 nat so far.", tools: ["Bash"] },
        ] },
        w4: { id: "w4", title: "eval + writeup", source: "worker", status: "running", messages: [
          { role: "user", content: "build the per-seed comparison table and draft the writeup under docs/" },
          { role: "assistant", content: "Have seeds 42 & 44. Table built; drafting docs/bitnet-160m-mvp/writeup.md now.", tools: ["Read", "Write"] },
        ] },
        w1: { id: "w1", title: "3-seed BitNet repro", source: "worker", status: "idle", messages: [
          { role: "user", content: "train + eval seeds 42/43/44 on the 1700-step config" },
          { role: "assistant", content: "## Result\n\nAll three seeds done.\n\n| seed | eval loss |\n|---|---|\n| 42 | 1.5576 |\n| 43 | 1.5601 |\n| 44 | 1.5588 |\n\nGap held at **+0.13 nat**. `eval.loss` committed under `results/`.", tools: ["Write", "Bash"] },
        ] },
        cch: { id: "cch", title: "Morning briefing", source: "scheduled", status: "idle", messages: [
          { role: "user", content: "Run the summer-vault coach prompt and produce the morning briefing." },
          { role: "assistant", content: "## Overnight\n- **3-seed BitNet** repro nearly there.\n- Repo-hygiene sweep: clean.\n- Idle GPU box auto-killed (~$0.26).\n\n## Today\n1. Resolve the seed-3 divergence.\n2. Finish the writeup and push." },
        ] },
        sup: { id: "sup", title: "cockpit nav testing", source: "phone", status: "idle", messages: [
          { role: "user", content: "rebuild the phone nav — pages from the menu" },
          { role: "assistant", content: "Done — pages live behind the menu now, conversations are the left button." },
        ] },
        c1: { id: "c1", title: "densing law — readings", source: "manual", status: "idle", messages: [
          { role: "user", content: "summarize BitNet's ternary quantization + the STE trick, with the loss gap" },
          { role: "assistant", content: "## BitNet 160M — quick notes\n\nWeights are **ternary**, mapped to $\\{-1,0,+1\\}$ by a scaled sign:\n\n$$\\hat{w}=\\alpha\\cdot\\operatorname{sign}(w),\\qquad \\alpha=\\frac{1}{n}\\sum_i |w_i|$$\n\nThe *straight-through estimator* passes the gradient through unchanged:\n\n$$\\frac{\\partial\\mathcal{L}}{\\partial w}\\approx\\frac{\\partial\\mathcal{L}}{\\partial\\hat{w}}$$\n\nAcross three seeds the eval-loss gap held at about $+0.13$ nat." },
        ] },
      },
    };
    const reply = (obj) => new Response(JSON.stringify(obj), { status: 200, headers: { "Content-Type": "application/json" } });
    let pollWaited = false, pollTick = 0;
    window.fetch = async (url, opts) => {
      const u = String(url).split("?")[0];
      const q = new URLSearchParams(String(url).split("?")[1] || "");
      const body = opts && opts.body ? JSON.parse(opts.body) : {};
      if (u === "/conversations") return reply({ vault: DB.vault, conversations: DB.convs });
      if (u === "/conversation") { const t = DB.threads[q.get("id")]; return t ? reply(t) : reply({ error: "not found" }); }
      if (u === "/status") return reply({ vault: DB.vault, model: DB.model, version: "0.4.21-mock", runs: DB.runs });
      if (u === "/schedules") return reply({ schedules: DB.schedules });
      if (u === "/notifications") return reply({ unread: DB.notifs.filter((n) => !n.read).length, notifications: DB.notifs });
      if (u === "/notifications/read") { const n = DB.notifs.find((x) => x.id === body.id); if (n) n.read = true; return reply({ ok: true }); }
      if (u === "/notifications/hide") { DB.notifs = DB.notifs.filter((x) => x.id !== body.id); return reply({ ok: true }); }
      if (u === "/poll") {
        // Running workers stream signs of life so the thread's live timeline is
        // real in mock mode — the same "runtime" events (text + growing steps)
        // the box broadcasts per run.
        pollTick += 1;
        // A worker's finished thoughts revealed over time, plus a trailing in-flight
        // placeholder — the live edge shows the done ones + a quiet "working…".
        const completed = [
          { thought: "Seed 1's committed eval.loss is my ground truth, so I read it and the config before touching anything — I'm matching its exact learning rate, not eyeballing it." },
          { thought: "The first relaunch errored on a stale checkpoint path left from the previous run, so I cleared the checkpoint dir and reran; it's training cleanly now." },
        ];
        const nDone = Math.min(completed.length, 1 + Math.floor(pollTick / 4));
        const steps = completed.slice(0, nDone).concat([{ thought: "" }]);
        const evs = DB.runs.filter((r) => r.source === "worker").map((r) => ({ type: "runtime", convId: r.convId, text: "", tool: "", steps }));
        // Supervisor m1: script a working turn that ENDS with a stale trailing
        // frame — status:idle then a lingering runtime in the SAME batch — to prove
        // the sheet settles to "waiting" instead of sticking on "working…" (the
        // close-and-reopen bug). Runs once, early, so verification is quick.
        const m1steps = [
          { thought: "Pulled seed-2's retry thread — at step 600 it's tracking seed 1 within 0.01 nat, so it's on course." },
          { thought: "Holding the eval/writeup worker until seed 2's eval.loss actually commits rather than calling it early." },
          { thought: "" },
        ];
        // Re-armable via window.__m1seq = 1 (set from a test) so the running →
        // idle → stale-trailing-frame sequence can be fired at will while the m1
        // sheet is open — the precise condition the reopen bug needs.
        if (typeof window.__m1seq === "number" && window.__m1seq >= 1) {
          const p = window.__m1seq;
          if (p <= 2) {
            if (!DB.runs.some((r) => r.convId === "m1")) DB.runs.push({ convId: "m1", title: "BitNet 160M MVP", mission: "BitNet 160M MVP", source: "mission", lastTool: "Read", lastProgressAt: Date.now() });
            evs.push({ type: "runtime", convId: "m1", text: "", tool: "Read", steps: m1steps.slice(0, Math.min(m1steps.length, p + 1)) });
          } else if (p === 3) {
            DB.runs = DB.runs.filter((r) => r.convId !== "m1");
            evs.push({ type: "status", convId: "m1", status: "idle" });
            evs.push({ type: "runtime", convId: "m1", text: "", tool: "Read", steps: m1steps }); // the stale trailing frame
          }
          window.__m1seq = p >= 3 ? 0 : p + 1;
        }
        // Re-armable via window.__chatSeq = 1: the two-lane conversational front
        // answering while the executor keeps streaming CHANGING steps — to prove
        // the executor edge FREEZES during the reply and the reply folds in at end.
        if (typeof window.__chatSeq === "number" && window.__chatSeq >= 1) {
          const p = window.__chatSeq;
          if (!DB.runs.some((r) => r.convId === "m1")) DB.runs.push({ convId: "m1", title: "BitNet 160M MVP", mission: "BitNet 160M MVP", source: "mission", lastTool: "Bash", lastProgressAt: Date.now() });
          evs.push({ type: "runtime", convId: "m1", text: "", tool: "Bash", steps: [{ thought: "executor still grinding — tick " + p + " (should stay frozen while answering)" }, { thought: "" }] });
          const rep = "Seed 2's retry is at step 600, tracking seed 1 within 0.01 nat — on course. Holding the eval/writeup worker until its loss commits.";
          if (p === 1) { DB.threads.m1.messages.push({ role: "user", content: "how's seed 2 doing?" }); evs.push({ type: "chat", convId: "m1", phase: "start" }); }
          else if (p === 2) evs.push({ type: "chat", convId: "m1", phase: "stream", text: rep.slice(0, 40) });
          else if (p === 3) evs.push({ type: "chat", convId: "m1", phase: "stream", text: rep });
          else if (p === 4) {
            // Lane ends, but the persisted reply has NOT landed in the thread yet —
            // this reproduces the ~½s gap where the old code blinked the reply out.
            evs.push({ type: "chat", convId: "m1", phase: "end" });
          }
          else if (p === 5) {
            // Persisted reply lands a beat later; the settled edge should hand off
            // to it seamlessly (no frame where the reply is absent).
            DB.threads.m1.messages.push({ role: "assistant", content: rep, direct: true });
          }
          window.__chatSeq = p >= 5 ? 0 : p + 1;
        }
        if (!pollWaited) { pollWaited = true; return reply({ events: evs, next: String(pollTick) }); }
        await new Promise((r) => setTimeout(r, 2500));
        return reply({ events: evs, next: String(pollTick) });

  function timelineHtml(tl) {

  let sheetChatText = "";

  // The live edge appended to a RUNNING thread: the agent's work as it happens,
  // rendered as a GROWING thought→action timeline (same look as the finished,
  // Haiku-cleaned timeline above it — but building step by step, the last step
  // pulsing). Actions are humanized on the box ("read worker-a.md"), never raw

  // tail so there's always a sign of life.

        onError: (m) => setVErr(typeof m === "string" ? m : (m && m.message) || "voice error"),
        onAudio: (b64) => { try { const lvl = pcmLevel(b64); vAgentLevel = Math.max(lvl, vAgentLevel * 0.6); vAgentActiveUntil = Date.now() + 280; } catch {} },
        onMessage: ({ message, role }) => { const text = (message || "").trim(); if (!text) return; api("/voice-transcript", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: role === "user" ? "user" : "assistant", text }) }).catch(() => {}); },
      });
      sessionPromise.then((c) => { clearTimeout(watchdog); if (timedOut && c) { try { c.endSession(); } catch {} } }).catch(() => clearTimeout(watchdog));
      vConv = await Promise.race([sessionPromise, new Promise((_, rej) => { watchdog = setTimeout(() => { timedOut = true; rej(new Error("connect timed out after 15s")); }, 15000); })]);
      clearTimeout(watchdog);
    } catch (e) {
      vConnecting = false; vTeardownAudio(); document.body.classList.remove("vconnecting");
      if (!vAutoRetried) { vAutoRetried = true; setTimeout(() => { try { if (vMicCtx && vMicCtx.state === "suspended") vMicCtx.resume().catch(() => {}); } catch {} vStart(); }, 800); return; }
      setVErr(String((e && e.message) || e));
    }
  }
  function vTeardown() { vLive = false; cancelAnimationFrame(vRafId); vRafId = 0; vTeardownAudio(); vAutoRetried = false; vSmoothed.fill(0); for (const b of vBars) b.style.transform = "scaleY(.16)"; document.body.classList.remove("voice", "voicemin", "vconnecting", "vmicmuted"); vMuted = false; vConv = null; vConnecting = false; }
  async function vStop() { try { if (vConv) await vConv.endSession(); } catch {} vTeardown(); }
  $("voiceRow").onclick = () => {
    closeMenu();
    if (vLive || vConnecting) { document.body.classList.add("voice"); document.body.classList.remove("voicemin"); return; }
    try { vMicCtx = vMicCtx || new (window.AudioContext || window.webkitAudioContext)(); if (vMicCtx.state === "suspended") vMicCtx.resume().catch(() => {}); const b = vMicCtx.createBuffer(1, 1, 22050); const s = vMicCtx.createBufferSource(); s.buffer = b; s.connect(vMicCtx.destination); s.start(0); } catch {}
    hideKb(); document.body.classList.add("voice"); document.body.classList.remove("voicemin"); vStart();
  };
  function vSetMute(m) { vMuted = m; document.body.classList.toggle("vmicmuted", m); if (vConv) try { vConv.setMicMuted(m); } catch {} }
  $("vMuteBtn").onclick = () => vSetMute(!vMuted);
  $("vEndBtn").onclick = vStop;
  $("vMinBtn").onclick = () => { if (vLive || vConnecting) { document.body.classList.add("voicemin"); document.body.classList.remove("voice"); } else vStop(); };
  $("vpill").onclick = () => { document.body.classList.add("voice"); document.body.classList.remove("voicemin"); };

  // ---------- lifecycle ----------
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { void pollLoop(); void refreshState(); void refreshBadge(); if (page === "activity") void loadActivity(); if (page === "alerts") void loadAlerts(); }
  });
  if (window.visualViewport) {
    const vv = window.visualViewport;
    // Keyboard handling. --kb is the height the composer must rise to sit on top of
    // the keyboard; the composer's padding-bottom and the .sheet transform consume
    // it. Re-applied on scroll too because iOS shifts the viewport as the keyboard
    // animates. The shell height itself is CSS-only (100lvh in standalone) — never
    // JS-controlled — so nothing here can strand the old dead strip.
    const applyKb = () => {
      // kbRaw: keyboard height measured against documentElement.clientHeight, the
      // stable layout viewport that equals vv.height at rest — so this reads ~0 with
      // no keyboard and is the reliable "is the keyboard up?" signal.
      const kbRaw = Math.max(0, document.documentElement.clientHeight - vv.height - vv.offsetTop);
      const up = kbRaw > 60;
      // Keyboard up: collapse the composer's home-indicator inset so the textbox
      // sits flush on the keyboard (the keyboard already covers that strip).
      document.body.classList.toggle("kbup", up);
      // The body is sized to the FULL screen (100lvh in standalone), which is taller
      // than clientHeight's layout viewport by the safe-area-top band iOS excludes
      // (measured: 874 vs 812 = 62px on a Dynamic Island phone). kbRaw is computed in
      // the shorter clientHeight space, so the composer landed ~62px BEHIND the
      // keyboard. Add that band back. It is 0 in a browser tab (body == 100dvh ==
      // clientHeight), so Safari is unaffected.
      const safeBand = Math.max(0, document.body.offsetHeight - document.documentElement.clientHeight);
      document.documentElement.style.setProperty("--kb", (up ? kbRaw + safeBand : 0) + "px");
      // While editing a reply, cap the sheet to the space above the keyboard so
      // the whole sheet stays visible, not just the lifted foot.
      const sheet = $("sheet");
      if (sheet.classList.contains("editing")) sheet.style.maxHeight = vv.height + "px";
    };
    const fit = () => { applyKb(); window.scrollTo(0, 0); scrollDown(false); };
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", () => { window.scrollTo(0, 0); applyKb(); });
    fit(); // reconcile the initial geometry so a short launch viewport can't strand a strip
  }

  // A push tapped while the app is already OPEN (iOS keeps the PWA backgrounded,
  // not closed — the common case) can't be navigated from the service worker, so
  // the SW postMessages the deep-link and we route in place to the asking thread.
  // Without this a "Needs you" tap just re-focuses whatever chat you had open
  // last — the wrong-conversation bug. Mirrors the ?conv= boot path below.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", (e) => {
      const d = (e && e.data) || {};
      if (d.type !== "deeplink" || !d.url) return;
      try {
        const cid = new URLSearchParams(String(d.url).split("?")[1] || "").get("conv");
        if (cid) void openThread(cid);
      } catch {}
    });
  }

  showHint();
  setHeader();
  // A tapped push notification deep-links to the ASKING thread via ?conv=<id>
  // (from the push url, when the app was launched cold). It MUST win over the
  // sticky last-thread restore below — otherwise the tap lands you on whatever
  // chat you had open last, not the one waiting on your call.
  const bootConv = qs.get("conv");
  if (bootConv) {
    void openThread(bootConv);
  } else {
    // Return to the thread you were in last session (404 falls back to a fresh chat).
    try {
      const saved = JSON.parse(localStorage.getItem(LAST_CONV_KEY) || "null");
      if (saved && saved.id) void openThread(saved.id, saved.title);
    } catch {}
  }
  void refreshState();
  void refreshBadge();
  void pollLoop();
  setInterval(() => { void refreshState(); }, 45000);
})();
</script>
</body>
</html>
