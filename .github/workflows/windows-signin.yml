# Proof that "Sign in with Claude" works on Windows — on a real Windows
# machine, against the real claude.exe.
#
# Why this exists: the button worked on Linux and failed on Carl's Windows 11
# laptop three releases running ("Opening browser…", then `claude setup-token`
# never printed a sign-in link, and a claude.exe application-error dialog). The
# driver is a pty around the real CLI, so nothing short of running it on Windows
# can say whether it works — and every fix so far was argued from Linux.
#
# So this job installs Claude Code the way Carl's laptop has it (the official
# installer, ~/.local/bin/claude.exe), drives the real sign-in through the real
# driver, and asserts a whole authorize URL came back. No login is completed:
# the URL is where a human takes over, and the code the test then sends is
# deliberately bogus, so nothing here can mint or hold a token.
#
# It runs on its own, not inside ship.yml: ship builds installers and must not
# wait on the network reaching Anthropic, and this needs to be re-runnable on
# its own whenever the driver is touched.
name: windows sign-in

on:
  push:
    paths:
      - "src-tauri/src/claude_login.rs"
      - ".github/workflows/windows-signin.yml"
  workflow_dispatch:

# One at a time: each run drives a real CLI against Anthropic's OAuth endpoint.
concurrency:
  group: windows-signin
  cancel-in-progress: true

jobs:
  # What the CLI does on Windows when nobody is holding a terminal open for it.
  #
  # The driver drives `claude setup-token` through a pty, and on Windows that
  # pty is the thing that fails: under ConPTY every child dies at once with
  # 0xC0000142 (STATUS_DLL_INIT_FAILED) and prints nothing — Carl's laptop and
  # a plain `cmd /c echo hi` both. So before any more driver is written, this
  # asks a real Windows machine what the CLI will give a plain child process
  # with pipes: that is the only thing left to build on.
  #
  # Each answer comes back as an annotation, because annotations are the part
  # of a run that can be read back without admin rights on the repository.
  # Nothing here completes a login: the browser is stubbed out and the config
  # dir is a throwaway.
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code the way a laptop has it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://claude.ai/install.ps1 | iex
          $cli = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          if (-not (Test-Path $cli)) { throw "the installer left no claude.exe at $cli" }
          "VC_CLAUDE_BIN=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ask the CLI what it does with pipes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cli = $env:VC_CLAUDE_BIN
          function note($title, $text) {
            $t = ($text -replace 'sk-ant[^\s"]*', 'REDACTED') -replace '[\r\n]+', ' | '
            if ($t.Length -gt 900) { $t = $t.Substring(0, 900) }
            Write-Host "::notice title=$title::$t"
          }
          function probe($name, [string[]]$argv, $seconds) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $cli
            foreach ($a in $argv) { $psi.ArgumentList.Add($a) }
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.RedirectStandardInput = $true
            $psi.UseShellExecute = $false
            # No console window, and a config dir of its own: nothing of this
            # run's doing is left on the machine or in anybody's account.
            $psi.CreateNoWindow = $true
            $psi.EnvironmentVariables["CLAUDE_CONFIG_DIR"] = (Join-Path $env:RUNNER_TEMP "cfg-$name")
            # A browser that only writes the URL down, so "it opened a browser"
            # is visible without one being opened.
            $psi.EnvironmentVariables["BROWSER"] = "cmd /c echo"
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            $ended = $p.WaitForExit($seconds * 1000)
            if (-not $ended) { try { $p.Kill($true) } catch {} }
            Start-Sleep -Milliseconds 500
            $text = ($out.Result + " ERR: " + $err.Result).Trim()
            $code = if ($ended) { $p.ExitCode } else { "timed out after ${seconds}s" }
            $url = if ($text -match 'https://\S*oauth\S*') { "URL PRINTED" } else { "no url" }
            note "$name ($code, $url)" $text
            return $text
          }

          # Does a plain child work at all here? (Under ConPTY, nothing did.)
          probe "version" @("--version") 30 | Out-Null
          # What the commands are, on the version a laptop installs today.
          probe "help" @("--help") 30 | Out-Null
          probe "setup-token-help" @("setup-token", "--help") 30 | Out-Null
          # The real question: with pipes and no terminal, does setup-token
          # print its sign-in link, or refuse for want of a tty?
          $t = probe "setup-token" @("setup-token") 100
          if ($t -match 'https://\S*oauth\S*') {
            Write-Host "::notice title=verdict::setup-token prints the link to a plain pipe — no pty needed on Windows"
          } else {
            Write-Host "::warning title=verdict::setup-token printed no link to a plain pipe; see the probes above for what it said instead"
          }

  sign_in:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri_build reads the bundle's resources and the frontend dist as it
      # runs, and both are produced by a full app build this job has no use for.
      # The sidecar is the real download (it is what a release ships); the
      # frontend is a stub, because no window is ever opened here.
      - name: What tauri_build insists on
        shell: pwsh
        run: |
          node scripts/download-tectonic.mjs
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>stub</title>'

      # Claude Code as Carl has it: the official Windows installer, which puts
      # claude.exe in ~/.local/bin — the one path the old lookup never tried.
      - name: Install Claude Code the way a laptop has it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://claude.ai/install.ps1 | iex
          $cli = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          if (-not (Test-Path $cli)) { throw "the installer left no claude.exe at $cli" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "claude.exe would not report its version" }
          "VC_CLAUDE_BIN=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The driver itself, through its live test. --ignored is how that test is
      # asked for; a test that is not there, or is compiled out on Windows,
      # passes nothing, so the run is checked for the test having happened at
      # all before its result is believed.
      - name: Drive the real sign-in
        shell: pwsh
        working-directory: src-tauri
        run: |
          $ErrorActionPreference = 'Continue'
          # Annotations are the only part of a run this repo's token can read
          # back, so every outcome is reported through one — redacted, on one
          # line, and short enough that GitHub keeps it.
          function summary($text) {
            $t = ($text -replace 'sk-ant[^\s"]*', 'REDACTED') -replace '[\r\n]+', ' | '
            if ($t.Length -gt 900) { $t = $t.Substring($t.Length - 900) }
            return $t
          }
          cargo test --lib claude_login -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP\signin.log
          $code = $LASTEXITCODE
          $log = Get-Content $env:RUNNER_TEMP\signin.log -Raw
          if ($log -match 'sk-ant') { throw "a token reached the log" }
          # Say the outcome where it can be read without access to the run log:
          # an annotation shows on the run's own page and through the API.
          Write-Host ("::notice title=driver::" + (summary $log))
          if ($code -ne 0) {
            Write-Host ("::error title=driver failed::exit " + $code + " — " + (summary $log))
            throw "the sign-in driver failed on Windows (exit $code)"
          }
          if ($log -notmatch 'a_real_setup_token_hands_over_a_sign_in_url') {
            Write-Host "::error title=vacuous::the live sign-in test never ran — compiled out on Windows, or renamed"
            throw "the live sign-in test never ran. This job proves nothing without it."
          }
          if ($log -notmatch 'test result: ok\. [1-9]') {
            Write-Host "::error title=vacuous::no live test passed"
            throw "no live test passed; the run was vacuous"
          }
          Write-Host "the real claude.exe handed over a sign-in URL through the real driver"

      # The log is the evidence, and it has been checked for a token above. The
      # URL in it is a PKCE authorize link for a login nobody completed.
      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signin-log
          path: ${{ runner.temp }}/signin.log
          if-no-files-found: warn
