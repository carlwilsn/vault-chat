name: mac-retry

# The Mac proof job (ship.yml build_macos) waits on GitHub's macOS arm64
# runners, which are sometimes short: run 44313098612's Mac job was cancelled
# after 15 min as "not acquired by Runner of type hosted", with no steps, and
# that release got no mac-proof.zip. When a ship run ends with its Mac job in
# that state (cancelled, no runner), re-run that job (and mac_proof after it,
# which uploads to the same release) — at most twice per run. Nothing else is
# re-run and nothing here builds, signs or publishes.
on:
  workflow_run:
    workflows: [ship]
    types: [completed]

permissions:
  actions: write

jobs:
  retry_mac:
    if: github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run a Mac job that never got a runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          JOB=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=50" \
                  --jq '.jobs[] | select(.name == "build_macos") | "\(.id) \(.conclusion) \(.runner_id // 0)"')
          echo "build_macos: ${JOB:-not in this run}"
          read -r id conclusion runner <<<"$JOB"
          if [ -n "${id:-}" ] && [ "$conclusion" = cancelled ] && [ "${runner:-0}" = 0 ]; then
            echo "The Mac job never got a runner: re-running it (and mac_proof after it)."
            gh api -X POST "repos/$REPO/actions/jobs/$id/rerun"
          else
            echo "Nothing to re-run."
          fi
