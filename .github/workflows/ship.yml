name: ship

# Push-triggered shipping when source under src/** or src-tauri/**
# changes. The path filter keeps trivial commits (workflow tweaks, docs,
# scripts) from burning a build. Checks if there are any new commits on
# main since the last release tag, and if so: bumps the patch version,
# commits the bump back to main with [skip ci] (which prevents this
# workflow from re-firing on its own version-bump push), builds + signs
# installers for Windows and Linux, and publishes a GitHub Release with
# the updater manifest. The installed app sees it on next launch.
#
# Manual escape hatch: push a v* tag yourself (release.yml), or
# workflow_dispatch this from the Actions UI.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: ship
  cancel-in-progress: true

jobs:
  # ── Phase 1: run once ─────────────────────────────────────────────────────
  # Check for new commits, generate release notes, bump the version, and
  # commit the bump back to main. Everything downstream reads the outputs
  # of this job so the bump never fires twice.
  prepare:
    if: vars.SHIP_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      version:     ${{ steps.bump.outputs.version }}
      body:        ${{ steps.notes.outputs.body }}
      range:       ${{ steps.changes.outputs.range }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for new commits since last release
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "First release — proceeding"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "range=HEAD" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
            if [ "$COUNT" -gt 0 ]; then
              echo "$COUNT new commits since $LAST_TAG — shipping"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "range=$LAST_TAG..HEAD" >> $GITHUB_OUTPUT
            else
              echo "No new commits since $LAST_TAG — nothing to do"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate release notes
        if: steps.changes.outputs.has_changes == 'true'
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BODY=$(node scripts/release-notes.mjs "${{ steps.changes.outputs.range }}")
          echo "Release body:"
          echo "$BODY"
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Type check
        if: steps.changes.outputs.has_changes == 'true'
        run: npx tsc --noEmit

      - name: Bump version
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          NEW=$(node scripts/bump-version.mjs)
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped to v$NEW"

      - name: Commit version bump back to main
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "v${{ steps.bump.outputs.version }} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push attempt $attempt failed — retrying"
            sleep 2
          done

  # ── Phase 2: build on every platform ─────────────────────────────────────
  # Runs in parallel on Windows and Ubuntu. Each platform builds its own
  # native installer and attaches it to the same GitHub release.
  build:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            # Build AppImage only; config override swaps tectonic resource
            # path from tectonic.exe (Windows) to tectonic (Linux).
            args: '--bundles appimage --config src-tauri/tauri.linux.conf.json'
    runs-on: ${{ matrix.platform }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the version-bumped commit that prepare just pushed.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux needs native WebKit / GTK / AppIndicator headers.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      # Download the Tectonic LaTeX engine for the current platform.
      # Windows gets tectonic.exe (from a zip); Linux gets tectonic (from
      # a tar.gz).  tauri.linux.conf.json overrides the resource path so
      # each bundle picks up the right binary.
      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      - name: Build, sign, publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: vault-chat v${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: ${{ matrix.platform == 'windows-latest' }}
          args: ${{ matrix.args }}

      # Demo vault attachment — Windows runner only (runs once, no duplication).
      - name: Zip demo vault
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path demo-vault -DestinationPath demo-vault.zip -Force

      - name: Attach demo vault to release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.prepare.outputs.version }} demo-vault.zip --clobber
