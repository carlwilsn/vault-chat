name: ship

# Push-triggered shipping when source under src/**, src-tauri/** or server/**
# changes. The path filter keeps trivial commits (workflow tweaks, docs,
# scripts) from burning a build. Checks if there are any new commits on
# main since the last release tag, and if so: bumps the patch version,
# commits the three version stamps on detached HEAD and pushes ONLY its
# release tag (never main), creates a DRAFT release, builds + signs installers
# for Windows and Linux and the headless server bundle, and only then — once every asset and the
# complete updater manifest are attached — publishes the release.
#
# Why draft-first: `releases/latest` (which the desktop updater and the
# box's vault-chat-update.sh both read) must never point at a release whose
# latest.json or server bundle is not uploaded yet. A draft is invisible to
# `latest`; the immutable tag already identifies the version-only build child.
# A failed ship can leave that tag/draft, but never an incomplete latest release.
# Re-run failed build jobs against their pinned draft, or manually dispatch a
# fresh version. Tags are never forced or overwritten.
#
# Manual escape hatch: workflow_dispatch this from the Actions UI.
# (release.yml, the old tag-push workflow, is gone: it published its own
# racing latest.json.)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "server/**"
  workflow_dispatch:

# Never cancel a running ship: a second push used to cancel one after the
# bump and tag, leaving a release without latest.json. Later pushes queue
# (GitHub keeps the newest pending run) and ship together.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  # ── Phase 1: run once ─────────────────────────────────────────────────────
  # Check for new commits, generate release notes, bump the version, and
  # tag the detached version-only child. Everything downstream reads the outputs
  # of this job so the bump never fires twice.
  prepare:
    if: vars.SHIP_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      version:     ${{ steps.bump.outputs.version }}
      body:        ${{ steps.notes.outputs.body }}
      range:       ${{ steps.changes.outputs.range }}
      sha:         ${{ steps.push.outputs.sha }}
      release_id:  ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for new commits since last release
        id: changes
        run: |
          # Tags are siblings of later accepted main, not ancestors. Consider the
          # newest stable release tag globally, not git describe's reachable tags.
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen++ { print }')
          if [ -z "$LAST_TAG" ]; then
            echo "First release — proceeding"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "range=HEAD" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
            if [ "$COUNT" -gt 0 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "$COUNT new commits since $LAST_TAG — shipping"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "range=$LAST_TAG..HEAD" >> $GITHUB_OUTPUT
            else
              echo "No new commits since $LAST_TAG — nothing to do"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate release notes
        if: steps.changes.outputs.has_changes == 'true'
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BODY=$(node scripts/release-notes.mjs "${{ steps.changes.outputs.range }}")
          echo "Release body:"
          echo "$BODY"
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Type check
        if: steps.changes.outputs.has_changes == 'true'
        run: npx tsc --noEmit

      - name: Bump version
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain)" ]
          NEW=$(node scripts/bump-version.mjs)
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped to v$NEW"

      - name: Commit version stamp and push only the release tag
        if: steps.changes.outputs.has_changes == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "v${{ steps.bump.outputs.version }} [skip ci]"
          # A single metadata-only child of the exact accepted input. Never
          # pull/rebase here: gates certified that input, not newer main.
          [ "$(git rev-parse HEAD^)" = "$GITHUB_SHA" ]
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "refs/tags/v${{ steps.bump.outputs.version }}"
          # All build jobs and the release target use the actual tagged child.
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create the draft release
        if: steps.changes.outputs.has_changes == 'true'
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          printf '%s\n' "$BODY" > release-notes.md
          ID=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$SHA" \
            -f name="vault-chat v$VERSION" -F body=@release-notes.md \
            -F draft=true -F prerelease=false --jq .id)
          echo "Draft release $ID for v$VERSION at $SHA"
          echo "id=$ID" >> $GITHUB_OUTPUT

  # ── Phase 2: build on every platform ─────────────────────────────────────
  # Runs in parallel on Windows and Ubuntu. Each platform builds its own
  # native installer and attaches it to the same GitHub release.
  # Windows builds on its native runner. tauri-action builds, signs, and
  # publishes the NSIS + MSI installers and the updater manifest.
  build_windows:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the version-bumped commit that prepare just pushed.
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      # What a machine with no box runs the vault-chat server with. The Tauri
      # prebuild hook fetches these too, but the bundle's resources are read
      # while the crate is built — so they are fetched here, beside tectonic,
      # where they are certain to exist before anything asks for them.
      - name: Download the Node runtime the app carries
        run: node scripts/download-node.mjs

      - name: Pack the server the app carries
        run: node scripts/pack-server-into-app.mjs

      - name: Build, sign, upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one draft prepare created, by its exact id.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # No per-job manifest: the Windows and Linux jobs used to each upload
          # their own latest.json (only their platforms) and race — last write
          # won, sometimes dropping a platform and breaking its updater. The
          # `manifest` job below assembles one complete latest.json from all the
          # signatures instead. The signed `.sig` artifacts still upload here.
          includeUpdaterJson: false
          args: ''

      # Demo vault attachment — Windows job only (runs once, no duplication).
      - name: Zip demo vault
        shell: pwsh
        run: Compress-Archive -Path demo-vault -DestinationPath demo-vault.zip -Force

      - name: Attach demo vault to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.prepare.outputs.version }} demo-vault.zip --clobber

  # Linux builds INSIDE an ubuntu:26.04 container, not on the GitHub runner.
  # Why: the AppImage bundles the glib/GTK/wayland-egl stack from the build
  # host. Building on the ubuntu-24.04 runner bundled glib 2.80, which is too
  # old for modern hosts (Ubuntu 26.04 ships glib 2.88) — the host's gvfs/EGL
  # modules then fail to load into the app and it crashed at startup with
  # EGL_BAD_PARAMETER and never showed a window (#51). Building in a 26.04
  # container bundles a matching 2.88 stack, so the AppImage launches on
  # current distros and Tauri's in-app updater can keep it up to date.
  build_linux:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DEBIAN_FRONTEND: noninteractive
      # appimagetool / linuxdeploy are themselves AppImages; FUSE isn't
      # available in the container, so run them via extract-and-run.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # git is needed by actions/checkout; the rest are tauri/linuxdeploy
      # build + bundle dependencies. Runs before checkout so git exists.
      - name: Install system build dependencies
        run: |
          # archive.ubuntu.com goes unreachable from GitHub's runners at times
          # (Nov 2026: every Linux build failed on it). Azure's mirror is the one
          # GitHub's own images use.
          sed -i 's#http://archive.ubuntu.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80retries
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git xz-utils \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin \
            patchelf desktop-file-utils \
            xdg-utils libgdk-pixbuf2.0-bin shared-mime-info zsync

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # In the container the job runs as root over a checkout owned by another
      # uid; mark it safe so tauri-action's git calls don't bail on "dubious
      # ownership".
      - name: Mark workspace as git-safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      # What a machine with no box runs the vault-chat server with. The Tauri
      # prebuild hook fetches these too, but the bundle's resources are read
      # while the crate is built — so they are fetched here, beside tectonic,
      # where they are certain to exist before anything asks for them.
      - name: Download the Node runtime the app carries
        run: node scripts/download-node.mjs

      - name: Pack the server the app carries
        run: node scripts/pack-server-into-app.mjs

      - name: Build, sign, upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one draft prepare created, by its exact id.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # See build_windows: the merged manifest is built by the `manifest`
          # job from the signatures, not per-platform here (which raced).
          includeUpdaterJson: false
          args: '--bundles appimage,deb --config src-tauri/tauri.linux.conf.json'

  # The headless box server (server/**). esbuild bundles it into one .mjs;
  # scripts/build-server-release.mjs adds the sha256s, the phone/PWA assets and
  # server-version.json — the files server/deploy/vault-chat-update.sh installs.
  build_server:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the server bundle
        env:
          VC_REV: ${{ needs.prepare.outputs.sha }}
        run: npm run build:server

      - name: Package the release files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REV: ${{ needs.prepare.outputs.sha }}
        run: node scripts/build-server-release.mjs

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --clobber release-server/*

  # macOS: build the .app/.dmg and prove it launches on a real Mac with its
  # native window buttons. A check only, nothing more, for now:
  # - it publishes NOTHING: no upload to the release, no darwin entry in
  #   latest.json, no signing keys (createUpdaterArtifacts is off here);
  # - it is in nobody's `needs` (the manifest job never waits for it), and
  #   continue-on-error keeps a Mac failure to this job alone, so Windows/Linux
  #   ship exactly as before;
  # - its proof (screenshot, launch video, logs) is a workflow artifact.
  build_macos:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      - name: Download the Node runtime the app carries
        run: node scripts/download-node.mjs

      - name: Pack the server the app carries
        run: node scripts/pack-server-into-app.mjs

      # src-tauri/tauri.macos.conf.json is merged in by itself (native traffic
      # lights over the app's own title bar, ad-hoc signature). No updater
      # artifacts, so no signing key is read.
      - name: Build the .app (local only, uploaded nowhere)
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Launch it with a fresh HOME and check its window
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/mac-proof"; mkdir -p "$OUT"
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          ls -la "$APP" | tee "$OUT/bundles.txt"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          codesign -dv "$APP" >> "$OUT/bundles.txt" 2>&1 || true
          sw_vers > "$OUT/system.txt"; uname -m >> "$OUT/system.txt"
          REAL_HOME="$HOME"
          FRESH="$RUNNER_TEMP/fresh-home"; mkdir -p "$FRESH"
          # The launch on video (best effort: a recording failure is noted, not fatal).
          screencapture -v -V 25 -x "$OUT/launch.mov" > "$OUT/video.log" 2>&1 &
          REC=$!
          ( sleep 45; kill "$REC" 2>/dev/null ) &   # never let the recorder hold the job
          sleep 2
          HOME="$FRESH" "$APP/Contents/MacOS/$EXE" > "$OUT/app.log" 2>&1 &
          PID=$!
          echo "launched $EXE pid $PID"
          ax() { osascript -e "tell application \"System Events\" to tell (first process whose unix id is $PID) to $1" 2>>"$OUT/osascript.log"; }
          n=0
          for i in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || { echo "::error::the app exited during launch"; break; }
            n=$(ax "count windows" || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 1
          done
          echo "windows: $n after ${i}s" | tee "$OUT/checks.txt"
          sleep 8   # let the first screen paint
          screencapture -x "$OUT/screen.png" || true
          BOUNDS=$(ax 'get {position, size} of window 1' || true)   # "x, y, w, h"
          echo "window bounds: $BOUNDS" | tee -a "$OUT/checks.txt"
          [ -n "$BOUNDS" ] && screencapture -x -R"$(echo "$BOUNDS" | tr -d ' ')" "$OUT/window.png" || true
          BUTTONS=$(ax 'get subrole of buttons of window 1' || true)
          echo "window buttons: $BUTTONS" | tee -a "$OUT/checks.txt"
          wait "$REC" 2>/dev/null || true
          ok=1
          [ "${n:-0}" -gt 0 ] || { echo "::error::no window"; ok=0; }
          grep -q AXCloseButton <<<"$BUTTONS" || { echo "::error::no close button"; ok=0; }
          grep -q AXMinimizeButton <<<"$BUTTONS" || { echo "::error::no minimize button"; ok=0; }
          grep -Eq 'AXZoomButton|AXFullScreenButton' <<<"$BUTTONS" || { echo "::error::no zoom button"; ok=0; }
          kill -0 "$PID" 2>/dev/null || { echo "::error::the app is not running after launch"; ok=0; }
          # A blank capture compresses to almost nothing.
          size=$(stat -f %z "$OUT/screen.png" 2>/dev/null || echo 0)
          echo "screenshot bytes: $size" | tee -a "$OUT/checks.txt"
          [ "$size" -gt 20000 ] || { echo "::error::the screenshot is blank or missing"; ok=0; }
          [ -s "$OUT/launch.mov" ] && echo "video: ok" >> "$OUT/checks.txt" || echo "video: not recorded (see video.log)" >> "$OUT/checks.txt"
          kill "$PID" 2>/dev/null || true; sleep 2
          # What the app wrote under the fresh HOME, and any crash report.
          mkdir -p "$OUT/home"
          find "$FRESH" -maxdepth 6 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' \) -size -5M -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'mkdir -p "$1/home/$(dirname "${2#$3/}")" && cp "$2" "$1/home/${2#$3/}"' _ "$OUT" {} "$FRESH" || true
          find "$FRESH" -maxdepth 5 > "$OUT/home-tree.txt" 2>/dev/null || true
          cp "$REAL_HOME"/Library/Logs/DiagnosticReports/*"$EXE"* "$OUT/" 2>/dev/null || true
          cat "$OUT/checks.txt"
          [ "$ok" = 1 ]

      # The built app drives itself (VC_SELFTEST, src-tauri/src/self_test.rs) with
      # test/selftest/smoke.json: its own local server answers, a note is made,
      # typed into and saved. Once on a fresh HOME as Carl's friend would start,
      # then with the path hazards a Mac brings: a vault path with spaces and
      # non-ASCII letters, and a case-sensitive APFS volume. Each variant's
      # results JSON, app log and a screenshot go into the proof; the table goes
      # to the job's summary. Any variant failing fails this job (and only this
      # job: continue-on-error, in nobody's needs but mac_proof).
      - name: Self-test the app (fresh HOME, path hazards)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u   # every variant runs; the table says which failed
          OUT="$RUNNER_TEMP/mac-proof"; ST="$OUT/selftest"; mkdir -p "$ST"
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          pkill -9 -x "$EXE" 2>/dev/null; sleep 1   # nothing left from the launch check
          SMOKE="$GITHUB_WORKSPACE/test/selftest/smoke.json"
          SUM="$OUT/summary.md"
          {
            echo "## macOS self-test ($(sw_vers -productVersion), $(uname -m))"
            echo
            echo "| variant | result | steps | took | first failure |"
            echo "|---|---|---|---|---|"
          } > "$SUM"
          failed=0
          row() { echo "| $1 | $2 | $3 | $4 | $5 |" >> "$SUM"; }
          # run <name> <home> [vault]: one launch in self-test mode, its row in the table.
          run() {
            local name=$1 home=$2 vault=${3:-} steps res code pid guard t0
            steps="$ST/$name.steps.json"; res="$ST/$name.result.json"
            rm -rf "$home"; mkdir -p "$home"
            if [ -n "$vault" ]; then jq --arg v "$vault" '{vault: $v} + .' "$SMOKE" > "$steps"; else cp "$SMOKE" "$steps"; fi
            echo "::group::self-test $name (vault: ${vault:-a fresh temp dir})"
            t0=$(date +%s)
            HOME="$home" VC_SELFTEST="$steps" VC_SELFTEST_OUT="$res" VC_SELFTEST_TIMEOUT=420 \
              "$APP/Contents/MacOS/$EXE" > "$ST/$name.app.log" 2>&1 &
            pid=$!
            # (Detached from the step's output, so a leftover sleep never holds the log open.)
            ( sleep 480; kill -9 "$pid" ) > /dev/null 2>&1 & guard=$!   # the app's own timeout is 420 s
            ( sleep 25; kill -0 "$pid" && screencapture -x "$ST/$name.png" ) > /dev/null 2>&1 &
            wait "$pid"; code=$?
            kill "$guard" 2>/dev/null || true
            local took="$(( $(date +%s) - t0 )) s"
            # What the app and its local server wrote under that HOME.
            find "$home" -maxdepth 7 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' \) -size -5M -print0 2>/dev/null \
              | xargs -0 -I{} sh -c 'mkdir -p "$1/$(dirname "${2#$3/}")" && cp "$2" "$1/${2#$3/}"' _ "$ST/$name-home" {} "$home" || true
            tail -n 40 "$ST/$name.app.log" || true
            echo "::endgroup::"
            if [ ! -s "$res" ]; then
              echo "::error::self-test $name: no results file (exit $code)"
              row "$name" "FAIL" "-" "$took" "no results file, exit $code"; failed=1; return
            fi
            local ok passed total why
            ok=$(jq -r '.ok' "$res")
            passed=$(jq '[.steps[] | select(.ok)] | length' "$res")
            total=$(jq '.steps | length' "$steps")
            why=$(jq -r '(.error // "") as $e | ([.steps[] | select(.ok | not)][0]) as $s
                         | if $s then "step \($s.i) \($s.action): \($s.error // "")" else $e end' "$res" \
                  | tr '\n|' '  ' | cut -c1-240)
            if [ "$ok" = true ] && [ "$code" = 0 ]; then
              row "$name" "pass" "$passed/$total" "$took" ""
            else
              echo "::error::self-test $name failed: ${why:-exit $code}"
              row "$name" "FAIL" "$passed/$total" "$took" "${why:-exit $code}"; failed=1
            fi
          }
          run fresh-home "$RUNNER_TEMP/st-home-fresh"
          run spaces-unicode "$RUNNER_TEMP/st-home-unicode" "$RUNNER_TEMP/My Vault ü日本/Notes Ä é"
          # A case-sensitive APFS volume (some Macs format so): the vault and HOME on it.
          IMG="$RUNNER_TEMP/case-sensitive.dmg"; MNT="$RUNNER_TEMP/cs-volume"
          if hdiutil create -quiet -size 512m -fs "Case-sensitive APFS" -volname VCCaseSensitive "$IMG" \
             && mkdir -p "$MNT" && hdiutil attach -quiet -nobrowse -mountpoint "$MNT" "$IMG"; then
            diskutil info "$MNT" | grep -i 'personality' >> "$ST/case-sensitive.volume.txt" || true
            run case-sensitive-apfs "$MNT/Home" "$MNT/Vault"
            hdiutil detach -quiet "$MNT" || hdiutil detach -force -quiet "$MNT" || true
          else
            row case-sensitive-apfs "skipped" "-" "-" "could not make the disk image"
          fi
          {
            echo
            echo "Launch check:"
            echo '```'
            cat "$OUT/checks.txt" 2>/dev/null || echo "(no launch check)"
            echo '```'
          } >> "$SUM"
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUM"
          [ "$failed" = 0 ]

      # After the launch check, so a Finder-scripting hiccup in the DMG layout
      # never hides whether the app itself runs.
      - name: Package the .dmg (local only, uploaded nowhere)
        if: ${{ !cancelled() }}
        run: |
          npx tauri bundle --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          ls -la src-tauri/target/release/bundle/dmg/ | tee -a "$RUNNER_TEMP/mac-proof/bundles.txt"

      - name: Upload the proof (screenshot, video, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-proof
          path: ${{ runner.temp }}/mac-proof
          if-no-files-found: warn
          retention-days: 30

  # ── Phase 3: one complete updater manifest, then publish ─────────────────
  # Every build is done and its files are on the draft. Assemble a SINGLE
  # latest.json covering every platform (replacing the per-job race that kept
  # dropping a platform), check the server files are there, and only then
  # publish the draft — the moment `releases/latest` moves to this version.
  manifest:
    needs: [prepare, build_windows, build_linux, build_server]
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Download release signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sigs
          gh release download "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --pattern '*.sig' --dir sigs
          ls -1 sigs

      - name: Assemble complete latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-updater-manifest.mjs

      - name: Upload merged manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" latest.json --clobber

      - name: Check every server file is on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(gh release view "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          missing=0
          for f in latest.json server-version.json \
            vault-chat-server.mjs vault-chat-server.mjs.sha256 \
            vault-chat-server-assets.tar.gz vault-chat-server-assets.tar.gz.sha256 \
            vault-chat-deploy.tar.gz vault-chat-deploy.tar.gz.sha256; do
            if ! grep -qx "$f" <<< "$have"; then echo "missing: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Refusing to publish an incomplete release."; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false --latest

  # ── The Mac proof where anyone can read it ───────────────────────────────
  # The workflow artifact needs a GitHub login; the box's gh has none. So the
  # same proof (screenshots, launch video, checks, self-test results, the
  # summary table) is zipped and attached to this run's release as
  # mac-proof.zip, plain anonymous HTTP once the release is published:
  #   https://github.com/<repo>/releases/download/v<version>/mac-proof.zip
  # It is no installer: latest.json names only the six Windows/Linux files
  # (scripts/build-updater-manifest.mjs), the box's updater fetches named
  # server files, so neither the updater nor any Mac install ever reads it.
  # It waits for manifest so the upload lands on the published release, runs
  # whatever the Mac job did (always()), and nothing waits for it.
  mac_proof:
    needs: [prepare, build_macos, manifest]
    if: always() && needs.prepare.outputs.has_changes == 'true' && needs.build_macos.result != 'skipped'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every job stands on the tagged child (test/harness/ci-tag-only.test.ts),
      # though this one only uploads.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: macos-launch-proof
          path: mac-proof

      - name: Attach mac-proof.zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MAC_RESULT: ${{ needs.build_macos.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'version: v%s\nbuild_macos: %s\nrun: %s\n' "$VERSION" "$MAC_RESULT" "$RUN_URL" > mac-proof/job.txt
          (cd mac-proof && zip -qr ../mac-proof.zip .)
          ls -la mac-proof.zip
          gh release upload "v$VERSION" --repo "${{ github.repository }}" mac-proof.zip --clobber
          echo "mac-proof.zip: https://github.com/${{ github.repository }}/releases/download/v$VERSION/mac-proof.zip" >> "$GITHUB_STEP_SUMMARY"
          cat mac-proof/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
