name: ship

# Push-triggered shipping when source under src/**, src-tauri/** or server/**
# changes. The path filter keeps trivial commits (workflow tweaks, docs,
# scripts) from burning a build. Checks if there are any new commits on
# main since the last release tag, and if so: bumps the patch version,
# commits the three version stamps on detached HEAD and pushes ONLY its
# release tag (never main), creates a DRAFT release, builds + signs installers
# for Windows and Linux and the headless server bundle, and only then — once every asset and the
# complete updater manifest are attached — publishes the release.
#
# Why draft-first: `releases/latest` (which the desktop updater and the
# box's vault-chat-update.sh both read) must never point at a release whose
# latest.json or server bundle is not uploaded yet. A draft is invisible to
# `latest`; the immutable tag already identifies the version-only build child.
# A failed ship can leave that tag/draft, but never an incomplete latest release.
# Re-run failed build jobs against their pinned draft, or manually dispatch a
# fresh version. Tags are never forced or overwritten.
#
# Manual escape hatch: workflow_dispatch this from the Actions UI.
# (release.yml, the old tag-push workflow, is gone: it published its own
# racing latest.json.)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "server/**"
  workflow_dispatch:

# Never cancel a running ship: a second push used to cancel one after the
# bump and tag, leaving a release without latest.json. Later pushes queue
# (GitHub keeps the newest pending run) and ship together.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  # ── Phase 1: run once ─────────────────────────────────────────────────────
  # Check for new commits, generate release notes, bump the version, and
  # tag the detached version-only child. Everything downstream reads the outputs
  # of this job so the bump never fires twice.
  prepare:
    if: vars.SHIP_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      version:     ${{ steps.bump.outputs.version }}
      body:        ${{ steps.notes.outputs.body }}
      range:       ${{ steps.changes.outputs.range }}
      sha:         ${{ steps.push.outputs.sha }}
      release_id:  ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check for new commits since last release
        id: changes
        run: |
          # Tags are siblings of later accepted main, not ancestors. Consider the
          # newest stable release tag globally, not git describe's reachable tags.
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen++ { print }')
          if [ -z "$LAST_TAG" ]; then
            echo "First release — proceeding"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "range=HEAD" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
            if [ "$COUNT" -gt 0 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "$COUNT new commits since $LAST_TAG — shipping"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "range=$LAST_TAG..HEAD" >> $GITHUB_OUTPUT
            else
              echo "No new commits since $LAST_TAG — nothing to do"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate release notes
        if: steps.changes.outputs.has_changes == 'true'
        id: notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BODY=$(node scripts/release-notes.mjs "${{ steps.changes.outputs.range }}")
          echo "Release body:"
          echo "$BODY"
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Type check
        if: steps.changes.outputs.has_changes == 'true'
        run: npx tsc --noEmit

      - name: Bump version
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain)" ]
          NEW=$(node scripts/bump-version.mjs)
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped to v$NEW"

      - name: Commit version stamp and push only the release tag
        if: steps.changes.outputs.has_changes == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "v${{ steps.bump.outputs.version }} [skip ci]"
          # A single metadata-only child of the exact accepted input. Never
          # pull/rebase here: gates certified that input, not newer main.
          [ "$(git rev-parse HEAD^)" = "$GITHUB_SHA" ]
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "refs/tags/v${{ steps.bump.outputs.version }}"
          # All build jobs and the release target use the actual tagged child.
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create the draft release
        if: steps.changes.outputs.has_changes == 'true'
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          printf '%s\n' "$BODY" > release-notes.md
          ID=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$SHA" \
            -f name="vault-chat v$VERSION" -F body=@release-notes.md \
            -F draft=true -F prerelease=false --jq .id)
          echo "Draft release $ID for v$VERSION at $SHA"
          echo "id=$ID" >> $GITHUB_OUTPUT

  # ── Phase 2: build on every platform ─────────────────────────────────────
  # Runs in parallel on Windows and Ubuntu. Each platform builds its own
  # native installer and attaches it to the same GitHub release.
  # Windows builds on its native runner. tauri-action builds, signs, and
  # publishes the NSIS + MSI installers and the updater manifest.
  build_windows:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the version-bumped commit that prepare just pushed.
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      - name: Build, sign, upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one draft prepare created, by its exact id.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # No per-job manifest: the Windows and Linux jobs used to each upload
          # their own latest.json (only their platforms) and race — last write
          # won, sometimes dropping a platform and breaking its updater. The
          # `manifest` job below assembles one complete latest.json from all the
          # signatures instead. The signed `.sig` artifacts still upload here.
          includeUpdaterJson: false
          args: ''

      # Demo vault attachment — Windows job only (runs once, no duplication).
      - name: Zip demo vault
        shell: pwsh
        run: Compress-Archive -Path demo-vault -DestinationPath demo-vault.zip -Force

      - name: Attach demo vault to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.prepare.outputs.version }} demo-vault.zip --clobber

  # Linux builds INSIDE an ubuntu:26.04 container, not on the GitHub runner.
  # Why: the AppImage bundles the glib/GTK/wayland-egl stack from the build
  # host. Building on the ubuntu-24.04 runner bundled glib 2.80, which is too
  # old for modern hosts (Ubuntu 26.04 ships glib 2.88) — the host's gvfs/EGL
  # modules then fail to load into the app and it crashed at startup with
  # EGL_BAD_PARAMETER and never showed a window (#51). Building in a 26.04
  # container bundles a matching 2.88 stack, so the AppImage launches on
  # current distros and Tauri's in-app updater can keep it up to date.
  build_linux:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DEBIAN_FRONTEND: noninteractive
      # appimagetool / linuxdeploy are themselves AppImages; FUSE isn't
      # available in the container, so run them via extract-and-run.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # git is needed by actions/checkout; the rest are tauri/linuxdeploy
      # build + bundle dependencies. Runs before checkout so git exists.
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git xz-utils \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin \
            patchelf desktop-file-utils \
            xdg-utils libgdk-pixbuf2.0-bin shared-mime-info zsync

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # In the container the job runs as root over a checkout owned by another
      # uid; mark it safe so tauri-action's git calls don't bail on "dubious
      # ownership".
      - name: Mark workspace as git-safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      - name: Build, sign, upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one draft prepare created, by its exact id.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # See build_windows: the merged manifest is built by the `manifest`
          # job from the signatures, not per-platform here (which raced).
          includeUpdaterJson: false
          args: '--bundles appimage,deb --config src-tauri/tauri.linux.conf.json'

  # The headless box server (server/**). esbuild bundles it into one .mjs;
  # scripts/build-server-release.mjs adds the sha256s, the phone/PWA assets and
  # server-version.json — the files server/deploy/vault-chat-update.sh installs.
  build_server:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the server bundle
        env:
          VC_REV: ${{ needs.prepare.outputs.sha }}
        run: npm run build:server

      - name: Package the release files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REV: ${{ needs.prepare.outputs.sha }}
        run: node scripts/build-server-release.mjs

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --clobber release-server/*

  # ── Phase 3: one complete updater manifest, then publish ─────────────────
  # Every build is done and its files are on the draft. Assemble a SINGLE
  # latest.json covering every platform (replacing the per-job race that kept
  # dropping a platform), check the server files are there, and only then
  # publish the draft — the moment `releases/latest` moves to this version.
  manifest:
    needs: [prepare, build_windows, build_linux, build_server]
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Download release signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sigs
          gh release download "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --pattern '*.sig' --dir sigs
          ls -1 sigs

      - name: Assemble complete latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-updater-manifest.mjs

      - name: Upload merged manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" latest.json --clobber

      - name: Check every server file is on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(gh release view "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          missing=0
          for f in latest.json server-version.json \
            vault-chat-server.mjs vault-chat-server.mjs.sha256 \
            vault-chat-server-assets.tar.gz vault-chat-server-assets.tar.gz.sha256 \
            vault-chat-deploy.tar.gz vault-chat-deploy.tar.gz.sha256; do
            if ! grep -qx "$f" <<< "$have"; then echo "missing: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Refusing to publish an incomplete release."; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false --latest
