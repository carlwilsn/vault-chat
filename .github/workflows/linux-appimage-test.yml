name: linux-appimage-test

# Throwaway, dispatch-only workflow for iterating on the Linux AppImage.
#
# Why it exists: the AppImage built on the ubuntu-24.04 GitHub runner bundles
# a glib 2.80 / GTK / wayland-egl stack that is too old for modern hosts
# (Ubuntu 26.04 ships glib 2.88). The host's gvfs/EGL modules get loaded into
# the app process and need newer glib symbols than the bundled glib has, so
# the app crashes at startup with EGL_BAD_PARAMETER and never shows a window
# (see #51). The .deb sidesteps this by bundling nothing and using host libs.
#
# Fix under test: build the AppImage inside a *newer* Ubuntu container so the
# bundled glib/GTK/wayland-egl stack matches a modern host. We pick the
# container image via input so we can retry different bases without editing.
#
# This workflow only uploads the AppImage as a build artifact — it never cuts
# a release or bumps the version. Once a base image produces an AppImage that
# launches cleanly, the recipe gets folded into ship.yml.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Ubuntu container image to build the AppImage in"
        default: "ubuntu:26.04"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.base_image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # appimagetool / linuxdeploy are themselves AppImages; FUSE isn't
      # available inside the container, so run them via extract-and-run.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Show base image
        run: |
          . /etc/os-release
          echo "Building in: $PRETTY_NAME"
          echo "glib: $(dpkg-query -W -f='${Version}' libglib2.0-0t64 2>/dev/null || echo n/a)"

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git xz-utils \
            build-essential pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin \
            patchelf desktop-file-utils \
            xdg-utils libgdk-pixbuf2.0-bin shared-mime-info zsync

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Download Tectonic LaTeX engine
        run: node scripts/download-tectonic.mjs

      - name: Build AppImage
        run: npx tauri build --bundles appimage --config src-tauri/tauri.linux.conf.json

      - name: Locate AppImage + report bundled glib
        run: |
          set -e
          APP=$(find src-tauri/target -name '*.AppImage' | head -1)
          echo "Built: $APP"
          ls -la "$APP"
          echo "--- bundled glib in the produced AppImage ---"
          ./"$APP" --appimage-extract 'usr/lib/**/libgio*' >/dev/null 2>&1 || true
          find squashfs-root -name 'libgio-2.0.so.0.*' -printf '%f\n' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: vault-chat-appimage
          path: src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error
