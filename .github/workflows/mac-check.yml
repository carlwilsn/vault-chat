name: mac-check

# The Mac check: build the .app/.dmg on a real Mac, prove it launches with its
# native window buttons, self-test it (fresh HOME, path hazards, sign-in), run
# the recorded tour, and attach the proof to the release as mac-proof.zip.
# The check itself publishes NOTHING to Mac users (no installer upload, no
# darwin entry in latest.json, no signing keys: createUpdaterArtifacts is off).
# It packs the very .app it tests into an updater .app.tar.gz; only when EVERY
# step passed on Apple Silicon does mac_publish (Linux, the updater key) sign it
# and attach it, the .dmg and, last, mac-update.json to the release: the Mac
# friend channel's only source. Nobody's updater reads that file where it lies:
# the Mac app reads latest-mac.json on the mac-stable release, which only a
# promotion writes (the box, server/macFriend.ts, then mac-promote.yml).
#
# ship.yml calls it for every release (build_macos, runner macos-15 = arm64);
# nothing in ship.yml waits for it, so Windows/Linux ship exactly as before.
# GitHub sometimes has no macOS arm64 runner to give (v0.9.57 and v0.9.58: the
# job was cancelled after 15 min, "not acquired by Runner of type hosted");
# mac_proof then dispatches this workflow again for the same tag on
# macos-15-intel (x86_64), whose proof replaces the first. It can be
# dispatched by hand too (tag + runner), and it runs by itself, on the latest
# release, when this file changes on main (so a change to the check is proven
# without waiting for the next release).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mac-check.yml"
  workflow_call:
    inputs:
      sha:
        description: The tagged release child to build
        type: string
        required: true
      version:
        description: The release version, without the v
        type: string
        required: true
      runner:
        description: The macOS runner label
        type: string
        default: macos-15
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check (e.g. v0.9.58)
        type: string
        required: true
      runner:
        description: The macOS runner label
        type: choice
        options: [macos-15-intel, macos-15, macos-14]
        default: macos-15-intel

permissions:
  contents: read

jobs:
  # What to check, whichever way this started: the ship run's tagged child, a
  # dispatched tag, or (a push of this file) the latest release.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      version: ${{ steps.p.outputs.version }}
      runner: ${{ steps.p.outputs.runner }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          RUNNER: ${{ inputs.runner }}
        run: |
          if [ -z "$SHA$TAG" ]; then TAG=$(gh api "repos/$REPO/releases/latest" --jq .tag_name); fi
          VERSION=${VERSION:-${TAG#v}}
          {
            echo "ref=${SHA:-$TAG}"
            echo "version=$VERSION"
            echo "runner=${RUNNER:-macos-15}"
          } >> "$GITHUB_OUTPUT"
          echo "checking v$VERSION (${SHA:-$TAG}) on ${RUNNER:-macos-15}"

  # Every long step has its own timeout-minutes, so a hung step FAILS (and the
  # steps after it, the status and the upload, still run) instead of the job
  # timing out with nothing said; status.txt in the proof names each step's
  # outcome and the runner and arch it ran on.
  build_macos:
    needs: pick
    continue-on-error: true
    timeout-minutes: 150
    permissions:
      contents: read
    runs-on: ${{ needs.pick.outputs.runner }}
    # A job-level continue-on-error makes a failed Mac job look successful to
    # `needs`, so mac_publish reads these: `passed` is set by the last step,
    # which runs only when every step before it passed.
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
      bundle: ${{ steps.pack_update.outputs.bundle }}
      arch: ${{ steps.pack_update.outputs.arch }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pick.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - id: npm_ci
        run: npm ci
        timeout-minutes: 15

      - name: Download Tectonic LaTeX engine
        id: tectonic
        run: node scripts/download-tectonic.mjs
        timeout-minutes: 10

      - name: Download the Node runtime the app carries
        id: node_runtime
        run: node scripts/download-node.mjs
        timeout-minutes: 10

      - name: Pack the server the app carries
        id: pack_server
        run: node scripts/pack-server-into-app.mjs
        timeout-minutes: 10

      # src-tauri/tauri.macos.conf.json is merged in by itself (native traffic
      # lights over the app's own title bar, ad-hoc signature). No updater
      # artifacts, so no signing key is read.
      - name: Build the .app (local only, uploaded nowhere)
        id: build_app
        timeout-minutes: 60
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The updater bundle is the .app the checks below run, packed before they
      # run: what the friend gets is byte for byte what passed. The same file is
      # also the curl install (curl does not quarantine, reports/11-mac 5).
      - name: Pack the updater bundle (.app.tar.gz, handed on only if every check passes)
        id: pack_update
        timeout-minutes: 10
        shell: bash
        run: |
          set -eu
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          VERSION=$(node -p 'require("./package.json").version')
          ARCH=$( [ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64 )
          NAME="vault-chat_${VERSION}_${ARCH}.app.tar.gz"
          mkdir -p "$RUNNER_TEMP/mac-update"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/mac-update/$NAME" -C "$(dirname "$APP")" "$(basename "$APP")"
          echo "$ARCH" > "$RUNNER_TEMP/mac-update/arch.txt"
          ls -la "$RUNNER_TEMP/mac-update"
          { echo "bundle=$NAME"; echo "arch=$ARCH"; } >> "$GITHUB_OUTPUT"

      # A runner's screen is 1024x768 at 1x by default: the app's 1400x900
      # window gets squeezed onto a tiny old monitor. Ask for a MacBook-like
      # display (HiDPI ~1440x900, else the closest mode the app fits on) with
      # displayplacer (scripts/macos-pick-display-mode.py picks from what the
      # virtual display offers). Best effort: whatever it ends up as is in
      # display.txt and checks.txt, and nothing here fails the job.
      - name: Give the runner a realistic display
        id: display
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/mac-proof"; mkdir -p "$OUT"; D="$OUT/display.txt"
          { echo "## before"; system_profiler SPDisplaysDataType; } > "$D" 2>&1
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install jakehilborn/jakehilborn/displayplacer >> "$OUT/display-brew.log" 2>&1
          if command -v displayplacer > /dev/null; then
            displayplacer list > "$OUT/displayplacer-list.txt" 2>&1
            ARG=$(python3 scripts/macos-pick-display-mode.py < "$OUT/displayplacer-list.txt")
            echo "## displayplacer ${ARG:-(no better mode offered)}" >> "$D"
            [ -n "$ARG" ] && displayplacer "$ARG" >> "$D" 2>&1
            sleep 3
          else
            echo "## displayplacer could not be installed (display-brew.log)" >> "$D"
          fi
          { echo "## after"; system_profiler SPDisplaysDataType; } >> "$D" 2>&1
          RES=$(system_profiler SPDisplaysDataType 2>/dev/null | sed -n 's/^ *Resolution: *//p' | head -1)
          LOOKS=$(system_profiler SPDisplaysDataType 2>/dev/null | sed -n 's/^ *UI Looks like: *//p' | head -1)
          echo "display: ${RES:-unknown}${LOOKS:+, looks like $LOOKS}${ARG:+ (set: $ARG)}${ARG:- (could not be changed: no better mode offered or no displayplacer)}" | tee "$OUT/display-final.txt"

      - name: Launch it with a fresh HOME and check its window
        id: launch
        timeout-minutes: 6
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/mac-proof"; mkdir -p "$OUT"
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          ls -la "$APP" | tee "$OUT/bundles.txt"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          codesign -dv "$APP" >> "$OUT/bundles.txt" 2>&1 || true
          sw_vers > "$OUT/system.txt"; uname -m >> "$OUT/system.txt"
          REAL_HOME="$HOME"
          FRESH="$RUNNER_TEMP/fresh-home"; mkdir -p "$FRESH"
          # The launch on video (best effort: a recording failure is noted, not fatal).
          screencapture -v -V 25 -x "$OUT/launch.mov" > "$OUT/video.log" 2>&1 &
          REC=$!
          ( sleep 45; kill "$REC" 2>/dev/null ) &   # never let the recorder hold the job
          sleep 2
          HOME="$FRESH" "$APP/Contents/MacOS/$EXE" > "$OUT/app.log" 2>&1 &
          PID=$!
          echo "launched $EXE pid $PID"
          ax() { osascript -e "tell application \"System Events\" to tell (first process whose unix id is $PID) to $1" 2>>"$OUT/osascript.log"; }
          n=0
          for i in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || { echo "::error::the app exited during launch"; break; }
            n=$(ax "count windows" || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 1
          done
          echo "windows: $n after ${i}s" | tee "$OUT/checks.txt"
          cat "$OUT/display-final.txt" 2>/dev/null | tee -a "$OUT/checks.txt" || echo "display: not set (see display.txt)" | tee -a "$OUT/checks.txt"
          sleep 8   # let the first screen paint
          screencapture -x "$OUT/screen.png" || true
          BOUNDS=$(ax 'get {position, size} of window 1' || true)   # "x, y, w, h"
          echo "window bounds: $BOUNDS" | tee -a "$OUT/checks.txt"
          [ -n "$BOUNDS" ] && screencapture -x -R"$(echo "$BOUNDS" | tr -d ' ')" "$OUT/window.png" || true
          BUTTONS=$(ax 'get subrole of buttons of window 1' || true)
          echo "window buttons: $BUTTONS" | tee -a "$OUT/checks.txt"
          wait "$REC" 2>/dev/null || true
          ok=1
          [ "${n:-0}" -gt 0 ] || { echo "::error::no window"; ok=0; }
          grep -q AXCloseButton <<<"$BUTTONS" || { echo "::error::no close button"; ok=0; }
          grep -q AXMinimizeButton <<<"$BUTTONS" || { echo "::error::no minimize button"; ok=0; }
          grep -Eq 'AXZoomButton|AXFullScreenButton' <<<"$BUTTONS" || { echo "::error::no zoom button"; ok=0; }
          kill -0 "$PID" 2>/dev/null || { echo "::error::the app is not running after launch"; ok=0; }
          # A blank capture compresses to almost nothing.
          size=$(stat -f %z "$OUT/screen.png" 2>/dev/null || echo 0)
          echo "screenshot bytes: $size" | tee -a "$OUT/checks.txt"
          [ "$size" -gt 20000 ] || { echo "::error::the screenshot is blank or missing"; ok=0; }
          [ -s "$OUT/launch.mov" ] && echo "video: ok" >> "$OUT/checks.txt" || echo "video: not recorded (see video.log)" >> "$OUT/checks.txt"
          # The traffic lights' vertical centre against the title bar's (scripts/macos-traffic-lights.py):
          # off by more than 1 px fails, with the measured rows in checks.txt.
          if [ -s "$OUT/window.png" ]; then
            python3 scripts/macos-traffic-lights.py "$OUT/window.png" 1 | tee -a "$OUT/checks.txt"
            [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::the traffic lights are not centred on the title bar"; ok=0; }
          else
            echo "traffic lights: FAIL (no window.png)" | tee -a "$OUT/checks.txt"; ok=0
          fi
          kill "$PID" 2>/dev/null || true; sleep 2
          # What the app wrote under the fresh HOME, and any crash report.
          mkdir -p "$OUT/home"
          find "$FRESH" -maxdepth 6 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' \) -size -5M -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'mkdir -p "$1/home/$(dirname "${2#$3/}")" && cp "$2" "$1/home/${2#$3/}"' _ "$OUT" {} "$FRESH" || true
          find "$FRESH" -maxdepth 5 > "$OUT/home-tree.txt" 2>/dev/null || true
          cp "$REAL_HOME"/Library/Logs/DiagnosticReports/*"$EXE"* "$OUT/" 2>/dev/null || true
          cat "$OUT/checks.txt"
          [ "$ok" = 1 ]

      # The built app drives itself (VC_SELFTEST, src-tauri/src/self_test.rs) with
      # test/selftest/smoke.json: its own local server answers, a note is made,
      # typed into and saved. Once on a fresh HOME as Carl's friend would start,
      # then with the path hazards a Mac brings: a vault path with spaces and
      # non-ASCII letters, and a case-sensitive APFS volume. Each variant's
      # results JSON, app log and a screenshot go into the proof; the table goes
      # to the job's summary. Any variant failing fails this job (and only this
      # job: continue-on-error, in nobody's needs but mac_proof).
      - name: Self-test the app (fresh HOME, path hazards)
        id: selftest
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        shell: bash
        run: |
          set +e -u   # every variant runs; the table says which failed
          OUT="$RUNNER_TEMP/mac-proof"; ST="$OUT/selftest"; mkdir -p "$ST"
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          pkill -9 -x "$EXE" 2>/dev/null; sleep 1   # nothing left from the launch check
          SMOKE="$GITHUB_WORKSPACE/test/selftest/smoke.json"
          SUM="$OUT/summary.md"
          {
            echo "## macOS self-test ($(sw_vers -productVersion), $(uname -m))"
            echo
            echo "| variant | result | steps | took | first failure |"
            echo "|---|---|---|---|---|"
          } > "$SUM"
          failed=0
          row() { echo "| $1 | $2 | $3 | $4 | $5 |" >> "$SUM"; }
          # run <name> <home> [vault]: one launch in self-test mode, its row in the table.
          # STEPS=<file> runs another steps file than the smoke; FAKE_CLAUDE=<script> puts a stand-in
          # `claude` in that HOME's ~/.local/bin (test/selftest/fake-claude*).
          run() {
            local name=$1 home=$2 vault=${3:-} steps res code pid guard t0 src=${STEPS:-$SMOKE}
            steps="$ST/$name.steps.json"; res="$ST/$name.result.json"
            rm -rf "$home"; mkdir -p "$home"
            if [ -n "${FAKE_CLAUDE:-}" ]; then mkdir -p "$home/.local/bin" && cp "$FAKE_CLAUDE" "$home/.local/bin/claude"; fi
            if [ -n "$vault" ]; then jq --arg v "$vault" '{vault: $v} + .' "$src" > "$steps"; else cp "$src" "$steps"; fi
            echo "::group::self-test $name (vault: ${vault:-a fresh temp dir})"
            t0=$(date +%s)
            # ANTHROPIC_BASE_URL: nowhere, so no server check ever sends a fake token to the real API.
            HOME="$home" VC_SELFTEST="$steps" VC_SELFTEST_OUT="$res" VC_SELFTEST_TIMEOUT=420 ANTHROPIC_BASE_URL=http://127.0.0.1:9 \
              "$APP/Contents/MacOS/$EXE" > "$ST/$name.app.log" 2>&1 &
            pid=$!
            # The fresh-HOME run on video (selftest.mov in the proof): the note made, typed into, saved.
            local rec=""
            if [ "$name" = fresh-home ]; then
              # A fixed length that ends by itself, as launch.mov does: a recording stopped by a signal
              # left no file on the runner.
              screencapture -v -V 60 -x "$OUT/selftest.mov" > "$OUT/selftest-video.log" 2>&1 &
              rec=$!
            fi
            # (Detached from the step's output, so a leftover sleep never holds the log open.)
            ( sleep 480; kill -9 "$pid" ) > /dev/null 2>&1 & guard=$!   # the app's own timeout is 420 s
            ( sleep 25; kill -0 "$pid" && screencapture -x "$ST/$name.png" ) > /dev/null 2>&1 &
            wait "$pid"; code=$?
            kill "$guard" 2>/dev/null || true
            if [ -n "$rec" ]; then
              for _ in $(seq 1 75); do kill -0 "$rec" 2>/dev/null || break; sleep 1; done   # its 60 s, then it writes
              kill -9 "$rec" 2>/dev/null || true
              [ -s "$OUT/selftest.mov" ] || echo "::warning::no selftest.mov (see selftest-video.log)"
            fi
            local took="$(( $(date +%s) - t0 )) s"
            # What the app and its local server wrote under that HOME.
            find "$home" -maxdepth 7 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' \) -size -5M -print0 2>/dev/null \
              | xargs -0 -I{} sh -c 'mkdir -p "$1/$(dirname "${2#$3/}")" && cp "$2" "$1/${2#$3/}"' _ "$ST/$name-home" {} "$home" || true
            tail -n 40 "$ST/$name.app.log" || true
            echo "::endgroup::"
            if [ ! -s "$res" ]; then
              echo "::error::self-test $name: no results file (exit $code)"
              row "$name" "FAIL" "-" "$took" "no results file, exit $code"; failed=1; return
            fi
            local ok passed total why
            ok=$(jq -r '.ok' "$res")
            passed=$(jq '[.steps[] | select(.ok)] | length' "$res")
            total=$(jq '.steps | length' "$steps")
            why=$(jq -r '(.error // "") as $e | ([.steps[] | select(.ok | not)][0]) as $s
                         | if $s then "step \($s.i) \($s.action): \($s.error // "")" else $e end' "$res" \
                  | tr '\n|' '  ' | cut -c1-240)
            if [ "$ok" = true ] && [ "$code" = 0 ]; then
              row "$name" "pass" "$passed/$total" "$took" ""
            else
              echo "::error::self-test $name failed: ${why:-exit $code}"
              row "$name" "FAIL" "$passed/$total" "$took" "${why:-exit $code}"; failed=1
            fi
          }
          run fresh-home "$RUNNER_TEMP/st-home-fresh"
          run spaces-unicode "$RUNNER_TEMP/st-home-unicode" "$RUNNER_TEMP/My Vault ü日本/Notes Ä é"
          # A case-sensitive APFS volume (some Macs format so): the vault and HOME on it.
          IMG="$RUNNER_TEMP/case-sensitive.dmg"; MNT="$RUNNER_TEMP/cs-volume"
          if hdiutil create -quiet -size 512m -fs "Case-sensitive APFS" -volname VCCaseSensitive "$IMG" \
             && mkdir -p "$MNT" && hdiutil attach -quiet -nobrowse -mountpoint "$MNT" "$IMG"; then
            diskutil info "$MNT" | grep -i 'personality' >> "$ST/case-sensitive.volume.txt" || true
            run case-sensitive-apfs "$MNT/Home" "$MNT/Vault"
            hdiutil detach -quiet "$MNT" || hdiutil detach -force -quiet "$MNT" || true
          else
            row case-sensitive-apfs "skipped" "-" "-" "could not make the disk image"
          fi
          # The status file an installing agent reads, then the one-click Claude sign-in with a fake
          # `claude` that prints a fake token (a real sign-in needs a human's Authorize click, so CI
          # cannot run one): signed in, the token in the key store, never in the results or logs.
          STEPS="$GITHUB_WORKSPACE/test/selftest/status.json" run status "$RUNNER_TEMP/st-home-status"
          STEPS="$GITHUB_WORKSPACE/test/selftest/signin.json" FAKE_CLAUDE="$GITHUB_WORKSPACE/test/selftest/fake-claude" \
            run signin "$RUNNER_TEMP/st-home-signin"
          STEPS="$GITHUB_WORKSPACE/test/selftest/signin-refused.json" FAKE_CLAUDE="$GITHUB_WORKSPACE/test/selftest/fake-claude-refused" \
            run signin-refused "$RUNNER_TEMP/st-home-refused"
          if grep -rl "SELFTEST-fake-token" "$ST" > "$ST/token-leaks.txt" 2>/dev/null; then
            echo "::error::the fake sign-in token appeared in: $(tr '\n' ' ' < "$ST/token-leaks.txt")"
            row "token never in results/logs" "FAIL" "-" "-" "$(head -3 "$ST/token-leaks.txt" | tr '\n' ' ')"; failed=1
          else
            row "token never in results/logs" "pass" "-" "-" ""
          fi
          {
            echo
            echo "Launch check:"
            echo '```'
            cat "$OUT/checks.txt" 2>/dev/null || echo "(no launch check)"
            echo '```'
          } >> "$SUM"
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUM"
          [ "$failed" = 0 ]

      # The full tour, recorded (tour.mov in the proof): test/selftest/tour.json
      # drives every surface with the platform's keys (Mod = Cmd here, so these
      # are the Cmd shortcuts): file tree create / rename / delete, Cmd+L ask,
      # Cmd+K edit, two files split side by side, a PDF and a marquee box, a chat
      # message and its streamed reply, full-screen chat in and out, the pop-out
      # window opened and closed, Settings. The model is a local fake
      # (test/selftest/fake-anthropic.mjs) behind the real Claude Code CLI, so no
      # account or key. Per-step results: tour/result.json and tour/steps.md.
      - name: Self-test tour, recorded
        id: tour
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          set +e -u
          OUT="$RUNNER_TEMP/mac-proof"; T="$OUT/tour"; mkdir -p "$T"
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          pkill -9 -x "$EXE" 2>/dev/null; sleep 1
          HOME_T="$RUNNER_TEMP/tour-home"; VAULT="$RUNNER_TEMP/Tour Vault"
          rm -rf "$HOME_T" "$VAULT"; mkdir -p "$HOME_T"; cp -R test/selftest/tour-vault "$VAULT"
          jq --arg v "$VAULT" '{vault: $v} + .' test/selftest/tour.json > "$T/steps.json"
          CLI="$GITHUB_WORKSPACE/node_modules/@anthropic-ai/claude-agent-sdk-darwin-$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64 )/claude"
          "$CLI" --version > "$T/claude-version.txt" 2>&1 || echo "::warning::the Claude Code CLI did not run: $(cat "$T/claude-version.txt")"
          node test/selftest/fake-anthropic.mjs 18765 "$T/fake-api.log" > "$T/fake-api.out" 2>&1 & FAKE=$!
          sleep 1
          screencapture -v -V 900 -x "$OUT/tour.mov" > "$T/video.log" 2>&1 & REC=$!
          sleep 2
          t0=$(date +%s)
          HOME="$HOME_T" VC_SELFTEST="$T/steps.json" VC_SELFTEST_OUT="$T/result.json" VC_SELFTEST_TIMEOUT=840 \
            ANTHROPIC_BASE_URL=http://127.0.0.1:18765 ANTHROPIC_API_KEY=sk-ant-not-a-real-key VC_CLAUDE_BIN="$CLI" \
            VC_TITLE_MODEL=off VC_AUTO_TITLE=off \
            "$APP/Contents/MacOS/$EXE" > "$T/app.log" 2>&1 & PID=$!
          ( sleep 900; kill -9 "$PID" ) > /dev/null 2>&1 & GUARD=$!
          wait "$PID"; code=$?
          kill "$GUARD" 2>/dev/null
          sleep 2; kill -INT "$REC" 2>/dev/null
          for _ in $(seq 1 30); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          kill -9 "$REC" "$FAKE" 2>/dev/null
          took=$(( $(date +%s) - t0 ))
          find "$HOME_T" -maxdepth 7 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.json' \) -size -5M -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'mkdir -p "$1/$(dirname "${2#$3/}")" && cp "$2" "$1/${2#$3/}"' _ "$T/home" {} "$HOME_T" || true
          ls -la "$OUT/tour.mov" >> "$T/video.log" 2>&1
          {
            echo
            echo "## Recorded tour (tour.mov, ${took} s, exit $code)"
            echo
            echo "| # | step | result | ms | note |"
            echo "|---|---|---|---|---|"
            if [ -s "$T/result.json" ]; then
              jq -r '.steps[] | "| \(.i) | \(.action) | \(if .ok then "pass" else "FAIL" end) | \(.ms) | \((.error // .note // "") | gsub("[|\\n]"; " ") | .[0:120]) |"' "$T/result.json"
              jq -r 'if .error then "\nerror: \(.error)" else "" end' "$T/result.json"
            else
              echo "| - | no results file | FAIL | - | exit $code |"
              echo
              echo "Last steps the app logged:"
              echo '```'
              grep '^\[selftest\]' "$T/app.log" | tail -n 8
              echo '```'
            fi
          } > "$T/steps.md"
          cat "$T/steps.md" | tee -a "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 "$T/app.log"
          [ -s "$T/result.json" ] && [ "$(jq -r .ok "$T/result.json")" = true ] && [ "$code" = 0 ] \
            || { echo "::error::the recorded tour failed (see tour/steps.md)"; exit 1; }

      # After the launch check, so a Finder-scripting hiccup in the DMG layout
      # never hides whether the app itself runs.
      - name: Package the .dmg (local only, uploaded nowhere)
        id: dmg
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          npx tauri bundle --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          ls -la src-tauri/target/release/bundle/dmg/ | tee -a "$RUNNER_TEMP/mac-proof/bundles.txt"

      # What each step did, in the proof itself: a failed or timed-out step is
      # named here even when its own files never got written.
      - name: Write status.txt (every step's outcome)
        if: always()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RUNNER_LABEL: ${{ needs.pick.outputs.runner }}
        run: |
          OUT="$RUNNER_TEMP/mac-proof"; mkdir -p "$OUT"
          {
            echo "build_macos on runner label $RUNNER_LABEL ($RUNNER_NAME), macOS $(sw_vers -productVersion 2>/dev/null), arch $(uname -m)"
            echo "$STEPS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.outcome)"'
          } > "$OUT/status.txt"
          cat "$OUT/status.txt"

      - name: Upload the proof (screenshot, video, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-proof
          path: ${{ runner.temp }}/mac-proof
          if-no-files-found: warn
          retention-days: 30

      # Only past every check (success(): no step before failed or timed out).
      - name: Hand on the passing updater bundle and .dmg
        if: success()
        shell: bash
        run: cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/mac-update/"

      - name: Upload the passing Mac update
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-update
          path: ${{ runner.temp }}/mac-update
          if-no-files-found: error
          retention-days: 30

      - name: Every Mac check passed
        id: passed
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  # The proof where anyone can read it: the workflow artifact needs a GitHub
  # login, so the same files are zipped and attached to the release as
  # mac-proof.zip (plain anonymous HTTP once the release is published):
  #   https://github.com/<repo>/releases/download/v<version>/mac-proof.zip
  # No installer: latest.json names only the Windows/Linux files
  # (scripts/build-updater-manifest.mjs). It runs whatever the Mac job did,
  # with or without its artifact (job.txt/status.txt then say what GitHub saw).
  mac_proof:
    needs: [pick, build_macos]
    if: always() && needs.pick.result == 'success'
    continue-on-error: true
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      # The tagged child, like every job (test/harness/ci-tag-only.test.ts),
      # though this one only uploads.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pick.outputs.ref }}

      # A Mac job that failed early, timed out or never got a runner uploads
      # nothing (or part): the zip is still made, with status.txt saying why.
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: macos-launch-proof
          path: mac-proof

      - name: Attach mac-proof.zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pick.outputs.version }}
          RUNNER_LABEL: ${{ needs.pick.outputs.runner }}
          MAC_RESULT: ${{ needs.build_macos.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p mac-proof
          printf 'version: v%s\nrunner label: %s\nbuild_macos: %s\nrun: %s (attempt %s)\nartifact: %s\n' "$VERSION" "$RUNNER_LABEL" "$MAC_RESULT" "$RUN_URL" "$RUN_ATTEMPT" "$DOWNLOAD" > mac-proof/job.txt
          # The Mac job as GitHub saw it: runner, steps, annotations (e.g. "not acquired by Runner").
          JOB=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=50" \
                  --jq '[.jobs[] | select(.name | test("(^|/ )build_macos$"))][0]' 2>>mac-proof/job.txt || true)
          {
            echo
            echo "## build_macos (from the GitHub API)"
            if [ -n "$JOB" ] && [ "$JOB" != null ]; then
              jq -r '"conclusion: \(.conclusion)\nrunner: \(if (.runner_name // "") == "" then "NONE (GitHub never gave this job a macOS runner)" else .runner_name end)\nstarted \(.started_at), completed \(.completed_at)\nsteps:" , (.steps[]? | "  \(.number) \(.name): \(.conclusion)")' <<<"$JOB"
              gh api "repos/$REPO/check-runs/$(jq -r .id <<<"$JOB")/annotations" --jq '.[] | "annotation (\(.annotation_level)): \(.message)"' 2>&1 || true
            else
              echo "(could not read the job)"
            fi
            [ "$DOWNLOAD" = success ] || echo "no proof artifact was uploaded: the zip holds only what is said here"
          } >> mac-proof/job.txt
          # status.txt is the Mac job's own step list; without it, this says what happened.
          [ -s mac-proof/status.txt ] || cp mac-proof/job.txt mac-proof/status.txt
          cat mac-proof/job.txt
          # The release is a draft until the ship run's manifest job publishes it:
          # upload once it is (a draft has no tag URL; the API's tag lookup skips drafts).
          for _ in $(seq 1 60); do
            gh api "repos/$REPO/releases/tags/v$VERSION" --jq .id > /dev/null 2>&1 && break
            sleep 60
          done
          (cd mac-proof && zip -qr ../mac-proof.zip .)
          ls -la mac-proof.zip
          gh release upload "v$VERSION" --repo "${{ github.repository }}" mac-proof.zip --clobber
          echo "mac-proof.zip: https://github.com/${{ github.repository }}/releases/download/v$VERSION/mac-proof.zip" >> "$GITHUB_STEP_SUMMARY"
          cat mac-proof/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # No macOS arm64 runner (GitHub capacity: v0.9.57 and v0.9.58's Mac jobs
      # were cancelled as "not acquired by Runner of type hosted"): run this
      # same check again on an Intel Mac, for the same tag; its mac-proof.zip
      # replaces this one and says which runner and arch it ran on.
      - name: No runner? Run the Mac check on Intel instead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.pick.outputs.version }}
          RUNNER_LABEL: ${{ needs.pick.outputs.runner }}
          FALLBACK: macos-15-intel
        run: |
          if grep -q "^runner: NONE" mac-proof/job.txt && [ "$RUNNER_LABEL" != "$FALLBACK" ]; then
            echo "No $RUNNER_LABEL runner: dispatching mac-check on $FALLBACK for v$VERSION"
            gh workflow run mac-check.yml --repo "$REPO" --ref main -f tag="v$VERSION" -f runner="$FALLBACK"
            echo "No $RUNNER_LABEL runner: the Mac check runs again on $FALLBACK (mac-check workflow)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The Mac job had a runner (or this was already $FALLBACK): nothing to re-run."
          fi

  # The Mac update, only from a Mac job that passed every check on Apple
  # Silicon (an Intel fallback run proves the code but publishes nothing: the
  # friend manifest names one arch, and a Mac whose arch it lacks would fail
  # its update check). Signs the tested .app.tar.gz with the same updater key as
  # Windows/Linux (`tauri signer sign`; the key never reaches the Mac runner;
  # ship.yml passes secrets to this workflow) and attaches it, its .sig, the
  # .dmg and LAST mac-update.json (scripts/build-mac-manifest.mjs) to the
  # published release. That file's presence is what "this version passed the
  # Mac checks" means to the box (server/macFriend.ts).
  mac_publish:
    needs: [pick, build_macos]
    if: needs.build_macos.outputs.passed == 'true' && needs.build_macos.outputs.arch == 'aarch64'
    continue-on-error: true
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pick.outputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: macos-update
          path: mac-update

      - name: Sign the updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLE: ${{ needs.build_macos.outputs.bundle }}
        run: |
          test -s "mac-update/$BUNDLE"
          npx tauri signer sign "mac-update/$BUNDLE"
          test -s "mac-update/$BUNDLE.sig"

      - name: Write mac-update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.pick.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIR: mac-update
        run: |
          # The release is a draft until the ship run's manifest job publishes it.
          for _ in $(seq 1 60); do
            gh api "repos/$REPO/releases/tags/v$VERSION" --jq .id > /dev/null 2>&1 && break
            sleep 60
          done
          NOTES=$(gh api "repos/$REPO/releases/tags/v$VERSION" --jq .body) node scripts/build-mac-manifest.mjs

      - name: Attach the Mac files, mac-update.json last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pick.outputs.version }}
          BUNDLE: ${{ needs.build_macos.outputs.bundle }}
        run: |
          gh release upload "v$VERSION" --repo "${{ github.repository }}" --clobber "mac-update/$BUNDLE" "mac-update/$BUNDLE.sig" mac-update/*.dmg
          gh release upload "v$VERSION" --repo "${{ github.repository }}" --clobber mac-update/mac-update.json
