<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annual revenue dashboard</title>

  <!-- Tailwind CDN: lets us use utility classes without a build step. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM (production builds) and Babel for JSX. All via CDN
       so this single file is fully self-contained — no node_modules,
       no bundler, no transpile step. Just open it. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Match vault-chat's actual editor background so this blends with the
       app chrome. The CSS theme variable resolves to hsl(0 0% 10%). */
    html, body { background: #1a1a1a; color: #ebebeb; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    /* Hide the page until React mounts so we don't flash unstyled CDN-Tailwind. */
    #root:empty + .boot-hint { display: block; }
    .boot-hint { display: none; color: #666; font-size: 12px; padding: 24px; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="root"></div>
  <noscript class="boot-hint">This page needs JavaScript.</noscript>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    const DATA = [
      { year: 2021, revenue: 1.2 },
      { year: 2022, revenue: 1.8 },
      { year: 2023, revenue: 2.4 },
      { year: 2024, revenue: 4.1 },
    ];

    function yoy(arr) {
      return arr.map((d, i) =>
        i === 0 ? null : (d.revenue / arr[i - 1].revenue - 1) * 100,
      );
    }

    function App() {
      const [hover, setHover] = useState(null);
      const growth = yoy(DATA);
      const latest = DATA[DATA.length - 1];
      const latestYoY = growth[growth.length - 1];
      const cagr =
        (Math.pow(latest.revenue / DATA[0].revenue, 1 / (DATA.length - 1)) - 1) *
        100;
      const total = DATA.reduce((a, b) => a + b.revenue, 0);

      return (
        <div className="min-h-screen px-8 py-12">
          <div className="max-w-4xl mx-auto">
            <header className="mb-10">
              <div className="text-xs uppercase tracking-[0.2em] text-zinc-500 mb-2">
                Sample dashboard
              </div>
              <h1 className="text-3xl font-semibold text-zinc-100 tracking-tight">
                Annual revenue, 2021&ndash;2024
              </h1>
              <p className="text-sm text-zinc-500 mt-2">
                Same dataset as <span className="font-mono text-zinc-400">sample.pdf</span>, but
                rendered live by React + Tailwind via CDN. Dark theme matches
                the editor &mdash; this file is sitting inside vault-chat&apos;s HTML view.
              </p>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
              <Kpi
                label="2024 revenue"
                value={`$${latest.revenue.toFixed(1)}M`}
                sub="vs $2.4M in 2023"
              />
              <Kpi
                label="YoY growth"
                value={`+${latestYoY.toFixed(0)}%`}
                sub="vs +33% prior year"
                accent
              />
              <Kpi
                label="3-yr CAGR"
                value={`+${cagr.toFixed(0)}%`}
                sub={`Cumulative: $${total.toFixed(1)}M`}
              />
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/40 p-6">
              <div className="flex items-baseline justify-between mb-4">
                <h2 className="text-sm font-semibold text-zinc-300 uppercase tracking-wider">
                  Revenue by year
                </h2>
                <div className="text-xs text-zinc-500">$ millions</div>
              </div>
              <BarChart
                data={DATA}
                growth={growth}
                hover={hover}
                setHover={setHover}
              />
            </div>

            <p className="text-xs text-zinc-500 mt-6 italic leading-relaxed">
              Tip: enable the marquee (top-right of the editor pane &mdash; the
              dashed-rectangle icon) and drag a box around any region of this
              dashboard. The model receives the rendered pixels, exactly like
              the PDF marquee. Try boxing the chart and asking{" "}
              <span className="font-mono text-zinc-400 not-italic">
                what&apos;s the trend?
              </span>
            </p>
          </div>
        </div>
      );
    }

    function Kpi({ label, value, sub, accent }) {
      return (
        <div
          className={
            "rounded-xl border bg-zinc-900/40 p-5 transition " +
            (accent
              ? "border-indigo-500/30 ring-1 ring-indigo-500/10"
              : "border-zinc-800")
          }
        >
          <div className="text-[11px] uppercase tracking-[0.15em] text-zinc-500">
            {label}
          </div>
          <div
            className={
              "text-3xl font-semibold mt-2 tracking-tight " +
              (accent ? "text-indigo-300" : "text-zinc-100")
            }
          >
            {value}
          </div>
          <div className="text-xs text-zinc-500 mt-1">{sub}</div>
        </div>
      );
    }

    function BarChart({ data, growth, hover, setHover }) {
      const W = 640;
      const H = 260;
      const padX = 44;
      const padTop = 16;
      const padBottom = 36;
      const max = 5;
      const slot = (W - 2 * padX) / data.length;
      const barW = slot * 0.55;
      const plotH = H - padTop - padBottom;

      const yFor = (v) => padTop + plotH - (plotH * v) / max;

      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
          {[0, 1, 2, 3, 4, 5].map((v) => {
            const y = yFor(v);
            return (
              <g key={v}>
                <line
                  x1={padX}
                  y1={y}
                  x2={W - padX / 2}
                  y2={y}
                  stroke="#27272a"
                  strokeDasharray="2 4"
                />
                <text
                  x={padX - 10}
                  y={y + 4}
                  textAnchor="end"
                  fill="#71717a"
                  fontSize="10"
                  fontFamily="Inter, system-ui, sans-serif"
                >
                  ${v}M
                </text>
              </g>
            );
          })}

          {data.map((d, i) => {
            const cx = padX + slot * (i + 0.5);
            const x = cx - barW / 2;
            const y = yFor(d.revenue);
            const h = padTop + plotH - y;
            const isHover = hover === i;
            return (
              <g key={i}>
                <rect
                  x={x}
                  y={y}
                  width={barW}
                  height={h}
                  rx="6"
                  fill={isHover ? "#818cf8" : "#6366f1"}
                  style={{ transition: "fill 180ms ease" }}
                  onMouseEnter={() => setHover(i)}
                  onMouseLeave={() => setHover(null)}
                />
                <text
                  x={cx}
                  y={H - 14}
                  textAnchor="middle"
                  fill="#a1a1aa"
                  fontSize="11"
                  fontFamily="Inter, system-ui, sans-serif"
                >
                  {d.year}
                </text>
                {isHover && (
                  <g style={{ pointerEvents: "none" }}>
                    <rect
                      x={cx - 56}
                      y={y - 46}
                      width="112"
                      height="38"
                      rx="6"
                      fill="#18181b"
                      stroke="#3f3f46"
                    />
                    <text
                      x={cx}
                      y={y - 28}
                      textAnchor="middle"
                      fill="#fafafa"
                      fontSize="11"
                      fontWeight="600"
                      fontFamily="Inter, system-ui, sans-serif"
                    >
                      ${d.revenue.toFixed(1)}M
                    </text>
                    {growth[i] !== null && (
                      <text
                        x={cx}
                        y={y - 14}
                        textAnchor="middle"
                        fill="#a5b4fc"
                        fontSize="10"
                        fontFamily="Inter, system-ui, sans-serif"
                      >
                        +{growth[i].toFixed(0)}% YoY
                      </text>
                    )}
                  </g>
                )}
              </g>
            );
          })}
        </svg>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
