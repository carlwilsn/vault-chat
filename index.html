<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vault-chat</title>
    <script>
      // Set theme synchronously before any paint, so the first frame matches
      // the user's chosen theme: a core swap's own (src/coreSwap.ts), this
      // window's copy, then the laptop's (src/firstTheme.ts: keep in step).
      (function () {
        var t = null;
        try {
          var sw = sessionStorage.getItem("vc.coreSwap");
          if (sw) t = JSON.parse(sw).theme || null;
        } catch (e) {}
        try {
          if (t !== "light" && t !== "graphite" && t !== "contrast") t = sessionStorage.getItem("vc.theme");
        } catch (e) {}
        try {
          if (t !== "light" && t !== "graphite" && t !== "contrast") t = localStorage.getItem("vault_chat_theme");
        } catch (e) {}
        document.documentElement.dataset.theme = t === "light" || t === "contrast" ? t : "graphite";
      })();
    </script>
    <style>
      /* Critical CSS — applied on the first WebView paint, before Vite
         delivers the real stylesheet. Prevents the white/unstyled flash. */
      html, body {
        margin: 0;
        height: 100%;
        background: hsl(0 0% 10%);
        color: hsl(0 0% 92%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        overflow: hidden;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background: hsl(0 0% 98%);
        color: hsl(0 0% 12%);
      }
      html[data-theme="contrast"], html[data-theme="contrast"] body {
        background: #000;
        color: #fff;
      }
      #root { height: 100%; }
      html.vc-swapping #vault-splash { display: none; }
      html.vc-swapping #root { visibility: hidden; }
      /* A core swap's picture of the old screen: the first frame, until the
         restored screen fades in under it (src/coreSwap.ts revealAfterSwap). */
      #vc-swap-shot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        pointer-events: none;
        background-repeat: no-repeat;
        background-position: 0 0;
        background-size: 100% 100%;
      }

      /* Splash sits on top of #root while React mounts and the initial
         vault/file listing resolves. It fades out the moment the app
         signals it's ready. */
      #vault-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: hsl(0 0% 13%);
        color: hsl(0 0% 55%);
        letter-spacing: 0.04em;
        font-size: 11.5px;
        transition: opacity 180ms ease;
      }
      html[data-theme="light"] #vault-splash {
        background: hsl(0 0% 100%);
        color: hsl(0 0% 42%);
      }
      html[data-theme="contrast"] #vault-splash {
        background: #000;
        color: #d0d0d0;
      }
      #vault-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #vault-splash .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
        animation: vault-pulse 1.1s ease-in-out infinite;
      }
      @keyframes vault-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50%      { opacity: 0.85; transform: scale(1); }
      }
    </style>
  </head>

  <body>
    <script>
      // A core swap: paint the picture of the old screen as the very first frame (src/coreSwap.ts), so the reload
      // shows no blank. Before #root, so nothing of the new screen is drawn before it.
      try {
        if (sessionStorage.getItem("vc.coreSwap")) {
          var shot = sessionStorage.getItem("vc.coreSwapShot");
          if (shot && shot.indexOf("data:image/") === 0) {
            var d = document.createElement("div");
            d.id = "vc-swap-shot";
            d.style.backgroundImage = 'url("' + shot + '")';
            document.body.appendChild(d);
          }
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <div id="vault-splash"><span class="dot"></span>vault-chat</div>
    <script>
      // A core swap just loaded this bundle (src/coreSwap.ts): no splash, and nothing of the new screen shows until it
      // has put the chat, its scroll, the draft and the panes back, so the window keeps the old frame up to then
      // (restoreAfterSwap reveals it; 6 s at most).
      try {
        if (sessionStorage.getItem("vc.coreSwap")) {
          document.documentElement.classList.add("vc-swapping");
          setTimeout(function () {
            document.documentElement.classList.remove("vc-swapping");
            var d = document.getElementById("vc-swap-shot");
            if (d) d.remove();
          }, 6000);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
